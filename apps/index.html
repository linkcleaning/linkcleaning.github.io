<style>
:root {
  /* 링크클린 브랜드: 진한 청록 바탕 + 따뜻한 주황 강조 + 로고 초록 포인트. 상태별 세로 띠가 있는 한 줄 카드 목록 */
  --teal: #0d4f57;
  --teal-soft: #e3eeee;
  --orange: #e8792b;
  --green: #3fa34d;
  --ink: #17282b;
  --muted: #5d7275;
  --bg: #f4f6f4;
  --card: #ffffff;
  --line: #d6e0df;
  --plan: #8d9a9b;
  --font-display: "Do Hyeon", "IBM Plex Sans KR", sans-serif;
  --font-body: "IBM Plex Sans KR", -apple-system, "Apple SD Gothic Neo", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --teal: #5fb3b8; --teal-soft: #173337; --orange: #f2954f; --green: #6cc276;
    --ink: #e6eeee; --muted: #9db0b2; --bg: #0f1a1c; --card: #16252a; --line: #24393d; --plan: #7b8b8d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --teal: #5fb3b8; --teal-soft: #173337; --orange: #f2954f; --green: #6cc276;
  --ink: #e6eeee; --muted: #9db0b2; --bg: #0f1a1c; --card: #16252a; --line: #24393d; --plan: #7b8b8d;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 760px; margin: 0 auto; padding: 20px 16px 48px; display: grid; gap: 22px; }
header { display: grid; gap: 4px; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: 30px; margin: 0; color: var(--teal); text-wrap: balance; }
h1 span { color: var(--orange); }
.sub { color: var(--muted); font-size: 13px; margin: 0; }

.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.tile { appearance: none; border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 10px 8px; text-align: left; cursor: pointer; font: inherit; color: inherit; display: grid; gap: 2px; border-top: 4px solid var(--c); }
.tile b { font-family: var(--font-display); font-weight: 400; font-size: 26px; line-height: 1; font-variant-numeric: tabular-nums; color: var(--c); }
.tile small { font-size: 12px; color: var(--muted); }
.tile[aria-pressed="true"] { background: var(--teal-soft); border-color: var(--c); }
.tile:focus-visible, .chip:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }

.search { width: 100%; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: inherit; }

section { display: grid; gap: 8px; }
h2 { font-family: var(--font-display); font-weight: 400; font-size: 20px; margin: 0; display: flex; align-items: baseline; gap: 8px; }
h2 em { font-style: normal; font-family: var(--font-body); font-size: 12px; color: var(--muted); }

.row { background: var(--card); border: 1px solid var(--line); border-left: 5px solid var(--c); border-radius: 10px; padding: 11px 12px; display: grid; gap: 6px; }
.row.merged { opacity: .62; }
.top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.name { font-weight: 600; font-size: 16px; }
.pill { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 99px; color: var(--c); border: 1px solid var(--c); white-space: nowrap; }
.desc { margin: 0; color: var(--muted); font-size: 13.5px; }
.note { margin: 0; font-size: 13px; }
.note::before { content: "지금 "; color: var(--orange); font-weight: 600; }
.links { display: grid; gap: 6px; }
.lk { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--ink); background: var(--teal-soft); border-radius: 8px; padding: 7px 10px; min-width: 0; }
.lk b { flex: none; font-size: 11px; font-weight: 600; color: var(--bg); background: var(--teal); padding: 2px 7px; border-radius: 6px; }
.lk.store b { background: var(--orange); }
.lk span { font-size: 13px; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.lk.text { background: none; border: 1px dashed var(--line); color: var(--muted); }
.lk.text b { background: var(--plan); }
.empty { color: var(--muted); text-align: center; padding: 24px 0; }
footer { color: var(--muted); font-size: 12px; }
@media (max-width: 420px) { .tiles { grid-template-columns: repeat(2, 1fr); } }
</style>

  const links = (a.l || []).map(([k, u, lab]) => {
    if (k === "text") return `<div class="lk text"><b>메모</b><span>${esc(u)}</span></div>`;
    const tag = k === "store" ? (lab || "스토어") : (lab || "PWA");
    const txt = k === "store" ? (lab === "Google Play" ? "play.google.com · " + u.split("id=")[1] : short(u)) : short(u);
    return `<a class="lk ${k}" href="${u}" target="_blank" rel="noopener"><b>${esc(tag)}</b><span>${esc(txt)}</span></a>`;
  });
  return `<div class="row ${a.s==="merged"?"merged":""}" style="--c:${st.c}">
    <div class="top"><span class="name">${esc(a.name)}</span><span class="pill">${st.label}</span></div>
    <p class="desc">${esc(a.d)}</p>
    ${a.n ? `<p class="note">${esc(a.n)}</p>` : ""}
    ${links.length ? `<div class="links">${links.join("")}</div>` : ""}
  </div>`;
}

function render(){
  const q = document.getElementById("q").value.trim().toLowerCase();
  const html = cats.map(c => {
    const list = apps.filter(a => a.cat === c)
      .filter(a => !filter || a.s === filter)
      .filter(a => !q || (a.name + a.d + (a.n||"") + (a.repo||"")).toLowerCase().includes(q))
      .sort((x, y) => order.indexOf(x.s) - order.indexOf(y.s));
    if (!list.length) return "";
    return `<section><h2>${esc(c)}<em>${list.length}개</em></h2>${list.map(card).join("")}</section>`;
  }).join("");
  document.getElementById("list").innerHTML = html || `<p class="empty">찾는 앱이 없어요. 다른 이름으로 검색해 보세요.</p>`;
}
document.getElementById("q").addEventListener("input", render);
tiles(); render();
</script>
</body>
