<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>비서실장 대화</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap">
<style>
  :root {
    --paper: #F2F3F5; --card: #FFFFFF; --ink: #191919; --muted: #6B6E76; --line: #E2E4E9;
    --gold: #FFD233; --leaf: #14B86A; --danger: #F04438; --warm: #FF8A00;
    --sans: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html { height: 100%; background: var(--paper) !important; overflow: hidden; }
  body { margin: 0; height: 100%; overflow: hidden; background: var(--paper); color: var(--ink); font-family: var(--sans); -webkit-tap-highlight-color: transparent; display: flex; flex-direction: column; }
  .top { flex: none; z-index: 10; background: var(--ink); color: #fff; padding: 10px 16px 12px; border-radius: 0 0 22px 22px; }
  .top .in { max-width: 560px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
  .back { flex: none; display: inline-flex; align-items: center; gap: 4px; color: var(--gold); font: 800 14px var(--sans); text-decoration: none; padding: 8px 12px 8px 8px; border-radius: 999px; background: #ffffff14; }
  .who-head { flex: 1; min-width: 0; }
  .who-head b { display: block; font-size: 18px; font-weight: 900; letter-spacing: -0.02em; }
  .who-head small { display: block; font-size: 12px; color: #ffffffb3; margin-top: 1px; }
  .avatar { flex: none; width: 40px; height: 40px; border-radius: 999px; background: var(--gold); color: var(--ink); display: grid; place-items: center; font-weight: 900; font-size: 15px; }
  .scroller { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
  main { width: 100%; max-width: 560px; margin: 0 auto; padding: 12px 16px 8px; display: flex; flex-direction: column; gap: 10px; }
  .log { display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 88%; padding: 10px 13px; border-radius: 16px; font-size: 15px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .msg.me { align-self: flex-end; background: var(--gold); border-bottom-right-radius: 4px; }
  .msg.ai { align-self: flex-start; background: var(--card); border-bottom-left-radius: 4px; box-shadow: 0 1px 0 var(--line); }
  .msg .w { display: block; font-size: 11px; font-weight: 800; color: var(--muted); margin-bottom: 2px; }
  .msg.wait { color: var(--muted); }
  .msg.err { background: #FDECEA; color: var(--danger); }
  .order { align-self: stretch; border: 2px solid var(--gold); background: #FFFBEA; border-radius: 16px; padding: 12px; display: grid; gap: 8px; }
  .order .w { font-size: 11px; font-weight: 800; color: #8a5a00; }
  .order h4 { margin: 0; font-size: 15px; }
  .order textarea { min-height: 90px; background: #fff; font-size: 14px; }
  .order .row { display: flex; gap: 8px; }
  .order.sent { border-color: var(--leaf); background: #EEF9F2; }
  .order.dropped { opacity: .5; }
  .result { font-size: 13px; line-height: 1.5; }
  .result.ok { color: var(--leaf); font-weight: 700; } .result.bad { color: var(--danger); }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0; scrollbar-width: none; }
  .chips button { flex: none; appearance: none; border: 1.5px solid var(--ink); border-radius: 999px; padding: 7px 12px; background: #fff; color: var(--ink); font: 700 13px var(--sans); cursor: pointer; }
  .dock { flex: none; background: var(--paper); border-top: 1px solid var(--line); padding: 8px 16px 10px; }
  .dock .in { max-width: 560px; margin: 0 auto; display: grid; gap: 8px; }
  form.ask { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: end; }
  textarea { width: 100%; resize: none; border-radius: 14px; border: 1.5px solid var(--line); background: #fff; color: var(--ink); font: 16px/1.5 var(--sans); padding: 11px 13px; min-height: 48px; max-height: 150px; }
  textarea:focus, button:focus-visible, a:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .go { appearance: none; border: 0; border-radius: 999px; padding: 13px 18px; font: 800 15px var(--sans); background: var(--ink); color: #fff; cursor: pointer; }
  .go:disabled { opacity: .45; }
  .cancel { appearance: none; border: 0; border-radius: 999px; padding: 12px 16px; background: var(--paper); color: var(--ink); font: 700 14px var(--sans); cursor: pointer; }
  .row2 { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .end { appearance: none; border: 0; flex: 1; border-radius: 999px; padding: 12px; background: var(--gold); color: var(--ink); font: 900 15px var(--sans); cursor: pointer; text-align: center; text-decoration: none; }
  .tiny { appearance: none; border: 0; background: none; color: var(--muted); font: 700 12px var(--sans); cursor: pointer; padding: 6px; }
  .note { font-size: 12px; color: var(--muted); text-align: center; line-height: 1.6; }
  .pick { flex: none; appearance: none; border: 1.5px solid var(--line); background: #fff; border-radius: 999px; width: 48px; height: 48px; font-size: 20px; cursor: pointer; }
  .pick[hidden] { display: none; }
  form.ask.ph { grid-template-columns: auto 1fr auto; }
  .thumbs { display: flex; gap: 6px; overflow-x: auto; }
  .thumbs:empty { display: none; }
  .thumbs .t { position: relative; flex: none; }
  .thumbs img { width: 64px; height: 64px; object-fit: cover; border-radius: 12px; display: block; }
  .thumbs button { position: absolute; top: -6px; right: -6px; width: 22px; height: 22px; border-radius: 999px; border: 0; background: var(--ink); color: #fff; font: 800 12px var(--sans); cursor: pointer; }
  .msg .pics { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 4px; }
  .msg .pics img { width: 72px; height: 72px; object-fit: cover; border-radius: 10px; }
  .endbox { align-self: stretch; background: var(--card); border: 2px solid var(--ink); border-radius: 18px; padding: 16px; text-align: center; display: grid; gap: 10px; }
  .endbox b { font-size: 16px; }
</style>
</head>
<body>
<header class="top"><div class="in">
  <a class="back" id="backTop" href="https://linkcleaning.github.io/ai-secretary/office.html" target="_top">‹ 비서실</a>
  <div class="who-head"><b>비서실장 한정호</b><small id="st">연결 확인 중…</small></div>
  <div class="avatar" aria-hidden="true">정호</div>
</div></header>

<div class="scroller" id="scroller"><main>
  <div class="log" id="log" aria-live="polite"></div>
</main></div>

<div class="dock"><div class="in">
  <div class="chips" id="chips"></div>
  <div class="thumbs" id="thumbs"></div>
  <form class="ask" id="askForm">
    <button type="button" class="pick" id="pick" hidden aria-label="사진 넣기">📷</button>
    <input type="file" id="file" accept="image/*" multiple hidden>
    <label for="q" style="position:absolute;left:-9999px">비서실장에게 할 말</label>
    <textarea id="q" rows="1" placeholder="무엇이든 물어보거나 맡기세요"></textarea>
    <button class="go" type="submit" id="send">보내기</button>
  </form>
  <div class="row2">
    <button type="button" class="tiny" id="clearChat">대화 지우기</button>
    <a class="end" id="endBtn" href="https://linkcleaning.github.io/ai-secretary/office.html" target="_top">대화 끝내고 비서실로 ›</a>
  </div>
</div></div>

<script>
(function () {
  var APP = 'https://linkcleaning.github.io/ai-secretary/';
  var OFFICE = APP + 'office.html';
  var SERVER = 'Claude Code Remote';
  var DIRECT_ID = 'trig_01Xk87WNhrhY8S3yfMv7UtEk';
  var SHIFTS = [
    { id: 'trig_01DnpMf998Y8kXKhPRMSy89X', name: '아침 근무·보고', when: '매일 07:17' },
    { id: 'trig_01LkvJEAc13H5W9ETQgFM8hW', name: '낮 근무', when: '평일 13:17' },
    { id: 'trig_01U7ato84WLbsg9kVqZWHmet', name: '점심 링크 글', when: '매일 12:20' },
    { id: 'trig_019kCvQpgC2igRneY4x1FzHg', name: '저녁 보고', when: '매일 18:57' },
    { id: 'trig_016jPWUjqTzeqPu8iZXrVMEe', name: '저녁 홍보', when: '매일 20:47' },
    { id: 'trig_019DG2rzDWW4CC1kq9Fi5N5c', name: '항공권 확인', when: '화·금 06:43' }
  ];
  var logEl = document.getElementById('log'), qEl = document.getElementById('q'), sendBtn = document.getElementById('send'), stEl = document.getElementById('st');
  var mcp = null, sample = null, busy = false, ctl = null, turns = [];
  var STORE = 'chief-chat-v3';
  try { turns = JSON.parse(localStorage.getItem(STORE) || '[]') || []; } catch (e) { turns = []; }
  function save() { try { localStorage.setItem(STORE, JSON.stringify(turns.slice(-20))); } catch (e) {} }
  function el(t, c, x) { var e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; }
  var scroller = document.getElementById('scroller');
  function scrollEnd() { scroller.scrollTop = scroller.scrollHeight; }
  function today() { var d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate() + ' (' + '일월화수목금토'[d.getDay()] + ') ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
  function fmt(iso) { var d = new Date(iso); if (isNaN(d)) return ''; return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }

  // 돌아가기: 새 창으로 열렸으면 닫기 시도, 아니면 비서실 화면으로
  function goBack(ev) {
    try { if (window.opener && !window.opener.closed) { ev.preventDefault(); window.close(); return; } } catch (e) {}
  }
  document.getElementById('backTop').addEventListener('click', goBack);
  document.getElementById('endBtn').addEventListener('click', goBack);

  // 앱 기록 읽기 (공개 저장소의 앱 데이터)
  var db = null, brief = null;
  function loadBrief() { if (!db) return Promise.resolve(null); return db.doc('brief/today').get().then(function (d) { brief = d.exists ? d.data() : null; return brief; }).catch(function () { return null; }); }
  function getJSON(path) { return fetch(APP + 'data/' + path + '?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; }); }
  function getText(url) { return fetch(url + '?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.ok ? r.text() : ''; }).catch(function () { return ''; }); }

  var RULES = [
    '너는 링크클린 대표 한승우(대표님)의 AI 비서실장 "한정호"다. 비서실 전체의 컨트롤타워이자 보고 담당. 조직: 회장 이은경(이케이그룹) → 대표 한승우 → 비서실장 한정호 → 수석실(홍보 한정민, 소통 김기훈, 영업 안규태, 전략 최영길, 제휴 박시은, 부속실).',
    '말투: 존댓말, 짧고 명확하게. 휴대폰 화면이라 마크다운 제목·표·굵게(**)는 쓰지 말고 줄바꿈과 • 로만 정리. 모든 답은 한글(고유명사·주소만 예외).',
    '회사: 링크클린(제주, 2016년 설립, 청소 경력 12년, 064-763-4545, linkclean.co.kr) — 입주·이사·거주·상가·준공·특수청소·유품정리·폐기물·유리창·오존 탈취, 가격 비공개 방문견적. 이케이클린(서귀포 여성기업, 050-6744-1126, 대표 이은경)과 브랜드 분리. 크림어스(부산 광안리 케이크, 0507-1302-1431). 네이버 플레이스 4곳: 링크클린 제주시점·서귀포점, 이케이클린, 크림어스. 살림기록소는 회사와 무관한 살림 계정(스레드·블로그·유튜브, 반말).',
    '금지: 스카이차량·벌집클린 단어, 지어낸 현장 일화·통계·가격·후기, 고객 정보 공개. 네이버 순위는 재촉하지 않는다. 링크클린·이케이클린 블로그 최종 발행과 플레이스 소식은 대표님 승인 후.',
    '정기 근무: ' + SHIFTS.map(function (s) { return s.name + ' ' + s.when; }).join(', ') + '. 보고는 아침·저녁 두 번만.',
    '도구: report = 오늘 저녁 보고·최근 회의 결론, today = 오늘 각 업무 결과(앱 기록), notice = 전체 공지(새로 바뀐 것), status = 근무 실행 기록, dispatch = 실제 실행이 필요한 일의 지시서 카드.',
    '사진: 대표님이 사진을 보내면(블로그·현장·제품·문서 등) 먼저 무엇이 보이는지 짧게 말하고 원하는 걸 해 준다. 블로그용이면 링크클린 블로그 말투로 제목 3개·본문 초안·사진 순서·사진 설명(대체 텍스트)을 써 준다(살림 사진이면 살림기록소 반말). 얼굴·차량 번호·집 주소·고객 이름이 보이면 "이 사진은 가리고 쓰세요"라고 알린다. 실제 게시는 하지 못하니, 현장 사진을 6곳 홍보에 쓰려면 현장홍보 앱에 맡기라고 안내한다. 사진에 없는 내용(작업 시간·가격·고객 반응)은 지어내지 말고 대표님께 묻는다.',
    '일하는 법: 1) 질문·상담·글 초안·문구는 바로 답한다. 비서실 상황을 물으면 도구로 실제 기록을 확인하고 답한다(추측 금지). 2) 게시·앱 수정·파일 제작·최신 정보 조사·캘린더 등록처럼 실제로 해야 하는 일만 dispatch. instruction은 이 대화를 못 본 사람도 바로 할 수 있게 구체적으로. 카드를 띄운 건 아직 실행이 아니니 "지시서를 올렸어요, [지시하기]를 누르시면 시작해요"라고 말한다. 3) 너는 인터넷을 직접 볼 수 없다 — 날씨·뉴스·가격 같은 최신 정보는 조사 지시서를 제안. 4) 결제·송금·구매·삭제·계정 설정·고객 문자·홈택스 제출은 "준비만 하고 대표님 확인"으로 적는다. 5) 대화가 끝난 것 같으면 "더 없으시면 아래 [대화 끝내고 비서실로]를 누르세요"라고 짧게 안내한다.'
  ].join('\n');

  function bubble(cls, text, who) {
    var b = el('div', 'msg ' + cls); if (who) b.appendChild(el('span', 'w', who));
    var body = el('span', 'body', text || ''); b.appendChild(body); logEl.appendChild(b); scrollEnd(); return body;
  }
  function explain(e) {
    var c = e && e.code;
    if (c === 'approval_required' || c === 'not_in_manifest' || c === 'consent_required' || c === 'not_granted') return '처음 한 번 허락이 필요해요. 다시 눌러서 나오는 확인 창에서 [허용]을 눌러 주세요.';
    if (c === 'needs_reauth' || c === 'server_not_connected') return 'Claude Code 연결을 다시 해야 해요. claude.ai 설정 › 커넥터를 확인해 주세요.';
    if (c === 'server_unavailable' || c === 'upstream_error') return '응답이 늦어 시작됐는지 확실하지 않아요. 잠시 뒤 다시 확인해 주세요.';
    return '지시하지 못했어요 (' + (c || '알 수 없는 오류') + ').';
  }
  function orderCard(args) {
    var card = el('div', 'order');
    card.appendChild(el('span', 'w', '지시서 · 비서실장 직접 처리'));
    card.appendChild(el('h4', null, String(args.title || '대표님 지시')));
    var ta = el('textarea'); ta.value = String(args.instruction || ''); ta.setAttribute('aria-label', '지시 내용'); card.appendChild(ta);
    var row = el('div', 'row'), go = el('button', 'go', '지시하기'), no = el('button', 'cancel', '취소'), res = el('div', 'result');
    go.type = 'button'; no.type = 'button'; go.style.flex = '1';
    row.appendChild(go); row.appendChild(no); card.appendChild(row); card.appendChild(res);
    no.addEventListener('click', function () { card.classList.add('dropped'); go.disabled = no.disabled = true; res.textContent = '취소했어요.'; });
    go.addEventListener('click', function () {
      if (!mcp) { res.className = 'result bad'; res.textContent = 'Claude 앱이나 claude.ai에서 열어야 지시할 수 있어요.'; return; }
      go.disabled = no.disabled = true; go.textContent = '전달 중…';
      mcp.callTool(SERVER, 'fire_trigger', { trigger_id: DIRECT_ID, text: '[담당: 비서실장 한정호 · 대화에서 지시]\n대표님 지시: ' + ta.value.trim() }, { cache: false }).then(function () {
        card.classList.add('sent'); go.textContent = '지시 완료';
        res.className = 'result ok'; res.textContent = '시작했어요. 결과는 저녁 보고(또는 알림)로 드릴게요.';
        turns.push({ role: 'user', content: '(대표님이 "' + (args.title || '') + '" 지시서를 승인해 보냈음)' }); save();
      }).catch(function (e) { go.disabled = no.disabled = false; go.textContent = '지시하기'; res.className = 'result bad'; res.textContent = explain(e); });
    });
    logEl.appendChild(card); scrollEnd();
  }

  var lastRuns = {};
  var TOOLS = [
    { name: 'dispatch', description: '실제로 실행해야 하는 일의 지시서 카드를 대표님 화면에 띄운다. 대표님이 [지시하기]를 눌러야 실행된다.',
      inputSchema: { type: 'object', properties: { title: { type: 'string', description: '지시서 제목, 20자 이내' }, instruction: { type: 'string', description: '이 대화를 못 본 사람도 바로 실행할 수 있는 구체적인 지시(무엇을, 어디에, 어떤 기준으로, 결과 보고 방법)' } }, required: ['title', 'instruction'] },
      execute: function (input) { orderCard(input); return '지시서 카드를 띄웠음. 대표님이 [지시하기]를 눌러야 실행됨.'; } },
    { name: 'report', description: '오늘(또는 가장 최근) 저녁 보고와 최근 비서진 회의 3개의 제목·결론·할 일을 돌려준다.',
      execute: function () {
        return loadBrief().then(function (b) {
          if (b) return '기록 갱신 ' + (b.updated || '') + '\n' + (b.report || '') + '\n\n' + (b.meetings || '');
          return Promise.all([getJSON('day-report.json'), getJSON('meetings.json')]).then(function (a) {
          var r = a[0], m = a[1], out = [];
          if (r) out.push('저녁 보고(' + r.date + ' ' + (r.at || '') + '): ' + (r.headline || '') + '\n한 일: ' + (r.done || []).join(' / ') + '\n내일: ' + (r.tomorrow || []).join(' / ') + '\n승인할 것: ' + (r.approvals || []).join(' / '));
          ((m && m.items) || []).slice(0, 3).forEach(function (x) { out.push('회의 ' + x.date + ' ' + (x.at || '') + ' ' + x.title + '\n결론: ' + (x.conclusion || '') + '\n할 일: ' + JSON.stringify(x.actions || []).slice(0, 500)); });
          return out.join('\n\n') || '기록을 못 불러왔음.';
          });
        });
      } },
    { name: 'today', description: '오늘 비서실 각 업무의 결과(완료/못 함, 시각, 메모)를 돌려준다.',
      execute: function () {
        return loadBrief().then(function (b) { if (b && b.today) return '기록 갱신 ' + (b.updated || '') + '\n' + b.today; return getJSON('status.json'); }).then(function (s) {
          if (typeof s === 'string') return s;
          if (!s) return '앱 기록을 못 불러왔음.';
          var lines = ['기록 날짜 ' + s.date];
          Object.keys(s.items || {}).forEach(function (k) { var it = s.items[k] || {}; lines.push(k + ': ' + (it.done ? '완료' : '못 함') + ' ' + (it.at || '') + ' · ' + (it.note || '') + (it.detail ? ' · ' + String(it.detail).replace(/\n/g, ' / ').slice(0, 200) : '')); });
          return lines.join('\n');
        });
      } },
    { name: 'notice', description: '비서실 전체 공지판(새로 추가·변경된 것, 현재 기준표)의 앞부분을 돌려준다.',
      execute: function () { return loadBrief().then(function (b) { if (b && b.notice) return b.notice; return getText('https://linkcleaning.github.io/_src/ai-secretary/NOTICE.md').then(function (t) { return t ? t.slice(0, 6000) : '공지판을 못 불러왔음.'; }); }); } },
    { name: 'status', description: '정기 근무의 최근 실행 결과(완료/실패/진행 중)를 돌려준다.',
      execute: function () {
        return SHIFTS.map(function (s) { var r = lastRuns[s.id], l = r && r.last_run; return s.name + ' · ' + s.when + ' · 최근 ' + (l && l.fired_at ? fmt(l.fired_at) + ' ' + (/SUCCEEDED/.test(l.status) ? '완료' : /FAILED/.test(l.status) ? '실패' : '진행 중') : '기록 없음'); }).join('\n');
      } }
  ];

  function renderHistory() {
    logEl.textContent = '';
    bubble('ai', '대표님, 비서실장 한정호입니다.\n오늘 상황 보고, 궁금한 것, 맡기실 일 — 편하게 말씀하세요.', '비서실장');
    turns.forEach(function (t) { if (t.content.charAt(0) === '(') return; bubble(t.role === 'user' ? 'me' : 'ai', t.content, t.role === 'user' ? null : '비서실장'); });
  }
  function sampleError(e) {
    var c = e && e.code;
    if (c === 'not_granted' || c === 'sampling_disabled' || c === 'not_declared' || c === 'capability_disabled') return '이 화면이 Claude에게 묻는 것이 허용되지 않았어요. 다시 보내면 나오는 확인 창에서 [허용]을 눌러 주세요.';
    if (c === 'rate_limited') return '지금은 잠시 쉬어야 해요. 조금 뒤에 다시 보내 주세요.';
    if (c === 'session_expired') return 'Claude에 다시 로그인해 주세요.';
    if (c === 'prompt_too_large') return '대화가 너무 길어졌어요. [대화 지우기] 후 다시 물어봐 주세요.';
    return '답을 받지 못했어요. 다시 보내 주세요.';
  }
  var pics = [], maxPics = 0;
  var thumbsEl = document.getElementById('thumbs'), fileEl = document.getElementById('file');
  function renderThumbs() {
    thumbsEl.textContent = '';
    pics.forEach(function (f, i) { var w = el('div', 't'), im = el('img'); im.src = URL.createObjectURL(f); im.alt = '보낼 사진 ' + (i + 1); var x = el('button', null, '×'); x.type = 'button'; x.setAttribute('aria-label', '사진 빼기'); x.addEventListener('click', function () { pics.splice(i, 1); renderThumbs(); }); w.appendChild(im); w.appendChild(x); thumbsEl.appendChild(w); });
  }
  document.getElementById('pick').addEventListener('click', function () { fileEl.click(); });
  fileEl.addEventListener('change', function () { Array.prototype.forEach.call(fileEl.files || [], function (f) { if (pics.length < maxPics && /^image\//.test(f.type)) pics.push(f); }); fileEl.value = ''; renderThumbs(); });
  function send(text) {
    text = (text || '').trim(); if (busy) return;
    if (!text && pics.length) text = '이 사진 봐 줘';
    if (!text) return;
    if (!sample) { bubble('ai err', 'Claude 앱이나 claude.ai에서 열어야 대화할 수 있어요.'); return; }
    busy = true; sendBtn.textContent = '그만';
    var sendPics = pics.slice(); pics = []; renderThumbs();
    var mine = bubble('me', text);
    if (sendPics.length) { var pw = el('div', 'pics'); sendPics.forEach(function (f) { var im = el('img'); im.src = URL.createObjectURL(f); im.alt = ''; pw.appendChild(im); }); mine.parentNode.insertBefore(pw, mine); }
    turns.push({ role: 'user', content: (sendPics.length ? '[사진 ' + sendPics.length + '장 보냄] ' : '') + text }); save(); qEl.value = ''; fit();
    var out = bubble('ai wait', '생각 중…', '비서실장'), box = out.parentNode;
    ctl = new AbortController();
    var hist = turns.slice(-16); while (hist.length && hist[0].role !== 'user') hist.shift();
    var input = [{ role: 'user', content: RULES + '\n지금: ' + today() }, { role: 'assistant', content: '네, 대표님.' }].concat(hist);
    if (sendPics.length) hist[hist.length - 1] = { role: 'user', content: '(대표님이 지금 사진 ' + sendPics.length + '장을 함께 보냈음 — 아래 첨부)\n' + text };
    var opts = { cache: false, signal: ctl.signal, onText: function (u) { box.classList.remove('wait'); out.textContent = u.text; scrollEnd(); } };
    sample.limits().catch(function () { return {}; }).then(function (lim) { if (lim && lim.tools) opts.tools = TOOLS; if (sendPics.length) opts.images = sendPics; return sample(input, opts); })
      .then(function (r) { out.textContent = r.text; box.classList.remove('wait'); turns.push({ role: 'assistant', content: r.text }); save(); scrollEnd(); })
      .catch(function (e) {
        box.classList.remove('wait');
        if (e && e.code === 'cancelled') { out.textContent = e.text ? e.text + '\n(중단됨)' : '중단했어요.'; if (e.text) { turns.push({ role: 'assistant', content: e.text }); save(); } return; }
        box.classList.add('err'); out.textContent = (e && e.text ? e.text + '\n\n' : '') + sampleError(e);
      })
      .then(function () { busy = false; ctl = null; sendBtn.textContent = '보내기'; });
  }
  function fit() { qEl.style.height = 'auto'; qEl.style.height = Math.min(qEl.scrollHeight, 150) + 'px'; }
  qEl.addEventListener('input', fit);
  document.getElementById('askForm').addEventListener('submit', function (ev) { ev.preventDefault(); if (busy && ctl) { ctl.abort(); return; } send(qEl.value); });
  document.getElementById('clearChat').addEventListener('click', function () { if (busy) return; turns = []; save(); renderHistory(); });
  ['오늘 비서실 상황 보고해 줘', '📷 사진으로 블로그 글 써 줘', '내가 승인할 것만', '최근 회의 결론 요약', '새로 바뀐 공지 있어?'].forEach(function (c) {
    var b = el('button', null, c); b.type = 'button'; b.addEventListener('click', function () { if (c.charAt(0) === '📷'.charAt(0)) { qEl.value = '이 사진들로 링크클린 블로그 글 써 줘'; fit(); if (maxPics) fileEl.click(); else qEl.focus(); return; } send(c); }); document.getElementById('chips').appendChild(b);
  });
  renderHistory();

  var claude = window.claude;
  if (claude && claude.use) {
    claude.use('db').then(function (d) { db = d; if (d) loadBrief(); }).catch(function () {});
    claude.use('sample').then(function (s) { sample = s;
      if (s) s.limits().then(function (l) { if (l && l.images) { maxPics = Math.min(l.images.maxCount || 4, 6); fileEl.accept = (l.images.mediaTypes || ['image/*']).join(','); document.getElementById('pick').hidden = false; document.getElementById('askForm').classList.add('ph'); } }).catch(function () {}); stEl.textContent = s ? '컨트롤타워 · 보고 담당' : 'Claude 앱에서 열어야 대화할 수 있어요'; if (!s) sendBtn.disabled = true; }).catch(function () {});
    claude.use('mcp').then(function (m) {
      mcp = m; if (!m) return;
      try { m.watchTool(SERVER, 'list_triggers', { limit: 50 }, function (ev) {
        if (ev.type === 'data') { var p = ev.result && ev.result.payload, list = (p && (p.data || p.triggers)) || []; lastRuns = {}; list.forEach(function (x) { if (x && x.id) lastRuns[x.id] = x; }); }
      }, { refetchInterval: 120000 }); } catch (e) {}
    }).catch(function () {});
  } else { stEl.textContent = 'Claude 앱이나 claude.ai에서 열어 주세요'; sendBtn.disabled = true; }
})();
</script>
