<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>링크 미래전략실 · 비서실장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap">
<style>
  /* 링크 앱 스타일 가이드: 종이색 바탕 + 흰 카드, 위쪽 진한 청록 블록 한 장.
     레이아웃: 위에 조직도(대표 → 비서실장 → 수석실), 아래로 수석실별 지시 카드 */
  :root {
    --paper: #F2F3F5;
    --card: #FFFFFF;
    --brand: #191919;
    --brand-deep: #FFD233;
    --brand-tint: #FFF5CC;
    --accent: #FF8A00;
    --accent-soft: #FFD233;
    --leaf: #14B86A;
    --danger: #F04438;
    --ink: #191919;
    --muted: #6B6E76;
    --line: #E9EAEE;
    --sans: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    --num: "Noto Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); -webkit-tap-highlight-color: transparent; }
  body { padding: 0 0 calc(env(safe-area-inset-bottom, 0px) + 24px); }
  .top { background: var(--brand-deep); color: var(--ink); border-radius: 0 0 32px 32px; padding: calc(env(safe-area-inset-top, 0px) + 16px) max(12px, env(safe-area-inset-right, 0px)) 18px max(12px, env(safe-area-inset-left, 0px)); }
  .in { max-width: 520px; margin: 0 auto; }
  .eyebrow { display: inline-block; font-size: 11px; font-weight: 800; color: #FFD233; background: #191919; border-radius: 999px; padding: 4px 10px; }
  h1 { font-family: var(--num); font-weight: 900; letter-spacing: -0.03em; font-size: 30px; line-height: 38px; margin: 8px 0 4px; }
  .lead { color: #45474D; font-size: 14px; line-height: 1.6; margin: 0; }

  /* 조직도 */
  .org { margin-top: 16px; display: grid; justify-items: center; gap: 0; }
  .node { border-radius: 999px; padding: 7px 16px; font-weight: 700; font-size: 14px; white-space: nowrap; }
  .node small { font-weight: 500; opacity: .8; margin-left: 6px; font-size: 12px; }
  .node.ceo { background: #fff; color: var(--ink); }
  .node.chief { background: #191919; color: #FFD233; }
  .stem { width: 2px; height: 14px; background: #19191933; }
  .bar { width: 100%; height: 2px; background: #19191933; margin-top: 0; }
  .suseok { width: 100%; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
  .su { display: grid; gap: 2px; text-align: center; text-decoration: none; color: var(--ink); background: #ffffffa8; border-radius: 16px; padding: 10px 6px; position: relative; }
  .su::before { content: ""; position: absolute; top: -10px; left: 50%; width: 2px; height: 10px; background: #19191933; }
  .su b { font-size: 14px; }
  .su span { font-size: 11px; color: #45474D; line-height: 1.35; }
  .su:active { background: #fff; }

  .wrap { max-width: 520px; margin: 0 auto; display: grid; gap: 8px; padding: 10px max(12px, env(safe-area-inset-right, 0px)) 0 max(12px, env(safe-area-inset-left, 0px)); }
  .status { background: var(--card); border-radius: 14px; padding: 12px 16px; font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
  .dot { width: 8px; height: 8px; border-radius: 999px; background: var(--muted); flex: none; }
  .dot.ok { background: var(--leaf); } .dot.warn { background: var(--accent); } .dot.bad { background: var(--danger); }
  label.note { background: var(--card); border-radius: 14px; padding: 14px 16px; display: grid; gap: 8px; font-size: 12px; font-weight: 600; color: var(--muted); }
  textarea { width: 100%; min-height: 56px; resize: vertical; border-radius: 12px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); font: 15px/1.5 var(--sans); padding: 10px 12px; }
  textarea:focus, button:focus-visible, a:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

  /* 수석실 구역 */
  .dept { display: grid; gap: 8px; scroll-margin-top: 12px; }
  .dept-head { display: flex; align-items: baseline; gap: 8px; padding: 14px 4px 2px; }
  .dept-head h2 { margin: 0; font-family: var(--num); font-weight: 900; letter-spacing: -0.02em; font-size: 20px; }
  .dept-head span { font-size: 13px; color: var(--muted); }
  .task { background: var(--card); border-radius: 22px; padding: 16px; display: grid; gap: 10px; }
  .task-head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
  .who { font-size: 11px; font-weight: 700; color: var(--brand); letter-spacing: .02em; }
  .task h3 { margin: 2px 0 0; font-size: 17px; line-height: 1.35; font-weight: 700; }
  .task p { margin: 0; color: var(--muted); font-size: 13.5px; line-height: 1.55; }
  .chip { flex: none; font-size: 11px; font-weight: 600; border-radius: 6px; padding: 4px 8px; background: var(--brand-tint); color: var(--ink); white-space: nowrap; }
  .chip.pc { background: #FBE7D6; color: #8a4310; }
  .meta { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 12px; font-variant-numeric: tabular-nums; }
  .meta b { color: var(--ink); font-weight: 600; }
  .meta .ok { color: var(--leaf); font-weight: 600; } .meta .bad { color: var(--danger); font-weight: 600; }
  .go { appearance: none; border: 0; border-radius: 999px; padding: 14px; font: 700 16px var(--sans); background: var(--brand); color: #fff; cursor: pointer; transition: transform .12s, background .2s; }
  .go:active { transform: scale(.98); }
  .go.armed { background: #FFD233; color: var(--ink); }
  .go.busy { background: var(--line); color: var(--ink); cursor: progress; }
  .go.done { background: var(--leaf); color: #fff; }
  .go:disabled { opacity: .45; cursor: not-allowed; }
  .go.today { background: #E8F8EF; color: #0B6B3D; opacity: 1; }
  .badge { margin-left: auto; font-size: 12px; font-weight: 800; border-radius: 999px; padding: 4px 10px; background: #F2F3F5; color: var(--muted); white-space: nowrap; }
  .badge.done { background: #14B86A; color: #fff; }
  .applink { display: block; text-align: center; border-radius: 999px; padding: 13px; font-weight: 700; font-size: 15px; color: var(--brand); background: var(--brand-tint); text-decoration: none; }
  .result { font-size: 13px; line-height: 1.5; }
  .result.ok { color: var(--leaf); font-weight: 600; } .result.bad { color: var(--danger); }
  .foot { text-align: center; font-size: 13px; color: var(--muted); line-height: 1.7; padding-top: 10px; }
  .foot a { color: var(--brand); font-weight: 600; }
  /* 비서실장 대화창 */
  .chat { background: var(--card); border-radius: 22px; padding: 14px; display: grid; gap: 10px; }
  .chat-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .chat-head b { font-family: var(--num); font-weight: 900; font-size: 19px; letter-spacing: -0.02em; }
  .chat-head button { appearance: none; border: 0; background: none; color: var(--muted); font: 600 12px var(--sans); cursor: pointer; padding: 4px; }
  .log { display: grid; gap: 8px; max-height: 58vh; overflow-y: auto; overscroll-behavior: contain; }
  .msg { max-width: 88%; padding: 10px 12px; border-radius: 14px; font-size: 15px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .msg.me { justify-self: end; background: #FFD233; color: var(--ink); border-bottom-right-radius: 4px; }
  .msg.ai { justify-self: start; background: var(--paper); color: var(--ink); border-bottom-left-radius: 4px; }
  .msg.ai .who { display: block; margin-bottom: 2px; }
  .msg.wait { color: var(--muted); }
  .msg.err { background: #FBE9E6; color: var(--danger); }
  .order { justify-self: stretch; border: 2px solid var(--accent-soft); background: #FFF7F0; border-radius: 14px; padding: 12px; display: grid; gap: 8px; }
  .order .who { color: #8a4310; }
  .order h4 { margin: 0; font-size: 15px; }
  .order textarea { min-height: 84px; background: #fff; font-size: 14px; }
  .order .row { display: flex; gap: 8px; }
  .order .row .go { flex: 1; padding: 12px; font-size: 15px; }
  .order .cancel { appearance: none; border: 0; border-radius: 999px; padding: 12px 16px; background: var(--paper); color: var(--ink); font: 600 14px var(--sans); cursor: pointer; }
  .order.sent { border-color: var(--leaf); background: #F1F8EE; }
  .order.dropped { opacity: .55; }
  .ask { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: end; }
  .ask textarea { min-height: 48px; max-height: 160px; }
  .ask .go { padding: 13px 16px; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
  .chips button { flex: none; appearance: none; border: 0; border-radius: 999px; padding: 7px 12px; background: var(--brand-tint); color: var(--ink); font: 600 13px var(--sans); cursor: pointer; }
  details.extra-box { background: var(--card); border-radius: 14px; padding: 12px 16px; }
  details.extra-box summary { cursor: pointer; font-size: 13px; font-weight: 600; color: var(--muted); }
  details.extra-box textarea { margin-top: 8px; }
  @media (max-width: 360px) { .suseok { grid-template-columns: repeat(2, 1fr); } }
  @media (prefers-reduced-motion: reduce) { .go { transition: none; } }
  .totop { position: fixed; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); z-index: 50; width: 50px; height: 50px; border-radius: 999px; border: 0; background: #191919; color: #FFD233; font: 800 11px var(--sans); box-shadow: 0 4px 14px rgba(0,0,0,.25); display: none; cursor: pointer; line-height: 1.1; }
  .totop.show { display: block; }
</style>
</head>
<body>
<header class="top"><div class="in">
  <div class="eyebrow">링크 미래전략실</div>
  <h1>비서실장실</h1>
  <p class="lead">비서실장에게 무엇이든 물어보거나 맡기세요. 실제 일은 담당 부서에 지시서를 올려 대표님 확인 후 실행합니다. 결과는 휴대폰 알림으로 와요.</p>
  <nav class="org" aria-label="비서실 조직도">
    <div class="node ceo">대표<small>한승우</small></div>
    <div class="stem"></div>
    <div class="node chief">비서실장<small>Claude</small></div>
    <div class="stem"></div>
    <div class="bar"></div>
    <div class="suseok" id="orgChips"></div>
  </nav>
</div></header>

<main class="wrap">
  <div class="status" id="status"><span class="dot" id="dot"></span><span id="statusText">연결 확인 중…</span></div>
  <section class="chat" id="chat" aria-label="비서실장에게 말하기">
    <div class="chat-head"><b>비서실장에게 말하기</b><button type="button" id="clearChat">대화 지우기</button></div>
    <div class="log" id="log" aria-live="polite"></div>
    <div class="chips" id="chips"></div>
    <form class="ask" id="askForm">
      <label for="q" style="position:absolute;left:-9999px">질문이나 지시</label>
      <textarea id="q" placeholder="무엇이든 물어보거나 맡기세요. 예: 이번 주 블로그 주제 3개 추천해 줘"></textarea>
      <button class="go" type="submit" id="send">보내기</button>
    </form>
  </section>
  <details class="extra-box">
    <summary>아래 지시 버튼에 덧붙일 말 (선택)</summary>
    <label for="extra" style="position:absolute;left:-9999px">덧붙일 말</label>
    <textarea id="extra" placeholder="예: 오늘은 결로 주제로 써 줘 / 이 글로 올려 줘: …"></textarea>
  </details>
  <div id="depts" style="display:grid;gap:8px"></div>
  <p class="foot">
    오늘 준비된 글 보기 → <a href="https://linkcleaning.github.io/ai-secretary/">링크 미래전략실 앱</a><br>
    Claude 앱 채팅으로 말씀하셔도 됩니다.
  </p>
</main>

<button type="button" class="totop" id="toTop" aria-label="맨 위로">▲<br>맨 위</button>
<script>

  tt.addEventListener('click', function () { window.scrollTo({ top: 0, behavior: 'smooth' }); });
  var SERVER = 'Claude Code Remote';
  var APP = 'https://linkcleaning.github.io/ai-secretary/';
  // 수석실 → 소속 비서관 → 맡은 일
  var DEPTS = [
    { key: 'chief', name: '비서실장실', short: '실장실', duty: '아침 보고 총괄',
      tasks: [

      ] },
    { key: 'pr', name: '홍보수석실', short: '홍보수석', duty: '6곳 게시·청소팁',
      tasks: [
        { who: '홍보수석', id: 'trig_016jPWUjqTzeqPu8iZXrVMEe', daily: true, title: '6곳 홍보 지금 올려', desc: '현장홍보 앱에 맡긴 현장 글을 인스타·스레드·구글·당근·카카오에 올리고, 플레이스용 글과 구글 리뷰 답글 초안을 보냅니다.', when: '매일 20:47', time: '약 10분', pc: true },
        { who: '콘텐츠비서관', id: 'trig_016THjQ2oRs8P7hvAetYtXz8', daily: true, title: '청소팁 카드 만들어', desc: '계절 청소팁 카드 3장과 6곳 글을 만들어 대기열에 넣고, 홈페이지 Q&A 칼럼을 1개 추가합니다. 게시는 그날 저녁.', when: '화·금 10:37', time: '약 8분', pc: true,
          extra: '대표님이 지휘실 버튼으로 직접 요청했다. 0단계의 "최근 3일 안에 끝난 작업이 있으면 종료" 조건은 이번엔 무시하고 진행한다(대기 작업이 이미 있으면 그 사실만 알리고 종료).' }
      ] },
    { key: 'sns', name: '소통수석실', short: '소통수석', duty: '스레드·댓글',
      tasks: [

      ] },
    { key: 'sales', name: '영업수석실', short: '영업수석', duty: '입찰·팔로업',
      tasks: [
        { who: '입찰비서관', id: 'trig_014aFaCPZaiNux3JGX6HAKiB', daily: true, title: '청소 입찰·공고 찾아 줘', desc: '제주도청·제주시·서귀포시·나라장터에서 청소·미화·방역·폐기물 관련 입찰과 견적·모집 공고를 찾아 앱 \'입찰·공고 비서관\' 칸에 올리고, 새 공고가 있으면 알려 드립니다.', when: '평일 08:23', time: '약 5분', pc: true }
      ],
      app: { title: '고객 팔로업·후기 요청', desc: '견적 후 연락 없는 고객, 작업 끝난 고객의 후기 요청 문자는 앱 \'영업\' 탭에서 바로 보냅니다. 비서실장 아침 보고에도 건수가 올라옵니다.' } },
    { key: 'strategy', name: '전략수석실', short: '전략수석', duty: '키워드·노출 점검',
      tasks: [
        { who: '전략수석', id: 'trig_015PL4T2GXK3r5JGdzAkgvop', title: 'AI·검색 노출 점검해 줘', desc: '"제주 입주청소" 등 6개 검색어에서 링크클린이 나오는지, 경쟁 업체는 누구인지 표로 정리해 보냅니다.', when: '매월 1일 08:47', time: '약 3분' }
      ] },
    { key: 'office', name: '부속실', short: '부속실', duty: '루틴·건강·메모',

      ] },
  ];

  var mcp = null, lastRuns = {};
  var dot = document.getElementById('dot'), statusText = document.getElementById('statusText');
  function setStatus(kind, text) { dot.className = 'dot ' + (kind || ''); statusText.textContent = text; }
  function fmt(iso) {
    if (!iso) return ''; var d = new Date(iso); if (isNaN(d)) return '';
    var p = function (n) { return String(n).padStart(2, '0'); };
    return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function dayKey(d) { return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
  var FIRED = 'fired-v1';
  function localFired() { try { return JSON.parse(localStorage.getItem(FIRED) || '{}') || {}; } catch (e) { return {}; } }
  function markFired(id) { var m = localFired(); m[id] = dayKey(new Date()); try { localStorage.setItem(FIRED, JSON.stringify(m)); } catch (e) {} }
  /** 하루 1번 업무: 오늘 이미 실행(실패 제외)했으면 true */
  function doneToday(t) {
    if (!t || !t.daily) return false;
    var today = dayKey(new Date());
    var r = lastRuns[t.id], last = r && r.last_run;
    if (last && last.fired_at && dayKey(new Date(last.fired_at)) === today && !/FAILED/.test(last.status || '')) return true;
    return localFired()[t.id] === today && !(last && last.fired_at && dayKey(new Date(last.fired_at)) === today && /FAILED/.test(last.status || ''));
  }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  function renderOrg() {

    DEPTS.filter(function (d) { return d.key !== 'chief'; }).forEach(function (d) {
      var a = el('a', 'su'); a.href = '#' + d.key;

    if (c === 'refused') return '이 질문에는 답하기 어려워요. 다르게 물어봐 주세요.';
    if (c === 'prompt_too_large') return '대화가 너무 길어졌어요. [대화 지우기] 후 다시 물어봐 주세요.';
    return '답을 받지 못했어요. 다시 보내 주세요.';
  }

  function send(text) {
    text = (text || '').trim(); if (!text || busy) return;
    if (!sample) { bubble('ai err', 'Claude 앱이나 claude.ai에서 열어야 비서실장과 대화할 수 있어요.'); return; }
    busy = true; var sendBtn = document.getElementById('send'); sendBtn.textContent = '그만'; 
    bubble('me', text); turns.push({ role: 'user', content: text }); save();
    document.getElementById('q').value = '';
    var out = bubble('ai wait', '생각 중…', '비서실장'); var box = out.parentNode;
    ctl = new AbortController();
    var hist = turns.slice(-14);
    while (hist.length && hist[0].role !== 'user') hist.shift();
    var input = [{ role: 'user', content: rules() }].concat(hist);
    var opts = { cache: false, signal: ctl.signal, onText: function (u) { box.classList.remove('wait'); out.textContent = u.text; logEl.scrollTop = logEl.scrollHeight; } };
    sample.limits().catch(function () { return {}; }).then(function (lim) {
      if (lim && lim.tools) opts.tools = TOOLS;
      return sample(input, opts);
    }).then(function (r) {
      out.textContent = r.text; box.classList.remove('wait');
      turns.push({ role: 'assistant', content: r.text }); save();
    }).catch(function (e) {
      if (e && e.code === 'cancelled') { box.classList.remove('wait'); out.textContent = (e.text || '') + (e.text ? '\n(중단됨)' : '중단했습니다.'); if (e.text) { turns.push({ role: 'assistant', content: e.text }); save(); } return; }
      box.classList.remove('wait'); box.classList.add('err'); out.textContent = (e && e.text ? e.text + '\n\n' : '') + sampleError(e);
    }).then(function () { busy = false; ctl = null; sendBtn.textContent = '보내기'; });
  }

  document.getElementById('askForm').addEventListener('submit', function (ev) {
    ev.preventDefault();
    if (busy && ctl) { ctl.abort(); return; }
    send(document.getElementById('q').value);
  });
  document.getElementById('q').addEventListener('keydown', function (ev) { if (ev.key === 'Enter' && (ev.metaKey || ev.ctrlKey)) { ev.preventDefault(); send(this.value); } });
  document.getElementById('clearChat').addEventListener('click', function () { if (busy) return; turns = []; save(); renderHistory(); });
  var CHIPS = ['이번 주 블로그 주제 3개 추천', '견적 후 답 없는 고객에게 보낼 문자', '각 부서 최근 업무 상황', '도쿄 박람회 다녀와서 올릴 글 계획'];
  var chipsEl = document.getElementById('chips');
  CHIPS.forEach(function (c) { var b = el('button', null, c); b.type = 'button'; b.addEventListener('click', function () { send(c); }); chipsEl.appendChild(b); });
  renderHistory();
  if (claude && claude.use) {
    claude.use('sample').then(function (s2) { sample = s2; if (!sample) document.getElementById('send').disabled = true; }).catch(function () {});
  } else { document.getElementById('send').disabled = true; }

  if (claude && claude.use) {
    claude.use('mcp').then(function (m) {
      mcp = m;
      if (!mcp) { setStatus('bad', '이 화면에서는 지시 버튼이 작동하지 않아요. Claude 앱이나 claude.ai에서 열어 주세요.'); return; }
      render(); setStatus('ok', '비서실 연결됨 · 지시 대기 중'); startWatch();
    }).catch(function () { setStatus('bad', 'Claude 앱이나 claude.ai에서 열어 주세요.'); });
  } else { setStatus('bad', 'Claude 앱이나 claude.ai에서 열어 주세요.'); }
})();
</script>
