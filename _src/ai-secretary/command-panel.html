<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>비서 지휘실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
  /* 레이아웃: 한 손 조작용 세로 한 줄 — 위에 상태 요약, 아래로 큼직한 지시 버튼 카드 */
  :root {
    --bg: #070d1c;
    --panel: #0f1a33;
    --line: rgba(255, 255, 255, 0.09);
    --ink: #eef2fb;
    --muted: #93a0bd;
    --gold: #e9c25a;
    --gold-ink: #0a1226;
    --ok: #4fd1a1;
    --warn: #f2b84b;
    --bad: #f27a7a;
    --display: "Gowun Batang", "Apple SD Gothic Neo", serif;
    --body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); -webkit-tap-highlight-color: transparent; }
  body { padding: calc(env(safe-area-inset-top, 0px) + 18px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 28px) max(16px, env(safe-area-inset-left, 0px)); }
  .wrap { max-width: 480px; margin: 0 auto; display: grid; gap: 14px; }
  .eyebrow { font-size: 11px; letter-spacing: .22em; color: var(--gold); opacity: .85; font-weight: 700; }
  h1 { font-family: var(--display); font-size: 30px; margin: 4px 0 0; text-wrap: balance; }
  .lead { color: var(--muted); font-size: 14px; line-height: 1.6; margin: 6px 0 0; }
  .status { border: 1px solid var(--line); background: var(--panel); border-radius: 18px; padding: 12px 14px; font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }
  label.note { display: grid; gap: 6px; font-size: 13px; color: var(--muted); }
  textarea { width: 100%; min-height: 64px; resize: vertical; border-radius: 14px; border: 1px solid var(--line); background: #0a1226; color: var(--ink); font: 15px/1.5 var(--body); padding: 10px 12px; }
  textarea:focus, button:focus-visible, a:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .task { border: 1px solid var(--line); background: var(--panel); border-radius: 22px; padding: 16px; display: grid; gap: 10px; }
  .task-head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
  .task h2 { margin: 0; font-size: 18px; line-height: 1.35; }
  .task p { margin: 0; color: var(--muted); font-size: 13.5px; line-height: 1.55; }
  .chip { flex: none; font-size: 11px; font-weight: 700; border-radius: 999px; padding: 4px 9px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .chip.pc { color: var(--warn); border-color: rgba(242, 184, 75, .35); }
  .meta { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 12px; font-variant-numeric: tabular-nums; }
  .meta b { color: var(--ink); font-weight: 500; }
  .meta .ok { color: var(--ok); } .meta .bad { color: var(--bad); }
  .go { appearance: none; border: 0; border-radius: 16px; padding: 15px 14px; font: 700 16px var(--body); background: var(--gold); color: var(--gold-ink); cursor: pointer; transition: transform .12s, background .2s; }
  .go:active { transform: scale(.98); }
  .go.armed { background: var(--warn); }
  .go.busy { background: #3a4561; color: var(--ink); cursor: progress; }
  .go.done { background: var(--ok); color: #05261a; }
  .go:disabled { opacity: .5; cursor: not-allowed; }
  .result { font-size: 13px; line-height: 1.5; min-height: 0; }
  .result.ok { color: var(--ok); } .result.bad { color: var(--bad); }
  .foot { text-align: center; font-size: 13px; color: var(--muted); line-height: 1.7; }
  .foot a { color: var(--gold); }
  @media (prefers-reduced-motion: reduce) { .go { transition: none; } }
</style>
</head>
<body>
<main class="wrap">
  <header>
    <div class="eyebrow">CHIEF OF STAFF · COMMAND</div>
    <h1>비서 지휘실</h1>
    <p class="lead">버튼을 두 번 누르면 예약 시간을 기다리지 않고 비서가 지금 바로 일을 시작합니다. 결과는 휴대폰 알림으로 옵니다.</p>
  </header>

  <div class="status" id="status"><span class="dot" id="dot"></span><span id="statusText">연결 확인 중…</span></div>

  <label class="note" for="extra">비서에게 덧붙일 말 (선택)
    <textarea id="extra" placeholder="예: 오늘은 결로 주제로 써 줘 / 이 글로 올려 줘: …"></textarea>
  </label>

  <section id="tasks" class="wrap" style="gap:12px"></section>

  <p class="foot">
    오늘 준비된 글 보기 → <a href="https://linkcleaning.github.io/ai-secretary/">AI 비서실 앱</a><br>
    채팅으로 "스레드 올려"처럼 말씀하셔도 됩니다.
  </p>
</main>

<script>
(function () {
  var SERVER = 'Claude Code Remote';
  var TASKS = [
    { id: 'trig_01YVSejMCeuJTD6iRW1xNzwH', title: '☀️ 오늘 업무 다시 써 줘', desc: '블로그 초안(월·목)·아침 스레드 글·황금키워드·현장 메모·제주 소식을 새로 써서 앱에 올립니다. 평소엔 매일 아침 7시 17분에 자동.', time: '약 5분' },
    { id: 'trig_018fBTXudMg5QidizdmQs5gH', title: '🧵 아침 스레드 지금 올려', desc: '앱에 준비된 오늘 아침 스레드 글을 @linkcleaning 계정에 바로 올리고, 30분 뒤 댓글에 답글까지 답니다.', time: '약 3분', pc: true },
    { id: 'trig_016jPWUjqTzeqPu8iZXrVMEe', title: '📣 6곳 홍보 지금 올려', desc: '현장홍보 앱에 맡겨 둔 현장 글을 인스타·스레드·구글·당근·카카오에 지금 올리고, 플레이스용 글과 리뷰 답글 초안을 보내 드립니다. 평소엔 저녁 8시 47분.', time: '약 10분', pc: true },
    { id: 'trig_016THjQ2oRs8P7hvAetYtXz8', title: '🧼 청소팁 카드 만들어', desc: '계절 청소팁 카드 3장과 6곳 글을 만들어 대기열에 넣고, 홈페이지 Q&A 칼럼도 1개 추가합니다. 게시는 그날 저녁 8시 47분.', time: '약 8분', pc: true,
      extra: '대표님이 지휘실 버튼으로 직접 요청했다. 0단계의 "최근 3일 안에 끝난 작업이 있으면 종료" 조건은 이번엔 무시하고 진행한다(대기 작업이 이미 있으면 그 사실만 알리고 종료).' },
    { id: 'trig_01Lg8r73Cc4NYs9sVYnDKyXC', title: '🛒 쿠팡 스레드 글 준비', desc: '쿠팡파트너스 계정용 살림 팁 글과 오늘의 쿠팡 상품 글을 준비해 보내 드립니다. 평소엔 저녁 6시 43분.', time: '약 2분' }
  ];

  var mcp = null;
  var lastRuns = {};
  var tasksEl = document.getElementById('tasks');
  var dot = document.getElementById('dot');
  var statusText = document.getElementById('statusText');

  function setStatus(kind, text) { dot.className = 'dot ' + (kind || ''); statusText.textContent = text; }
  function fmt(iso) {
    if (!iso) return '';
    var d = new Date(iso); if (isNaN(d)) return '';
    var p = function (n) { return String(n).padStart(2, '0'); };
    return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  function render() {
    tasksEl.textContent = '';
    TASKS.forEach(function (t) {
      var card = document.createElement('article'); card.className = 'task';
      var head = document.createElement('div'); head.className = 'task-head';
      var h = document.createElement('h2'); h.textContent = t.title; head.appendChild(h);
      var chip = document.createElement('span'); chip.className = 'chip' + (t.pc ? ' pc' : '');
      chip.textContent = t.pc ? 'PC 켜져 있어야 함' : t.time; head.appendChild(chip);
      card.appendChild(head);
      var p = document.createElement('p'); p.textContent = t.desc; card.appendChild(p);
      var meta = document.createElement('div'); meta.className = 'meta'; meta.id = 'meta-' + t.id;
      card.appendChild(meta);
      var btn = document.createElement('button'); btn.className = 'go'; btn.type = 'button'; btn.id = 'go-' + t.id;
      btn.textContent = '지금 시키기'; btn.disabled = !mcp;
      var res = document.createElement('div'); res.className = 'result'; res.id = 'res-' + t.id; res.setAttribute('aria-live', 'polite');
      btn.addEventListener('click', function () { onTap(t, btn, res); });
      card.appendChild(btn); card.appendChild(res);
      tasksEl.appendChild(card);
    });
    renderMeta();
  }

  function renderMeta() {
    TASKS.forEach(function (t) {
      var el = document.getElementById('meta-' + t.id); if (!el) return;
      var r = lastRuns[t.id]; el.textContent = '';
      if (!r) return;
      var last = r.last_run;
      if (last && last.fired_at) {
        var s = document.createElement('span');
        var st = last.status || '';
        var good = /SUCCEEDED/.test(st), bad = /FAILED/.test(st);
        s.innerHTML = '';
        s.append('마지막 실행 ');
        var b = document.createElement('b'); b.textContent = fmt(last.fired_at); s.appendChild(b);
        var tag = document.createElement('span'); tag.className = good ? 'ok' : bad ? 'bad' : '';
        tag.textContent = good ? ' · 완료' : bad ? ' · 실패' : ' · 진행 중'; s.appendChild(tag);
        el.appendChild(s);
      }
      if (r.next_run_at) {
        var n = document.createElement('span'); n.append('다음 예정 ');
        var b2 = document.createElement('b'); b2.textContent = fmt(r.next_run_at); n.appendChild(b2); el.appendChild(n);
      }
    });
  }

  var armTimers = {};
  function onTap(t, btn, res) {
    if (!mcp || btn.classList.contains('busy')) return;
    if (!btn.classList.contains('armed')) {
      btn.classList.add('armed'); btn.textContent = '한 번 더 누르면 실행';
      clearTimeout(armTimers[t.id]);
      armTimers[t.id] = setTimeout(function () { btn.classList.remove('armed'); btn.textContent = '지금 시키기'; }, 4000);
      return;
    }
    clearTimeout(armTimers[t.id]);
    btn.classList.remove('armed'); btn.classList.add('busy'); btn.textContent = '비서에게 전달 중…';
    res.className = 'result'; res.textContent = '';
    var note = (document.getElementById('extra').value || '').trim();
    var text = [t.extra, note ? '대표님 덧붙임: ' + note : ''].filter(Boolean).join('\n');
    var input = { trigger_id: t.id };
    if (text) input.text = text;
    mcp.callTool(SERVER, 'fire_trigger', input, { cache: false }).then(function () {
      btn.classList.remove('busy'); btn.classList.add('done'); btn.textContent = '✅ 시작했어요';
      res.className = 'result ok'; res.textContent = '비서가 일을 시작했습니다 (' + t.time + '). 끝나면 알림이 와요.';
      setTimeout(function () { btn.classList.remove('done'); btn.textContent = '지금 시키기'; }, 8000);
      refresh();
    }).catch(function (e) {
      btn.classList.remove('busy'); btn.textContent = '지금 시키기';
      res.className = 'result bad'; res.textContent = explain(e, true);
    });
  }

  function explain(e, isWrite) {
    var c = e && e.code;
    if (c === 'approval_required' || c === 'not_in_manifest' || c === 'consent_required') return '이 페이지가 비서에게 일을 시키려면 허락이 필요해요. 다시 눌러서 나오는 확인 창에서 [허용]을 눌러 주세요.';
    if (c === 'needs_reauth') return 'Claude Code 연결이 만료됐어요. claude.ai 설정 › 커넥터에서 다시 연결해 주세요.';
    if (c === 'server_not_connected' || c === 'selection_required') return 'Claude Code 연결을 찾지 못했어요. claude.ai 설정 › 커넥터를 확인해 주세요.';
    if (c === 'blocked_by_policy') return '조직 정책으로 막혀 있어요.';
    if (c === 'server_unavailable' || c === 'upstream_error') return isWrite ? '응답이 늦어 시작됐는지 확실하지 않아요. 잠시 뒤 위의 "마지막 실행" 시각을 보고, 바뀌지 않았으면 다시 눌러 주세요.' : '잠시 연결이 불안정해요.';
    if (c === 'tool_error') return '비서가 이 작업을 시작하지 못했어요: ' + (e.message || '').slice(0, 120);
    return '실행하지 못했어요 (' + (c || '알 수 없는 오류') + ').';
  }

  var unwatch = null;
  function refresh() { if (mcp && mcp.invalidate) mcp.invalidate(SERVER, 'list_triggers').catch(function () {}); }
  function startWatch() {
    try {
      unwatch = mcp.watchTool(SERVER, 'list_triggers', { limit: 50 }, function (ev) {
        if (ev.type === 'data') {
          var p = ev.result && ev.result.payload;
          var list = (p && (p.data || p.triggers)) || [];
          lastRuns = {};
          list.forEach(function (x) { if (x && x.id) lastRuns[x.id] = x; });
          renderMeta();
          setStatus('ok', '연결됨 · 비서 대기 중');
        } else if (ev.type === 'error') {
          var c = ev.error && ev.error.code;
          if (c === 'approval_required' || c === 'not_in_manifest' || c === 'consent_required') setStatus('warn', '처음 한 번 허락이 필요해요 — 아무 버튼이나 두 번 눌러 허용해 주세요');
          else if (c === 'needs_reauth' || c === 'server_not_connected') { lastRuns = {}; renderMeta(); setStatus('bad', explain(ev.error)); }
          else setStatus('warn', '실행 기록을 잠시 못 불러왔어요 (버튼은 작동해요)');
        }
      }, { refetchInterval: 60000 });
    } catch (e) { setStatus('warn', '실행 기록을 못 불러왔어요 (버튼은 작동해요)'); }
  }

  render();
  setStatus('', '연결 확인 중…');
  var claude = window.claude;
  if (claude && claude.use) {
    claude.use('mcp').then(function (m) {
      mcp = m;
      if (!mcp) { setStatus('bad', '이 화면에서는 버튼이 작동하지 않아요. Claude 앱이나 claude.ai에서 열어 주세요.'); return; }
      render();
      setStatus('ok', '연결됨 · 비서 대기 중');
      startWatch();
    }).catch(function () { setStatus('bad', 'Claude 앱이나 claude.ai에서 열어 주세요.'); });
  } else {
    setStatus('bad', 'Claude 앱이나 claude.ai에서 열어 주세요.');
  }
})();
</script>
</body>
</html>
