<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<!-- iOS 홈 화면 앱(전체화면) 설정 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="카드지갑">
<meta name="application-name" content="카드지갑">
<meta name="theme-color" content="#0B2A31">
<meta name="format-detection" content="telephone=no">
<title>카드지갑</title>
<link rel="apple-touch-icon" id="appleIcon">
<link rel="icon" id="favIcon">
<link rel="manifest" id="manifestLink">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
/* 아이콘 + 매니페스트를 파일 없이 즉석 생성 (단일 파일 유지) */
(function () {
  const S = 180, c = document.createElement('canvas'); c.width = c.height = S;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, S, S);
  g.addColorStop(0, '#11606D'); g.addColorStop(1, '#0B2A31');
  x.fillStyle = g; x.fillRect(0, 0, S, S);
  function rr(X, Y, W, H, R, fill) {
    x.beginPath(); x.moveTo(X + R, Y); x.arcTo(X + W, Y, X + W, Y + H, R); x.arcTo(X + W, Y + H, X, Y + H, R);
    x.arcTo(X, Y + H, X, Y, R); x.arcTo(X, Y, X + W, Y, R); x.closePath(); x.fillStyle = fill; x.fill();
  }
  x.shadowColor = 'rgba(0,0,0,.35)'; x.shadowBlur = 10; x.shadowOffsetY = -3;
  rr(30, 38, 120, 76, 12, '#6DBE45');
  rr(30, 62, 120, 76, 12, '#F08A3C');
  rr(30, 88, 120, 76, 12, '#FFFFFF');
  x.shadowColor = 'transparent';
  x.fillStyle = '#0E4F5C';
  const bars = [3, 1, 2, 1, 3, 2, 1, 1, 3, 1, 2, 2, 1, 3, 1, 2, 1, 3, 2, 1];
  let bx = 46; bars.forEach((w, i) => { if (i % 2 === 0) x.fillRect(bx, 108, w * 2, 38); bx += w * 2 + 1; });
  const png = c.toDataURL('image/png');
  document.getElementById('appleIcon').href = png;
  document.getElementById('favIcon').href = png;
  const start = location.href.split('#')[0];
  const manifest = {
    name: '나만의 스마트 카드지갑', short_name: '카드지갑', start_url: start, scope: start,
    display: 'standalone', background_color: '#0B2A31', theme_color: '#0B2A31',
    icons: [{ src: png, sizes: '180x180', type: 'image/png' }]
  };
  document.getElementById('manifestLink').href =
    'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifest));
})();
</script>
<style>
  :root { --teal:#0E4F5C; --deep:#0B2A31; --orange:#F08A3C; --green:#6DBE45; --paper:#F6F1EA; }
  html, body { background: var(--deep); }
  html.lock, html.lock body { overflow: hidden; }
  body {
    font-family: 'IBM Plex Sans KR', system-ui, sans-serif; color: #fff;
    -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(120% 60% at 100% 0%, rgba(240,138,60,.16), transparent 60%),
      radial-gradient(90% 50% at 0% 10%, rgba(17,96,109,.55), transparent 70%),
      var(--deep);
    min-height: 100dvh;
  }
  input, textarea, select { -webkit-user-select: text; user-select: text; font-size: 16px; }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }

  /* 카드 스택 */
  .card {
    position: absolute; left: 0; right: 0; aspect-ratio: 1.586; border-radius: 18px;
    transform: translateY(var(--y)); cursor: pointer;
    transition: transform .55s cubic-bezier(.2,.85,.25,1), opacity .35s ease;
    box-shadow: 0 -4px 18px rgba(0,0,0,.28), 0 1px 0 rgba(255,255,255,.08) inset;
  }
  .card:active { transform: translateY(calc(var(--y) - 4px)); }
  .card.away { transform: translateY(calc(var(--y) + 70vh)); opacity: 0; }
  .card.enter { animation: rise .6s cubic-bezier(.2,.85,.25,1) backwards; }
  @keyframes rise { from { opacity: 0; transform: translateY(calc(var(--y) + 46px)); } }

  .face { position: absolute; inset: 0; border-radius: inherit; overflow: hidden; padding: 18px 20px; color: #fff; }
  .face:not(.photo)::before {
    content: ''; position: absolute; width: 70%; aspect-ratio: 1; right: -22%; top: -55%; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,.22), rgba(255,255,255,0) 65%);
  }
  .face:not(.photo)::after {
    content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: repeating-linear-gradient(115deg, rgba(255,255,255,.035) 0 2px, transparent 2px 9px);
  }
  .face.photo { text-shadow: 0 1px 6px rgba(0,0,0,.45); }
  .badge {
    font-family: 'JetBrains Mono', monospace; font-size: 9.5px; letter-spacing: .14em; font-weight: 700;
    padding: 4px 8px; border-radius: 999px; background: rgba(255,255,255,.2); white-space: nowrap; text-shadow: none;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  .star { color: #FFD166; filter: drop-shadow(0 1px 3px rgba(0,0,0,.35)); }

  /* 상세(확대) 화면 */
  #flyCard {
    position: fixed; border-radius: 20px; z-index: 3; cursor: pointer;
    transition: left .5s cubic-bezier(.2,.85,.25,1), top .5s cubic-bezier(.2,.85,.25,1),
                width .5s cubic-bezier(.2,.85,.25,1), height .5s cubic-bezier(.2,.85,.25,1);
    box-shadow: 0 18px 40px rgba(0,0,0,.28);
  }
  #detailBg { opacity: 0; transition: opacity .35s ease; }
  #detailBody { opacity: 0; transform: translateY(28px); transition: opacity .35s ease, transform .45s cubic-bezier(.2,.85,.25,1); }
  .dtop { opacity: 0; transition: opacity .3s ease; }
  #detail.open #detailBg, #detail.open .dtop { opacity: 1; }
  #detail.open #detailBody { opacity: 1; transform: none; transition-delay: .16s; }
  #detail.light .dbtn { color: #0B2A31; background: rgba(11,42,49,.07); }
  #detail:not(.light) .dbtn { color: #fff; background: rgba(255,255,255,.1); }
  #favBtn.on { color: #F5B700 !important; }
  #bigBarcode rect { shape-rendering: crispEdges; }

  /* 시트 & 액션시트 */
  .sheet-bg { opacity: 0; transition: opacity .3s ease; }
  .sheet-panel { transform: translateY(100%); transition: transform .45s cubic-bezier(.2,.85,.25,1); }
  .show .sheet-bg { opacity: 1; }
  .show .sheet-panel { transform: none; }

  .inp {
    width: 100%; border-radius: 14px; background: #fff; border: 1.5px solid rgba(11,42,49,.12);
    padding: 12px 14px; color: #0B2A31; outline: none; transition: border-color .2s;
  }
  .inp:focus { border-color: var(--orange); }
  .seg button { transition: all .25s ease; }
  .seg button.on { background: #0B2A31; color: #fff; box-shadow: 0 4px 12px rgba(11,42,49,.25); }
  .swatch { width: 36px; height: 36px; border-radius: 50%; position: relative; transition: transform .2s; }
  .swatch.on { transform: scale(1.12); box-shadow: 0 0 0 3px var(--paper), 0 0 0 5.5px #0B2A31; }
  .tool {
    display: flex; align-items: center; justify-content: center; gap: 6px; padding: 12px 8px; border-radius: 14px;
    font-weight: 600; font-size: 14px; transition: transform .15s;
  }
  .tool:active { transform: scale(.97); }

  /* 스캐너 */
  #reader { width: 100%; border-radius: 22px; overflow: hidden; background: #000; }
  #reader video { object-fit: cover; border-radius: 22px; }
  #reader img[alt="Info icon"], #reader__dashboard { display: none !important; }

  #toast {
    transform: translate(-50%, 20px); opacity: 0; transition: all .35s cubic-bezier(.2,.85,.25,1); pointer-events: none;
  }
  #toast.show { transform: translate(-50%, 0); opacity: 1; }
  .copied { animation: pop .45s ease; }
  @keyframes pop { 40% { transform: scale(.97); background: rgba(240,138,60,.25); } }
  .spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="safeProbe" style="position:fixed;top:0;left:0;height:env(safe-area-inset-top);width:1px;visibility:hidden"></div>
<div id="fileReader" style="position:fixed;left:-9999px;top:0;width:300px;height:300px"></div>

<!-- ===== 메인 ===== -->
<main class="max-w-[480px] mx-auto px-4" style="padding-top:calc(env(safe-area-inset-top) + 18px);padding-bottom:calc(env(safe-area-inset-bottom) + 40px)">
  <header class="flex items-end justify-between mb-6">
    <div>
      <div class="mono text-[11px] tracking-[.28em] text-[#F3A86B] font-bold">LINK WALLET</div>
      <h1 class="text-[30px] font-bold leading-tight mt-1">내 카드지갑</h1>
    </div>
    <div class="flex items-center gap-2 pb-1">
      <button id="menuBtn" aria-label="메뉴" class="w-11 h-11 rounded-full bg-white/10 grid place-items-center active:scale-90 transition">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
      </button>
      <button id="addBtn" aria-label="카드 추가" class="w-11 h-11 rounded-full bg-[#F08A3C] text-[#0B2A31] grid place-items-center shadow-[0_6px_18px_rgba(240,138,60,.45)] active:scale-90 transition">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
  </header>

  <div id="installTip" class="hidden mb-5 rounded-2xl bg-white/[.07] border border-white/10 px-4 py-3 text-[13.5px] leading-relaxed flex gap-3 items-start">
    <div class="flex-1">사파리 하단 <b>공유 버튼</b> → <b>'홈 화면에 추가'</b>를 누르면 진짜 앱처럼 전체화면으로 쓸 수 있어요.</div>
    <button id="tipClose" class="text-white/50 text-lg leading-none px-1">✕</button>
  </div>

  <section id="stack" class="relative"></section>

  <section id="empty" class="hidden text-center pt-10">
    <div class="mx-auto w-[78%] aspect-[1.586] rounded-[18px] border-2 border-dashed border-white/20 grid place-items-center text-white/40">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="6" width="18" height="12" rx="2.5"/><path d="M7 10v4M10 10v4M12.5 10v4M15 10v4M17 10v4"/></svg>
    </div>
    <p class="mt-6 text-white/70 leading-relaxed">아직 카드가 없어요.<br>멤버십 바코드, 계좌번호, 사업자등록증 사진을 넣어보세요.</p>
    <button id="emptyAdd" class="mt-5 px-6 py-3 rounded-full bg-[#F08A3C] text-[#0B2A31] font-bold active:scale-95 transition">첫 카드 추가하기</button>
  </section>

  <p id="footNote" class="hidden text-center text-[12px] text-white/35 mt-8 leading-relaxed"></p>
</main>

<!-- ===== 카드 상세 (확대) ===== -->
<div id="detail" class="fixed inset-0 z-40 hidden">
  <div id="detailBg" class="absolute inset-0"></div>
  <div class="dtop absolute left-0 right-0 top-0 z-[4] flex justify-between items-center px-4" style="padding-top:calc(env(safe-area-inset-top) + 12px)">
    <button id="closeBtn" class="dbtn h-10 px-4 rounded-full font-semibold text-[15px] active:scale-95 transition">닫기</button>
    <div class="flex gap-2">
      <button id="favBtn" aria-label="즐겨찾기" class="dbtn w-10 h-10 rounded-full grid place-items-center active:scale-90 transition"></button>
      <button id="moreBtn" aria-label="카드 메뉴" class="dbtn w-10 h-10 rounded-full grid place-items-center active:scale-90 transition">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
      </button>
    </div>
  </div>
  <div id="flyCard"></div>
  <div id="detailBody" class="absolute left-0 right-0 bottom-0 overflow-y-auto z-[2]" style="padding-bottom:calc(env(safe-area-inset-bottom) + 28px)"></div>
</div>

<!-- ===== 이미지 크게 보기 ===== -->
<div id="viewer" class="fixed inset-0 z-[58] hidden bg-black">
  <div id="viewerScroll" class="absolute inset-0 overflow-auto grid place-items-center">
    <img id="viewerImg" alt="" class="max-w-none transition-[width] duration-300" style="width:100vw">
  </div>
  <div class="absolute left-0 right-0 top-0 flex justify-between items-center px-4" style="padding-top:calc(env(safe-area-inset-top) + 12px)">
    <button id="viewerClose" class="h-10 px-4 rounded-full bg-white/15 text-white font-semibold text-[15px] backdrop-blur">닫기</button>
    <span class="text-white/60 text-[12.5px]">두 번 탭하면 확대</span>
  </div>
</div>

<!-- ===== 바코드 카메라 스캐너 ===== -->
<div id="scanner" class="fixed inset-0 z-[65] hidden bg-[#061A1F] flex flex-col" style="padding-top:calc(env(safe-area-inset-top) + 12px);padding-bottom:calc(env(safe-area-inset-bottom) + 20px)">
  <div class="flex justify-between items-center px-4">
    <button id="scanClose" class="h-10 px-4 rounded-full bg-white/10 text-white font-semibold text-[15px]">닫기</button>
    <span class="mono text-[11px] tracking-[.24em] text-[#F3A86B] font-bold">SCAN</span>
    <span class="w-[64px]"></span>
  </div>
  <div class="flex-1 flex flex-col justify-center px-4">
    <div id="reader"></div>
    <p id="scanMsg" class="text-center text-white/70 text-[14px] mt-5 leading-relaxed">카드 바코드를 네모 칸 안에 맞춰주세요.<br>밝은 곳에서 가로로 대면 더 빨리 인식돼요.</p>
  </div>
</div>

<!-- ===== 카드 등록/수정 시트 ===== -->
<div id="sheet" class="fixed inset-0 z-50 hidden">
  <div class="sheet-bg absolute inset-0 bg-black/55" data-close-sheet></div>
  <div class="sheet-panel absolute left-0 right-0 bottom-0 max-w-[520px] mx-auto bg-[#F6F1EA] text-[#0B2A31] rounded-t-[28px] max-h-[94dvh] overflow-y-auto">
    <div class="sticky top-0 z-10 bg-[#F6F1EA]/95 backdrop-blur flex items-center justify-between px-4 pt-3 pb-2">
      <button data-close-sheet class="h-10 px-3 text-[15px] text-[#0B2A31]/60 font-medium">취소</button>
      <div class="w-10 h-1.5 rounded-full bg-black/15 absolute left-1/2 -translate-x-1/2 top-2"></div>
      <h2 id="sheetTitle" class="font-bold text-[16px] mt-1">새 카드</h2>
      <button id="saveBtn" class="h-10 px-4 rounded-full bg-[#0B2A31] text-white text-[15px] font-bold active:scale-95 transition">저장</button>
    </div>

    <div class="px-5" style="padding-bottom:calc(env(safe-area-inset-bottom) + 36px)">
      <div id="preview" class="relative mx-auto w-full max-w-[300px] aspect-[1.586] rounded-[18px] mt-2 shadow-[0_12px_30px_rgba(11,42,49,.25)]"></div>

      <div class="seg mt-6 grid grid-cols-3 gap-1 p-1 rounded-2xl bg-black/[.06] text-[13.5px] font-semibold">
        <button data-type="barcode" class="py-2.5 rounded-xl">바코드</button>
        <button data-type="memo" class="py-2.5 rounded-xl">계좌·번호</button>
        <button data-type="image" class="py-2.5 rounded-xl">이미지</button>
      </div>

      <label class="block mt-6 text-[13px] font-semibold text-[#0B2A31]/70 mb-2">카드 이름</label>
      <input id="fName" class="inp" maxlength="30" placeholder="예: CU 멤버십, 링크클린 사업용">

      <label class="block mt-5 text-[13px] font-semibold text-[#0B2A31]/70 mb-3">카드 색상</label>
      <div id="swatches" class="flex flex-wrap gap-3"></div>

      <!-- 바코드 모드 -->
      <div id="secBarcode" class="mt-6">
        <div class="grid grid-cols-2 gap-2 mb-4">
          <button id="scanCamBtn" class="tool bg-[#0B2A31] text-white">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8V6a2 2 0 0 1 2-2h2M17 4h2a2 2 0 0 1 2 2v2M21 16v2a2 2 0 0 1-2 2h-2M7 20H5a2 2 0 0 1-2-2v-2M7 9v6M10 9v6M13 9v6M17 9v6"/></svg>
            카메라로 스캔
          </button>
          <button id="scanPhotoBtn" class="tool bg-white border border-black/10 text-[#0B2A31]">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>
            캡처 사진 인식
          </button>
        </div>
        <label class="block text-[13px] font-semibold text-[#0B2A31]/70 mb-2">바코드 번호</label>
        <input id="fCode" class="inp mono tracking-wider" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="스캔하거나 직접 입력">
        <label class="block mt-4 text-[13px] font-semibold text-[#0B2A31]/70 mb-2">바코드 형식</label>
        <select id="fFormat" class="inp">
          <option value="auto">자동 (추천)</option>
          <option value="CODE128">CODE128 · 대부분의 멤버십</option>
          <option value="EAN13">EAN-13 · 13자리 상품형</option>
          <option value="EAN8">EAN-8</option>
          <option value="UPC">UPC-A · 12자리</option>
          <option value="UPCE">UPC-E</option>
          <option value="CODE39">CODE39</option>
          <option value="CODE93">CODE93</option>
          <option value="ITF">ITF</option>
          <option value="codabar">Codabar</option>
        </select>
        <div class="mt-4 rounded-2xl bg-white border border-black/10 p-4 min-h-[96px] grid place-items-center">
          <svg id="formBarcode" class="w-full"></svg>
          <p id="codeMsg" class="text-[13px] text-[#0B2A31]/45 text-center">번호를 입력하면 바코드가 바로 생겨요</p>
        </div>
      </div>

      <!-- 메모 모드 -->
      <div id="secMemo" class="mt-6 hidden">
        <div class="flex items-center justify-between mb-2">
          <label class="text-[13px] font-semibold text-[#0B2A31]/70">저장할 번호들</label>
          <span class="text-[12px] text-[#0B2A31]/45">복사·문자·공유 원터치</span>
        </div>
        <div class="flex flex-wrap gap-2 mb-3" id="presets"></div>
        <div id="itemList" class="space-y-3"></div>
        <button id="addItem" class="mt-3 w-full py-3 rounded-2xl border-2 border-dashed border-[#0B2A31]/20 text-[14px] font-semibold text-[#0B2A31]/60 active:scale-[.98] transition">+ 항목 추가</button>
      </div>

      <!-- 이미지 모드 -->
      <div id="secImage" class="mt-6 hidden">
        <div class="flex items-center justify-between mb-2">
          <label class="text-[13px] font-semibold text-[#0B2A31]/70">카드·서류 사진 <span class="font-normal text-[#0B2A31]/40">(최대 4장)</span></label>
          <span id="imgSize" class="text-[12px] text-[#0B2A31]/45"></span>
        </div>
        <div id="imgGrid" class="grid grid-cols-2 gap-3"></div>
        <div class="grid grid-cols-2 gap-2 mt-3">
          <button id="imgCamBtn" class="tool bg-[#0B2A31] text-white">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
            사진 찍기
          </button>
          <button id="imgPickBtn" class="tool bg-white border border-black/10 text-[#0B2A31]">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>
            앨범에서 선택
          </button>
        </div>

<script>
/* ================= 데이터 ================= */
const KEY = 'smartWallet.v1';
const COLORS = [
  { n: '링크 청록', v: '#0E5A66' }, { n: '선셋 오렌지', v: '#E9772E' }, { n: '리프 그린', v: '#4E9F3D' },
  { n: '미드나잇', v: '#1F2A44' }, { n: '버건디', v: '#7A2E3A' }, { n: '라벤더', v: '#6B5CA5' },
  { n: '샌드', v: '#A8844E' }, { n: '차콜', v: '#2B2B2B' }
];
const PRESETS = ['은행 계좌', '사업자등록번호', '카드 번호', '기타'];
const TYPES = ['barcode', 'memo', 'image'];
const MAX_IMAGES = 4;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const validColor = c => /^#[0-9a-f]{6}$/i.test(c || '') ? c : COLORS[0].v;
const validImg = s => typeof s === 'string' && /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(s);

function load() {
  try { const d = JSON.parse(localStorage.getItem(KEY) || '[]'); return Array.isArray(d) ? d.map(clean).filter(Boolean) : []; }
  catch (e) { return []; }
}
/* 저장 실패(용량 초과) 시 false 반환 */
function persist() {
  try { localStorage.setItem(KEY, JSON.stringify(cards)); updateFoot(); return true; }
  catch (e) { return false; }
}
function clean(c) {
  if (!c || typeof c !== 'object') return null;
  return {
    id: typeof c.id === 'string' && c.id ? c.id : uid(),
    type: TYPES.includes(c.type) ? c.type : 'barcode',
    name: String(c.name || '').slice(0, 30),
    color: validColor(c.color),
    fav: !!c.fav,
    barcode: { value: String(c.barcode?.value || ''), format: String(c.barcode?.format || 'auto') },
    items: Array.isArray(c.items) ? c.items.map(it => ({ label: String(it?.label || ''), value: String(it?.value || '') })).filter(it => it.label || it.value) : [],
    images: Array.isArray(c.images) ? c.images.filter(validImg).slice(0, MAX_IMAGES) : [],
    memo: String(c.memo || ''),
    createdAt: Number(c.createdAt) || Date.now()
  };
}
let cards = load();
/* 화면 표시 순서: 즐겨찾기 먼저(맨 위), 그다음 나머지 */
const ordered = () => [...cards.filter(c => c.fav), ...cards.filter(c => !c.fav)];

/* ================= 유틸 ================= */
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const f = v => Math.max(0, Math.min(255, v + amt)).toString(16).padStart(2, '0');
  return '#' + f(n >> 16) + f((n >> 8) & 255) + f(n & 255);
}
const safeTop = () => $('#safeProbe').offsetHeight || 0;
const fmtSize = n => n > 1048576 ? (n / 1048576).toFixed(1) + 'MB' : Math.max(1, Math.round(n / 1024)) + 'KB';
let toastTimer;
function toast(msg) {
  $('#toastText').textContent = msg;
  const t = $('#toast'); t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1700);
}
function busy(on, text) { $('#busyText').textContent = text || '처리 중…'; $('#busy').classList.toggle('hidden', !on); }
function flash(btn) { if (btn) { btn.classList.remove('copied'); void btn.offsetWidth; btn.classList.add('copied'); } }

async function copyText(text, btn, silent) {
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch (e) {}
  if (!ok) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;opacity:0';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, 99999);
    try { ok = document.execCommand('copy'); } catch (e) {}
    ta.remove();
  }
  flash(btn);
  if (navigator.vibrate) navigator.vibrate(12);
  if (!silent) toast(ok ? '복사되었습니다' : '복사에 실패했어요');
  return ok;
}
/* 문자 보내기: 아이폰은 sms:&body=, 그 외는 sms:?body= */
function sendSMS(text, btn) {
  flash(btn);
  const a = document.createElement('a');
  a.href = (isIOS ? 'sms:&body=' : 'sms:?body=') + encodeURIComponent(text);
  document.body.appendChild(a); a.click(); a.remove();
}
/* 공유하기: Web Share API (카톡·메일 등), 미지원 시 복사로 대체 */
async function shareText(text, btn) {
  flash(btn);
  if (navigator.share) {
    try { await navigator.share({ text }); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  await copyText(text, null, true);
  toast('공유를 지원하지 않아 복사했어요');
}
function dataURLtoFile(dataUrl, name) {
  const [head, b64] = dataUrl.split(',');
  const mime = head.match(/data:(.*?);/)[1];
  const bin = atob(b64), arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new File([arr], name, { type: mime });
}
async function shareImage(dataUrl, name, btn) {
  flash(btn);
  const file = dataURLtoFile(dataUrl, (name || '카드').replace(/[\\/:*?"<>|]/g, '') + '.jpg');
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file); a.download = file.name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  toast('사진을 저장했어요');
}

/* ================= 바코드 그리기 ================= */
function pickFormat(value, fmt) {
  if (fmt && fmt !== 'auto') return fmt;
  if (/^\d{13}$/.test(value) && eanValid(value)) return 'EAN13';
  return 'CODE128';
}
function eanValid(v) {
  const d = v.split('').map(Number), chk = d.pop();
  const sum = d.reduce((s, n, i) => s + n * (i % 2 ? 3 : 1), 0);
  return (10 - (sum % 10)) % 10 === chk;
}
function drawBarcode(svg, raw, fmt, height) {
  const value = String(raw || '').replace(/\s+/g, '');
  svg.innerHTML = ''; svg.removeAttribute('viewBox');
  if (!value || typeof JsBarcode === 'undefined') return false;
  let ok = true;
  try {
    JsBarcode(svg, value, {
      format: pickFormat(value, fmt), displayValue: false, margin: 0, width: 2, height: height || 90,
      lineColor: '#000000', background: '#FFFFFF', flat: true, valid: v => { ok = v; }
    });
  } catch (e) { ok = false; }
  if (!ok) { svg.innerHTML = ''; return false; }
  const w = parseFloat(svg.getAttribute('width')), h = parseFloat(svg.getAttribute('height'));
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  svg.removeAttribute('width'); svg.removeAttribute('height');
  svg.style.width = '100%'; svg.style.height = 'auto'; svg.style.display = 'block';
  return true;
}

/* ================= 바코드 인식 (html5-qrcode) ================= */
const FORMAT_MAP = {
  CODE_128: 'CODE128', EAN_13: 'EAN13', EAN_8: 'EAN8', UPC_A: 'UPC', UPC_E: 'UPCE',
  CODE_39: 'CODE39', CODE_93: 'CODE93', ITF: 'ITF', CODABAR: 'codabar'
};
function scanConfig() {
  const cfg = { verbose: false, experimentalFeatures: { useBarCodeDetectorIfSupported: true } };
  if (typeof Html5QrcodeSupportedFormats !== 'undefined') {
    const F = Html5QrcodeSupportedFormats;
    cfg.formatsToSupport = ['CODE_128', 'EAN_13', 'EAN_8', 'UPC_A', 'UPC_E', 'CODE_39', 'CODE_93', 'ITF', 'CODABAR', 'QR_CODE']
      .map(k => F[k]).filter(v => v !== undefined);
  }
  return cfg;
}
function formatFromResult(res) {
  const name = String(res?.result?.format?.formatName || '').toUpperCase().replace(/-/g, '_');
  return FORMAT_MAP[name] || 'auto';
}
function applyScan(text, fmt) {
  const value = String(text || '').trim();
  if (!value) return;
  form.barcode.value = value;
  form.barcode.format = fmt || 'auto';
  $('#fCode').value = value;
  $('#fFormat').value = form.barcode.format;
  if (!drawBarcode(document.createElementNS('http://www.w3.org/2000/svg', 'svg'), value, form.barcode.format)) {
    form.barcode.format = 'auto'; $('#fFormat').value = 'auto';
  }
  syncForm();
  if (navigator.vibrate) navigator.vibrate([20, 40, 20]);
  toast('바코드를 인식했어요');
}
function libReady() {
  if (typeof Html5Qrcode === 'undefined') { toast('인식 기능을 불러오지 못했어요 (인터넷 확인)'); return false; }
  return true;
}

let cam = null;
async function openScanner() {
  if (!libReady()) return;
  document.activeElement?.blur();
  $('#scanner').classList.remove('hidden');
  $('#scanMsg').innerHTML = '카드 바코드를 네모 칸 안에 맞춰주세요.<br>밝은 곳에서 가로로 대면 더 빨리 인식돼요.';
  try {
    cam = new Html5Qrcode('reader', scanConfig());
    await cam.start(
      { facingMode: 'environment' },
      {
        fps: 12,
        qrbox: (w, h) => ({ width: Math.floor(w * 0.88), height: Math.floor(Math.min(h * 0.5, w * 0.45)) }),
        aspectRatio: 1.2
      },
      async (text, res) => { const fmt = formatFromResult(res); await closeScanner(); applyScan(text, fmt); },
      () => {}
    );
  } catch (e) {
    $('#scanMsg').innerHTML = '카메라를 열 수 없어요.<br>설정 › Safari › 카메라 권한을 확인하거나,<br>\'캡처 사진 인식\'을 이용해 주세요.';
  }
}
async function closeScanner() {
  if (cam) {
    try { if (cam.isScanning) await cam.stop(); } catch (e) {}
    try { cam.clear(); } catch (e) {}
    cam = null;
  }
  $('#scanner').classList.add('hidden');
}

/* 사진 파일에서 바코드 인식: 원본 → 리사이즈본 → 가운데 잘라낸 버전 순서로 시도 */
async function scanFromFile(file) {
  if (!libReady()) return;
  busy(true, '바코드 찾는 중…');
  const reader = new Html5Qrcode('fileReader', scanConfig());
  const tries = [file];
  try {
    const img = await loadImage(file);
    tries.push(await canvasFile(img, 1400, null));
    tries.push(await canvasFile(img, 1400, 'center'));
  } catch (e) {}
  let found = null;
  for (const f of tries) {
    try { found = await reader.scanFileV2(f, false); if (found) break; } catch (e) {}
  }
  try { reader.clear(); } catch (e) {}
  busy(false);
  if (found) applyScan(found.decodedText, formatFromResult(found));
  else toast('바코드를 찾지 못했어요. 바코드만 크게 캡처해 보세요');
}
function loadImage(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); res(img); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('이미지를 열 수 없어요')); };
    img.src = url;
  });
}
function canvasFile(img, maxSide, crop) {
  let sx = 0, sy = 0, sw = img.naturalWidth, sh = img.naturalHeight;
  if (crop === 'center') { sy = sh * 0.25; sh = sh * 0.5; }
  const scale = Math.min(1, maxSide / Math.max(sw, sh));
  const c = document.createElement('canvas');
  c.width = Math.round(sw * scale); c.height = Math.round(sh * scale);
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
  x.drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);
  return new Promise(r => c.toBlob(b => r(new File([b], 'scan.jpg', { type: 'image/jpeg' })), 'image/jpeg', 0.92));
}

/* ================= 이미지 압축 (Canvas) =================
   긴 변 1600px 이하 + JPEG 품질을 단계적으로 낮춰 장당 약 350KB 이내로 저장 */
async function compressImage(file, maxSide = 1600, targetBytes = 350 * 1024) {
  const img = await loadImage(file);
  let side = maxSide, q = 0.86, data = '';
  for (let round = 0; round < 8; round++) {
    const scale = Math.min(1, side / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth * scale); c.height = Math.round(img.naturalHeight * scale);
    const x = c.getContext('2d');
    x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
    x.imageSmoothingEnabled = true; x.imageSmoothingQuality = 'high';
    x.drawImage(img, 0, 0, c.width, c.height);
    data = c.toDataURL('image/jpeg', q);
    if (data.length * 0.75 <= targetBytes) break;
    if (q > 0.7) q -= 0.06; else side = Math.round(side * 0.85);
  }
  return data;
}
async function addImages(files) {
  const list = [...files].filter(f => /^image\//.test(f.type) || /\.(heic|heif|jpe?g|png|webp)$/i.test(f.name));
  if (!list.length) return;
  const room = MAX_IMAGES - form.images.length;
  if (room <= 0) { toast(`사진은 최대 ${MAX_IMAGES}장까지예요`); return; }
  busy(true, '사진 용량 줄이는 중…');
  let fail = 0;
  for (const f of list.slice(0, room)) {
    try { form.images.push(await compressImage(f)); } catch (e) { fail++; }
  }
  busy(false);
  renderImages(); syncForm();
  if (fail) toast('일부 사진을 열 수 없었어요');
  else if (list.length > room) toast(`최대 ${MAX_IMAGES}장까지만 넣었어요`);
}

/* ================= 카드 앞면 ================= */
const ICON_BAR = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6v12M7 6v12M10 6v12M13.5 6v12M16 6v12M20 6v12"/></svg>';
const ICON_LOCK = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg>';
const ICON_PHOTO = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>';
const ICON_COPY = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="8.5" y="8.5" width="11" height="11" rx="2.5"/><path d="M15.5 8.5V6a1.5 1.5 0 0 0-1.5-1.5H6A1.5 1.5 0 0 0 4.5 6v8A1.5 1.5 0 0 0 6 15.5h2.5"/></svg>';
const ICON_SMS = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 5.5h16v10.5H9.5L5 20v-4H4z"/></svg>';
const ICON_SHARE = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3.5M7.5 8 12 3.5 16.5 8M5 12v7.5h14V12"/></svg>';
const ICON_STAR = on => `<svg width="19" height="19" viewBox="0 0 24 24" fill="${on ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3.5l2.6 5.3 5.9.9-4.25 4.1 1 5.85L12 16.9l-5.25 2.75 1-5.85L3.5 9.7l5.9-.9z"/></svg>`;

function cardFace(c) {
  const col = validColor(c.color), t = c.type;
  const img = t === 'image' && c.images && c.images[0];
  let sub, badge, icon;
  if (t === 'barcode') {
    const v = String(c.barcode?.value || '').replace(/\s+/g, '');
    sub = v ? '•••• ' + esc(v.slice(-4)) : '번호 없음'; badge = 'MEMBERSHIP'; icon = ICON_BAR;
  } else if (t === 'memo') {
    const it = (c.items || []).filter(i => i.label || i.value);
    sub = it.length ? esc(it[0].label || '항목') + (it.length > 1 ? ` 외 ${it.length - 1}개` : '') : '항목 없음';
    badge = 'VAULT'; icon = ICON_LOCK;
  } else {
    const n = (c.images || []).length;
    sub = n ? `사진 ${n}장` : '사진 없음'; badge = 'PHOTO'; icon = ICON_PHOTO;
  }
  const bg = img
    ? `background:linear-gradient(180deg,rgba(0,0,0,.5),rgba(0,0,0,.05) 42%,rgba(0,0,0,.6)),url('${img}') center/cover,${col}`
    : `background:linear-gradient(140deg, ${shade(col, 34)} 0%, ${col} 48%, ${shade(col, -40)} 100%)`;
  return `<div class="face ${img ? 'photo' : ''}" style="${bg}">
    <div class="relative flex items-start justify-between gap-3">
      <div class="font-bold text-[19px] leading-snug truncate flex items-center gap-1.5">${c.fav ? `<span class="star shrink-0">${ICON_STAR(true)}</span>` : ''}<span class="truncate">${esc(c.name || '이름 없는 카드')}</span></div>
      <span class="badge">${badge}</span>
    </div>
    <div class="absolute left-5 right-5 bottom-4 flex items-end justify-between gap-3">
      <div class="${t === 'barcode' ? 'mono tracking-wider' : 'font-medium'} text-[14.5px] opacity-90 truncate">${sub}</div>
      <div class="opacity-80 shrink-0">${icon}</div>
    </div>
  </div>`;
}

/* ================= 스택 렌더 ================= */
function render(animate) {
  const wrap = $('#stack'), list = ordered();
  $('#empty').classList.toggle('hidden', list.length > 0);
  $('#footNote').classList.toggle('hidden', !list.length);
  if (!list.length) { wrap.innerHTML = ''; wrap.style.height = '0px'; return; }
  const step = list.length > 8 ? 50 : 62;
  const h = wrap.clientWidth / 1.586;
  wrap.innerHTML = list.map((c, i) =>
    `<div class="card ${animate ? 'enter' : ''}" data-id="${esc(c.id)}" style="--y:${i * step}px;z-index:${i + 1};animation-delay:${i * 45}ms">${cardFace(c)}</div>`
  ).join('');
  wrap.style.height = ((list.length - 1) * step + h) + 'px';
  updateFoot();
}

let openId = null;
function targetRect() {
  const vw = window.innerWidth, w = Math.min(vw - 32, 440);
  return { left: (vw - w) / 2, top: safeTop() + 66, width: w, height: w / 1.586 };
}
function setRect(el, r) { Object.assign(el.style, { left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px' }); }
const cardEl = id => document.querySelector(`#stack .card[data-id="${CSS.escape(id)}"]`);

function openDetail(id, el) {

function applyOpenState() {

function closeDetail(instant) {

let lastTap = 0;

$('#viewerImg').addEventListener('click', e => {

    const img = e.currentTarget, sc = $('#viewerScroll'), zoomed = img.style.width !== '100vw';
    const rx = e.offsetX / img.clientWidth, ry = e.offsetY / img.clientHeight;

    if (!zoomed) requestAnimationFrame(() => { sc.scrollLeft = img.clientWidth * rx - innerWidth / 2; sc.scrollTop = img.clientHeight * ry - innerHeight / 2; });
    lastTap = 0;

});

/* ================= 순서 변경 / 즐겨찾기 ================= */
function commit(prev, msg) {
  if (!persist()) { cards = prev; toast('저장 공간이 부족해요'); return false; }
  if (msg) toast(msg);
  return true;
}
function toggleFav(id) {
  const prev = cards.slice();
  const c = cards.find(x => x.id === id); if (!c) return;
  const now = !c.fav;
  cards = [{ ...c, fav: now }, ...cards.filter(x => x.id !== id)];
  if (!commit(prev, now ? '즐겨찾기 — 맨 위에 고정했어요' : '즐겨찾기를 해제했어요')) return;
  const nc = cards[0];
  if (openId === id) { $('#flyCard').innerHTML = cardFace(nc); updateFavBtn(nc); render(false); applyOpenState(); }
  else render(false);
}
function moveCard(id, mode) {
  const list = ordered(), i = list.findIndex(c => c.id === id); if (i < 0) return;
  const c = list[i], group = list.filter(x => x.fav === c.fav);
  const gi = group.indexOf(c);
  if (mode === 'top') { if (gi === 0) return toast('이미 맨 위예요'); group.splice(gi, 1); group.unshift(c); }
  else {
    const j = gi + mode;
    if (j < 0 || j >= group.length) return toast(c.fav ? '즐겨찾기 안에서만 움직일 수 있어요' : '더 이동할 수 없어요');
    [group[gi], group[j]] = [group[j], group[gi]];
  }
  const prev = cards.slice();
  const favs = c.fav ? group : list.filter(x => x.fav);
  const rest = c.fav ? list.filter(x => !x.fav) : group;
  cards = [...favs, ...rest];
  if (!commit(prev, '순서를 바꿨어요')) return;
  closeDetail(true); setTimeout(() => render(false), 320);
}

function openSheet(card) {

function saveForm() {
  form.name = $('#fName').value.trim();
  form.memo = $('#fMemo').value.trim();
  if (!form.name) { toast('카드 이름을 입력해 주세요'); $('#fName').focus(); return; }
  if (form.type === 'barcode') {
    form.barcode.value = $('#fCode').value.trim();
    if (!form.barcode.value) { toast('바코드 번호를 입력해 주세요'); return; }
    if (!drawBarcode(document.createElementNS('http://www.w3.org/2000/svg', 'svg'), form.barcode.value, form.barcode.format)) {
      toast('바코드 형식을 확인해 주세요'); return;
    }
    form.items = []; form.images = [];
  } else if (form.type === 'memo') {
    form.items = form.items.map(i => ({ label: i.label.trim(), value: i.value.trim() })).filter(i => i.value);
    if (!form.items.length) { toast('번호를 하나 이상 입력해 주세요'); form.items = [{ label: '', value: '' }]; renderItems(); return; }
    form.barcode = { value: '', format: 'auto' }; form.images = [];
  } else {
    if (!form.images.length) { toast('사진을 한 장 이상 넣어주세요'); return; }
    form.barcode = { value: '', format: 'auto' }; form.items = [];
  }
  const data = clean({ ...form, id: editingId || uid(), createdAt: form.createdAt || Date.now() });
  const prev = cards.slice(), wasOpen = editingId && openId === editingId;
  cards = editingId ? cards.map(c => c.id === editingId ? data : c) : [...cards, data];
  if (!persist()) {
    cards = prev;
    toast('저장 공간이 가득 찼어요 · 사진 수를 줄여주세요');
    return;
  }
  closeSheet();
  if (wasOpen) { closeDetail(true); setTimeout(() => render(false), 320); }
  else render(!editingId);
  toast(editingId ? '수정했어요' : '카드를 추가했어요');
}

/* ================= 백업 / 복원 ================= */
function ymd() { const d = new Date(); return d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0'); }
async function exportData() {
  if (!cards.length) { toast('내보낼 카드가 없어요'); return; }
  const name = `카드지갑_백업_${ymd()}.json`;
  const json = JSON.stringify({ app: 'smart-card-wallet', version: 2, exportedAt: new Date().toISOString(), cards }, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  try {
    const file = new File([blob], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: name });
      return;
    }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  toast('백업 파일을 저장했어요');
}
function importData(file) {
  const r = new FileReader();
  r.onload = () => {
    let list;
    try { const d = JSON.parse(r.result); list = Array.isArray(d) ? d : d.cards; } catch (e) {}
    if (!Array.isArray(list)) { toast('올바른 백업 파일이 아니에요'); return; }
    const incoming = list.map(clean).filter(Boolean);
    if (!incoming.length) { toast('불러올 카드가 없어요'); return; }
    actions(`백업 파일에서 카드 ${incoming.length}장을 찾았어요.\n어떻게 불러올까요?`, [
      { label: '기존 카드에 합치기', fn: () => {
        const prev = cards.slice(), map = new Map(cards.map(c => [c.id, c]));
        incoming.forEach(c => map.set(c.id, c));
        cards = [...map.values()];
        if (commit(prev, `${incoming.length}장을 불러왔어요`)) render(true);
      } },
      { label: `전부 바꾸기 (현재 ${cards.length}장 삭제)`, danger: true, fn: () => {
        const prev = cards.slice(); cards = incoming;
        if (commit(prev, '백업으로 복원했어요')) render(true);
      } }
    ]);
  };
  r.readAsText(file);
}

document.addEventListener('click', e => {
  const t = e.target;
  const cp = t.closest('[data-copy]'); if (cp) { copyText(cp.getAttribute('data-copy'), cp); return; }
  const sm = t.closest('[data-sms]'); if (sm) { sendSMS(sm.getAttribute('data-sms'), sm); return; }
  const sh = t.closest('[data-share]'); if (sh) { shareText(sh.getAttribute('data-share'), sh); return; }
  const vw = t.closest('[data-view]');
  if (vw) { const c = cards.find(x => x.id === openId); if (c) openViewer(c.images[+vw.dataset.view]); return; }
  const si = t.closest('[data-share-img]');
  if (si) { const c = cards.find(x => x.id === openId); if (c) shareImage(c.images[+si.dataset.shareImg], c.name, si); return; }
  if (t.closest('[data-close-sheet]')) { closeSheet(); return; }
  if (t.closest('[data-close-act]')) { hideLayer($('#actions')); return; }
  const act = t.closest('[data-act]');
  if (act) { const fn = actFns[+act.dataset.act]; hideLayer($('#actions')); if (fn) setTimeout(fn, 280); }
});

/* 시트 입력 */
$('#saveBtn').onclick = saveForm;
$$('.seg button').forEach(b => b.onclick = () => {
  form.type = b.dataset.type;
  if (form.type === 'memo' && !form.items.length) { form.items.push({ label: '', value: '' }); renderItems(); }
  syncType(); syncForm();
});
$('#swatches').addEventListener('click', e => { const s = e.target.closest('.swatch'); if (s) { form.color = s.dataset.color; syncForm(); } });
$('#fName').oninput = e => { form.name = e.target.value; syncForm(); };
$('#fCode').oninput = e => { form.barcode.value = e.target.value; syncForm(); };
$('#fFormat').onchange = e => { form.barcode.format = e.target.value; syncForm(); };
$('#fMemo').oninput = e => { form.memo = e.target.value; };
$('#itemList').addEventListener('input', e => {
  const row = e.target.closest('[data-i]'), f = e.target.dataset.f;
  if (row && f) { form.items[+row.dataset.i][f] = e.target.value; syncForm(); }
});
$('#itemList').addEventListener('click', e => {
  const d = e.target.closest('[data-del]');
  if (d) { form.items.splice(+d.dataset.del, 1); renderItems(); syncForm(); }
});
$('#addItem').onclick = () => { form.items.push({ label: '', value: '' }); renderItems(); syncForm(); $('#itemList').lastElementChild?.querySelector('[data-f="label"]').focus(); };
$('#presets').addEventListener('click', e => {
  const p = e.target.closest('[data-preset]'); if (!p) return;
  const empty = form.items.findIndex(i => !i.label && !i.value);
  const label = p.dataset.preset === '기타' ? '' : p.dataset.preset;
  if (empty > -1) form.items[empty].label = label; else form.items.push({ label, value: '' });
  renderItems(); syncForm();
  const idx = empty > -1 ? empty : form.items.length - 1;
  $(`#itemList [data-i="${idx}"] [data-f="${label ? 'value' : 'label'}"]`)?.focus();
});

/* 바코드 스캔 */
$('#scanCamBtn').onclick = openScanner;
$('#scanClose').onclick = closeScanner;
$('#scanPhotoBtn').onclick = () => { $('#scanFileInput').value = ''; $('#scanFileInput').click(); };
$('#scanFileInput').onchange = e => { const f = e.target.files[0]; if (f) scanFromFile(f); };

/* 이미지 카드 */
$('#imgCamBtn').onclick = () => { $('#imgCamInput').value = ''; $('#imgCamInput').click(); };
$('#imgPickBtn').onclick = () => { $('#imgPickInput').value = ''; $('#imgPickInput').click(); };
$('#imgCamInput').onchange = e => addImages(e.target.files);
$('#imgPickInput').onchange = e => addImages(e.target.files);
$('#imgGrid').addEventListener('click', e => {
  const d = e.target.closest('[data-img-del]');
  if (d) { form.images.splice(+d.dataset.imgDel, 1); renderImages(); syncForm(); }
});

/* 설치 안내 (아이폰 사파리에서 아직 홈 화면 앱이 아닐 때) */
const standalone = navigator.standalone || matchMedia('(display-mode: standalone)').matches;
try { if (isIOS && !standalone && !localStorage.getItem(KEY + '.tip')) $('#installTip').classList.remove('hidden'); } catch (e) {}
$('#tipClose').onclick = () => { $('#installTip').classList.add('hidden'); try { localStorage.setItem(KEY + '.tip', '1'); } catch (e) {} };

let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (!openId) render(false); }, 150); });
render(true);
</script>
</body>
</html>
