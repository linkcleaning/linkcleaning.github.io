<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E0F11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>비서실 출발 안내판</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="/fids/fids.css">
<script src="/v.js" data-v="v2" defer></script>
<style>
  html,body{margin:0;background:#0E0F11;color:#F4E3B1;font-family:"Pretendard",sans-serif;-webkit-text-size-adjust:100%}
  .wrap{max-width:1100px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 12px max(16px,env(safe-area-inset-bottom))}
  .bar{display:flex;justify-content:space-between;align-items:center;margin:2px 2px 10px}
  .bar a,.bar button{font:inherit;font-size:14px;font-weight:800;color:#C9CEDB;background:none;border:0;text-decoration:none;padding:6px 2px;cursor:pointer}
  .fids-cols,.fids-row{grid-template-columns:3.4rem minmax(0,1fr) 2.7rem 5.4rem}
  .fids-cols .fl,.fids-row .fl{display:none}
  @media (min-width:720px){.fids-cols,.fids-row{grid-template-columns:5.2rem minmax(0,1fr) 6.5rem 4rem 9rem}.fids-cols .fl,.fids-row .fl{display:block}}
  .sec{margin-top:14px}
  .sum{display:flex;gap:6px;flex-wrap:wrap;margin:8px 2px 0;font-size:12px;color:#94A3B8}
  .sum b{color:#3EE0A0}
  .empty{padding:18px 12px;color:#8A8F9E;font-family:"Do Hyeon",sans-serif;font-size:17px}
  body.tv .bar{display:none} body.tv .wrap{max-width:none;padding:14px 18px}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar"><a href="./office.html">‹ 비서실</a><button id="tvBtn" type="button">⛶ 전체 화면</button></div>

  <div class="fids" aria-label="오늘 비서실 업무 출발 안내판">
    <div class="fids-head">
      <div class="fids-title"><span class="fids-plane">✈</span><span><b>링크 미래전략실 출발 안내</b><small>TODAY'S DEPARTURES · 비서실 오늘 업무</small></span></div>
      <div class="fids-clock"><span class="d" id="cd"></span><span class="t" id="ct"></span></div>
    </div>
    <div class="fids-table">
      <div class="fids-cols"><span>시간<small>TIME</small></span><span>업무<small>TO</small></span><span class="fl">편명<small>FLIGHT</small></span><span style="text-align:center">게이트<small>GATE</small></span><span>상태<small>REMARKS</small></span></div>
      <div id="today"></div>
    </div>
  </div>
  <div class="sum" id="sum"></div>

  <div class="fids sec" id="tmrBox" hidden aria-label="내일 일정">
    <div class="fids-head"><div class="fids-title"><span class="fids-plane" style="background:#F5D547">✈</span><span><b>내일 출발 예정</b><small>TOMORROW · 저녁 보고 기준</small></span></div></div>
    <div class="fids-table"><div id="tmr"></div></div>
  </div>

  <div class="fids-ticker" id="ticker" hidden><span id="tickText"></span></div>
</div>

<script src="/fids/fids.js"></script>
<script src="schedule.js"></script>
<script>
(function () {
  var S = window.LINK_SCHEDULE, F = window.FIDS;
  F.clock(document.getElementById('cd'), document.getElementById('ct'));
  var CODE = { chief: 'CH', pr: 'PR', sns: 'SN', sales: 'SA', strategy: 'ST', biz: 'BZ' };

  function el(t, c, x) { var e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; }
  function hm(s) { var m = /(\d{1,2}):(\d{2})/.exec(s || ''); return m ? +m[1] * 60 + +m[2] : null; }

  // 오늘 할 업무를 시간순으로
  function todayList() {
    var k = F.kst(), out = [];
    S.DEPTS.forEach(function (d) {
      (S.NOW[d.key] || []).forEach(function (t, i) {
        var days = t[6] || [], monthly = !days.length;
        if (monthly ? k.d !== 1 : days.indexOf(k.dow) < 0) return;
        out.push({ who: t[0], title: t[1], when: t[3], min: hm(t[3]), pc: !!t[4], key: t[5], flight: CODE[d.key] + (100 + i * 7 + (d.person ? d.person.length : 0)) });
      });
    });
    out.sort(function (a, b) { return (a.min == null ? 9999 : a.min) - (b.min == null ? 9999 : b.min); });
    return out;
  }

  var rows = [];
  function build() {
    var box = document.getElementById('today'); box.innerHTML = '';
    var list = todayList();
    if (!list.length) { box.appendChild(el('div', 'empty', '오늘은 정기 업무가 없습니다')); return; }
    list.forEach(function (t, i) {
      var r = el('a', 'fids-row'); r.href = './office.html';
      var tm = el('span', 'tm'), to = el('span', 'to'), fl = el('span', 'fl'), gt = el('span', 'fids-gate', t.pc ? 'PC' : '자동'), st = el('span', 'fids-st');
      var main = el('span'); to.appendChild(main); to.appendChild(el('span', 'sub', t.who));
      var sk = el('span'), se = el('small'); st.appendChild(sk); st.appendChild(se);
      if (!t.pc) gt.className = 'fids-gate off';
      r.append(tm, to, fl, gt, st); box.appendChild(r);
      F.flap(tm, t.min == null ? '--:--' : F.p2(t.min / 60 | 0) + ':' + F.p2(t.min % 60), i * 60);
      F.flap(main, t.title, i * 60 + 30);
      F.flap(fl, t.flight, i * 60 + 60);
      rows.push({ t: t, r: r, sk: sk, se: se, st: st, last: '' });
    });
  }

  function paint(status) {
    var k = F.kst(), nowMin = k.h * 60 + k.mi, today = k.y + '-' + F.p2(k.mo + 1) + '-' + F.p2(k.d);
    var items = status && status.date === today ? status.items || {} : {}, done = 0;
    rows.forEach(function (x, i) {
      var it = x.t.key ? items[x.t.key] : null, s;
      if (it && it.done) { s = ['완료 ' + (it.at || ''), 'DEPARTED', 'ok']; done++; }
      else if (it && it.done === false) { s = ['못 함', 'CANCELLED', 'bad']; }
      else if (x.t.min == null) s = ['예정', 'SCHEDULED', 'wait'];
      else if (nowMin < x.t.min - 30) s = ['대기', 'ON TIME', 'wait'];
      else if (nowMin < x.t.min + 5) s = ['곧 시작', 'BOARDING', 'board'];
      else if (nowMin < x.t.min + 90) s = ['진행 중', 'IN PROGRESS', 'late'];
      else s = ['지연', 'DELAYED', 'late'];
      x.st.className = 'fids-st ' + s[2]; x.r.classList.toggle('dim', s[2] === 'ok');
      var key = s[0] + s[1];
      if (x.last !== key) { F.flap(x.sk, s[0], x.last ? 0 : i * 60 + 90); x.se.textContent = s[1]; x.last = key; }
    });
    var sum = document.getElementById('sum');
    sum.innerHTML = '';
    sum.append('오늘 ' + rows.length + '편 중 ');
    sum.appendChild(el('b', null, done + '편 출발 완료'));
    sum.append(' · 1분마다 새로 고침');
  }

  function get(u) { return fetch(u + '?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; }); }
  function load() { get('data/status.json').then(paint); }

  function extras() {
    var k = F.kst(), today = k.y + '-' + F.p2(k.mo + 1) + '-' + F.p2(k.d);
    get('data/day-report.json').then(function (d) {
      if (!d || d.date !== today || !(d.tomorrow || []).length) return;
      var box = document.getElementById('tmr'); box.innerHTML = '';
      d.tomorrow.slice(0, 8).forEach(function (line, i) {
        var m = /^\s*(\d{1,2}:\d{2})\s*(.*)$/.exec(line), r = el('div', 'fids-row');
        var tm = el('span', 'tm'), to = el('span', 'to wrap'), fl = el('span', 'fl', ''), gt = el('span', 'fids-gate off', '-'), st = el('span', 'fids-st wait');
        st.appendChild(el('span', null, '예정')); st.appendChild(el('small', null, 'SCHEDULED'));
        r.append(tm, to, fl, gt, st); box.appendChild(r);
        F.flap(tm, m ? m[1] : '종일', i * 60); F.flap(to, m ? m[2] : line, i * 60 + 30);
      });
      document.getElementById('tmrBox').hidden = false;
    });
    get('data/today.json').then(function (t) {
      if (!t || !t.headline) return;
      document.getElementById('tickText').textContent = '✈  ' + t.headline;
      document.getElementById('ticker').hidden = false;
    });
  }

  document.getElementById('tvBtn').addEventListener('click', function () {
    document.body.classList.add('tv');
    var d = document.documentElement; (d.requestFullscreen || d.webkitRequestFullscreen || function () {}).call(d);
  });
  document.addEventListener('fullscreenchange', function () { if (!document.fullscreenElement) document.body.classList.remove('tv'); });

  build(); load(); extras();
  setInterval(load, 60000);
})();
</script>
</body>
</html>
