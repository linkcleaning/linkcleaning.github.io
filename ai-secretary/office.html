<style>
  /* 비서실 화면 — 앱 안에서 열림 (Claude 앱으로 넘어가지 않음). 대화만 Claude에서. */
  :root {

  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); -webkit-tap-highlight-color: transparent; }
  body { padding: 0 0 calc(env(safe-area-inset-bottom, 0px) + 24px); }
  .top { background: var(--brand-deep); border-radius: 0 0 32px 32px; padding: calc(env(safe-area-inset-top, 0px) + 10px) max(12px, env(safe-area-inset-right, 0px)) 18px max(12px, env(safe-area-inset-left, 0px)); }

  .bar-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .back { appearance: none; border: 0; display: inline-flex; align-items: center; gap: 4px; background: #191919; color: #FFD233; font: 800 14px var(--sans); border-radius: 999px; padding: 9px 14px 9px 10px; cursor: pointer; text-decoration: none; }

  .eyebrow { display: inline-block; font-size: 11px; font-weight: 800; color: #FFD233; background: #191919; border-radius: 999px; padding: 4px 10px; }
  h1 { font-weight: 900; letter-spacing: -0.03em; font-size: 30px; line-height: 38px; margin: 10px 0 4px; }
  .lead { color: #45474D; font-size: 14px; line-height: 1.6; margin: 0; }

  .org { margin-top: 16px; display: grid; justify-items: center; }
  .node { border-radius: 999px; padding: 7px 16px; font-weight: 700; font-size: 14px; white-space: nowrap; text-decoration: none; }
  .node small { font-weight: 500; opacity: .8; margin-left: 6px; font-size: 12px; }
  .node.chair { background: #191919; color: #fff; border: 2px solid #fff; }
  .node.ceo { background: #fff; color: var(--ink); }
  .node.chief { background: #191919; color: #FFD233; }
  .stem { width: 2px; height: 14px; background: #19191933; }
  .hbar { width: 100%; height: 2px; background: #19191933; }
  .suseok { width: 100%; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
  .su { display: grid; gap: 2px; text-align: center; text-decoration: none; color: var(--ink); background: #fff; border: 2px solid #191919; border-radius: 16px; padding: 10px 6px; position: relative; }
  .su::before { content: ""; position: absolute; top: -12px; left: 50%; width: 2px; height: 10px; background: #19191933; }
  .su b { font-size: 15px; font-weight: 900; }
  .su i { font-style: normal; font-size: 12px; font-weight: 700; }
  .su span { font-size: 11px; color: #191919; line-height: 1.35; }

  .wrap { max-width: 520px; margin: 0 auto; display: grid; gap: 8px; padding: 10px max(12px, env(safe-area-inset-right, 0px)) 0 max(12px, env(safe-area-inset-left, 0px)); }
  .status { background: var(--card); border-radius: 14px; padding: 12px 16px; font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
  .dot { width: 8px; height: 8px; border-radius: 999px; background: var(--muted); flex: none; }
  .dot.ok { background: var(--leaf); } .dot.bad { background: var(--danger); }

  #chief { --dc: #191919; } #pr { --dc: #FF6B00; } #sns { --dc: #1A73E8; } #sales { --dc: #0E9F5A; }
  #strategy { --dc: #7C3AED; } #office { --dc: #6B6E76; } #biz { --dc: #E0306B; }
  .dept { display: grid; gap: 8px; background: #fff; border-radius: 24px; padding: 0 0 12px; overflow: hidden; border: 2px solid var(--dc); margin-top: 6px; scroll-margin-top: 12px; }
  .dept-head { background: var(--dc); color: #fff; padding: 14px 16px; display: flex; align-items: baseline; gap: 8px; }
  .dept-head h2 { margin: 0; font-weight: 900; letter-spacing: -0.02em; font-size: 21px; }
  .dept-head span { color: #ffffffd9; font-weight: 600; font-size: 13px; }
  .task { margin: 0 12px; border: 1.5px solid #E2E4E9; border-left: 6px solid var(--dc); border-radius: 16px; padding: 14px; display: grid; gap: 8px; }
  .task-head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
  .who { font-size: 12px; font-weight: 800; color: var(--dc); }
  .task h3 { margin: 2px 0 0; font-size: 18px; line-height: 1.35; font-weight: 800; }
  .task p { margin: 0; color: var(--muted); font-size: 13.5px; line-height: 1.55; }
  .chip { flex: none; font-size: 11px; font-weight: 800; border-radius: 6px; padding: 4px 8px; white-space: nowrap; background: color-mix(in srgb, var(--dc) 14%, #fff); color: var(--dc); }

  .meta b { color: var(--dc); font-weight: 800; }
  .donechip { display: inline-block; border-radius: 999px; padding: 4px 10px; font-size: 12.5px; font-weight: 800; background: #F2F3F5; color: #6B6E76; }
  .donechip.ok { background: #14B86A; color: #fff; }
  .donechip.bad { background: #F04438; color: #fff; }
  .donechip.off { color: #A0A3AA; font-weight: 600; }
  .applink { display: block; text-align: center; border-radius: 999px; padding: 13px; font-weight: 700; font-size: 15px; color: var(--brand); background: var(--brand-tint); text-decoration: none; }

  .chat { background: #fff; border: 2px solid #191919; border-radius: 22px; overflow: hidden; scroll-margin-top: 12px; }
  .chat-head { background: #191919; color: #FFD233; padding: 12px 14px; font-weight: 900; font-size: 19px; letter-spacing: -0.02em; }
  .chat-body { padding: 14px; display: grid; gap: 10px; }
  .chat-body p { margin: 0; font-size: 14px; line-height: 1.6; color: #45474D; }
  .go { display: block; text-align: center; text-decoration: none; border-radius: 999px; padding: 14px; font: 800 16px var(--sans); background: #191919; color: #FFD233; }

  .hint { font-size: 12px !important; color: var(--muted) !important; }
  @media (max-width: 360px) { .suseok { grid-template-columns: repeat(2, 1fr); } }
</style>

  DEPTS.forEach(function (d) {
    var sec = el('section', 'dept'); sec.id = d.key;
    var head = el('div', 'dept-head'); head.appendChild(el('h2', null, d.name)); head.appendChild(el('span', null, (d.person ? d.person + ' · ' : '') + d.duty));
    sec.appendChild(head);
    (NOW[d.key] || []).forEach(function (t) {
      var card = el('article', 'task');
      var th = el('div', 'task-head');
      var left = el('div'); left.appendChild(el('div', 'who', t[0] + (d.person && /수석|실장/.test(t[0]) ? ' ' + d.person : ''))); left.appendChild(el('h3', null, t[1])); th.appendChild(left);
      th.appendChild(el('span', 'chip' + (t[4] ? ' pc' : ''), t[4] ? 'PC 켜져 있어야 함' : '자동'));
      card.appendChild(th);
      card.appendChild(el('p', null, t[2]));
      var meta = el('div', 'meta');
      var sched = el('span'); sched.append('정기 '); sched.appendChild(el('b', null, t[3])); meta.appendChild(sched);
      var dc = el('span', 'donechip', '확인 중…'); meta.appendChild(dc); chips.push({ el: dc, key: t[5], days: t[6] });
      card.appendChild(meta);
      sec.appendChild(card);
    });
    if (d.app) {
      var c = el('article', 'task');
      var l2 = el('div'); l2.appendChild(el('div', 'who', d.short)); l2.appendChild(el('h3', null, d.app.title)); c.appendChild(l2);
      c.appendChild(el('p', null, d.app.desc));
      var a = el('a', 'applink', d.app.link); a.href = './'; c.appendChild(a);
      sec.appendChild(c);
    }
    root.appendChild(sec);
  });

  var dot = document.getElementById('dot'), statusText = document.getElementById('statusText');
  function renderDone(st) {
    var today = ymdKST(), dow = dowKST(), fresh = st && st.date === today, n = 0, m = 0;
    chips.forEach(function (c) {
      var s = c.el, it = fresh && c.key ? (st.items || {})[c.key] : null;
      s.className = 'donechip';
      var due = c.days.indexOf(dow) >= 0; if (due) m++;
      if (it && it.done) { n += due ? 1 : 0; s.classList.add('ok'); s.textContent = '✓ 오늘 ' + (it.at || '') + ' 완료'; return; }
      if (it && it.done === false) { s.classList.add('bad'); s.textContent = '✗ 못 함' + (it.note ? ' · ' + it.note : ''); return; }
      if (!c.days.length) { s.classList.add('off'); s.textContent = '매월 1일'; return; }
      if (!due) { s.classList.add('off'); s.textContent = '오늘은 안 하는 날'; return; }
      s.textContent = '오늘 아직 전';
    });
    if (st) { dot.className = 'dot ok'; statusText.textContent = '오늘 비서실 업무 ' + n + '/' + m + ' 완료'; }
    else { dot.className = 'dot bad'; statusText.textContent = '업무 기록을 불러오지 못했어요. 잠시 뒤 다시 열어 주세요.'; }
  }
  function load() {
    fetch('data/status.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) { renderDone(j); })
      .catch(function () { renderDone(null); });
  }
  load();
  setInterval(load, 120000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) load(); });
})();
</script>
</body>
</html>
