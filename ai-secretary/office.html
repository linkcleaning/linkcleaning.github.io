      ['정보비서관', 'AI 도구·자동화 정찰', '유튜브·웹에서 대표님께 맞는 새 자동화 방법을 찾아 원리·쓸 곳·손·비용·위험을 따져 많아야 3개만 보고합니다.', '월·목 10:43', 1, 'scout', [1,4]]
    ],
    biz: [
      ['제휴수석', '살림기록소 글·릴스 준비', '살림 팩트체크 O/X, 공감 꿀팁 글, 월·수·금 쿠팡 글, 먼지씨 릴스를 준비합니다.', '매일 18:57', 0, 'coupang', ALL],
      ['제휴수석', '살림기록소 게시·클릭 기록', '스레드·인스타에 올리고 쿠팡 링크를 달며, 살림 이웃 댓글과 클릭·구매 기록을 남깁니다.', '매일 20:47', 1, 'salim', ALL],
      ['제휴수석', '부수입 리포트', '쿠팡파트너스처럼 부수입을 낼 수 있는 새 방법 2개를 찾아 보고합니다.', '매주 금 18:57', 0, 'sidejobs', [5]]
    ]
  };

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function ymdKST() { return new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10); }
  function dowKST() { return new Date(Date.now() + 9 * 3600e3).getUTCDay(); }

  // 부서별 연결 앱 (대표님 11/19: 홍보수석 누르면 찰칵블로그처럼, 다른 수석실도 맞는 앱으로)
  var G = 'https://linkcleaning.github.io/';
  var APPS = {
    chief: [['📊', '미래전략실 브리핑', './', '브리핑'], ['🧾', '세무장부', G + 'ledger/']],
    pr: [['📸', '찰칵블로그', 'https://linkclean-blog-writer.vercel.app/', '블로그'], ['🧹', '현장홍보', 'https://linkclean-promo.han0829.workers.dev/']],
    sns: [['🧵', '오늘의 스레드', G + 'threads/', '스레드'], ['📷', '인스타 영업 비서', G + 'insta/']],
    sales: [['📞', '콜백문자', G + 'callback/', '콜백'], ['🧾', '영수증·견적서', G + 'receipt/'], ['⭐', '후기부스터', G + 'review/'], ['🏠', '통합 현장관리', G + 'field/']],
    strategy: [['📈', '순위노트', G + 'rank/', '순위'], ['🗂', '앱 현황판', G + 'apps/']],
    office: [['💊', '약 체크·건강', './?action=health', '건강'], ['🇯🇵', '박람회 포켓 가이드', G + 'expo/', '박람회']],
    biz: [['🛒', '오늘의 스레드(쿠팡 글)', G + 'threads/', '쿠팡 글']]
  };
  var chips = [];
  var root = document.getElementById('depts');
  DEPTS.forEach(function (d) {
    var sec = el('section', 'dept'); sec.id = d.key;
    var head = el('div', 'dept-head'); head.appendChild(el('h2', null, d.name)); head.appendChild(el('span', null, (d.person ? d.person + ' · ' : '') + d.duty));
    sec.appendChild(head);
    if (APPS[d.key]) {
      var ar = el('div', 'approw');
      APPS[d.key].forEach(function (x, i) { var a = el('a', 'appbtn' + (i === 0 ? ' main' : ''), x[0] + ' ' + x[1]); a.href = x[2]; ar.appendChild(a); });
      sec.appendChild(ar);
    }
    (NOW[d.key] || []).forEach(function (t) {
      var card = el('article', 'task');
      var th = el('div', 'task-head');
      var left = el('div'); left.appendChild(el('div', 'who', t[0] + (d.person && /수석|실장/.test(t[0]) ? ' ' + d.person : ''))); left.appendChild(el('h3', null, t[1])); th.appendChild(left);
      th.appendChild(el('span', 'chip' + (t[4] ? ' pc' : ''), t[4] ? 'PC 켜져 있어야 함' : '자동'));
      card.appendChild(th);
      card.appendChild(el('p', null, t[2]));
      var meta = el('div', 'meta');
      var sched = el('span'); sched.append('정기 '); sched.appendChild(el('b', null, t[3])); meta.appendChild(sched);
      var dc = el('span', 'donechip', '확인 중…'); meta.appendChild(dc); chips.push({ el: dc, key: t[5], days: t[6] });
      card.appendChild(meta);
      sec.appendChild(card);
    });
    var appCard = null;
    if (d.app) {
      var c = el('article', 'task'); appCard = c;
      var l2 = el('div'); l2.appendChild(el('div', 'who', d.short)); l2.appendChild(el('h3', null, d.app.title)); c.appendChild(l2);
      c.appendChild(el('p', null, d.app.desc));
      var a = el('a', 'applink', d.app.link); a.href = d.app.url || './'; c.appendChild(a);
      sec.appendChild(c);
    }
    root.appendChild(sec);
  });

  // 한눈에 보기 판 — 부서마다 한 줄: 이름 · 오늘 몇 개 했나 · 대표 앱 (대표님 11/19 "너무 정신이 없다")
  var board = document.getElementById('board'), ci = 0, SUM = {};
  DEPTS.forEach(function (d) {
    var list = NOW[d.key] || []; if (!list.length) return;
    var row = el('div', 'brow'); row.setAttribute('data-k', d.key);
    var main = el('a', 'bmain'); main.href = '#' + d.key;
    main.addEventListener('click', function (ev) { ev.preventDefault(); document.getElementById(d.key).scrollIntoView({ behavior: 'smooth', block: 'start' }); });
    main.appendChild(el('span', 'bdot'));
    var txt = el('div'); var nm = el('div', 'bname', d.short); if (d.person) nm.appendChild(el('small', null, d.person)); txt.appendChild(nm);
    var sum = el('div', 'bsum', '확인 중…'); txt.appendChild(sum); main.appendChild(txt);
    row.appendChild(main);
    SUM[d.key] = sum;
    list.forEach(function () { chips[ci++].dept = d.key; });
    var A0 = APPS[d.key] && APPS[d.key][0];
    if (A0) { var ab = el('a', 'bapp', A0[0] + ' ' + (A0[3] || A0[1]) + ' ›'); ab.href = A0[2]; row.appendChild(ab); }
    board.appendChild(row);
  });

  var statusText = document.getElementById('statusText');
  function renderDone(st) {
    var today = ymdKST(), dow = dowKST(), fresh = st && st.date === today, n = 0, m = 0, per = {};
    chips.forEach(function (c) {
      var s = c.el, it = fresh && c.key ? (st.items || {})[c.key] : null;
      s.className = 'donechip'; var g = per[c.dept] || (per[c.dept] = { ok: 0, due: 0, bad: 0 }); var setP = function (cls) { if (cls === 'ok') g.ok++; if (cls === 'bad') g.bad++; };
      var due = c.days.indexOf(dow) >= 0; if (due) { m++; g.due++; }
      if (it && it.done) { n += due ? 1 : 0; s.classList.add('ok'); s.textContent = '✓ 오늘 ' + (it.at || '') + ' 완료'; setP('ok', it.at); return; }
      if (it && it.done === false) { s.classList.add('bad'); s.textContent = '✗ 못 함' + (it.note ? ' · ' + it.note : ''); setP('bad'); return; }
      if (!c.days.length) { s.classList.add('off'); s.textContent = '매월 1일'; setP('off'); return; }
      if (!due) { s.classList.add('off'); s.textContent = '오늘은 안 하는 날'; setP('off'); return; }
      s.textContent = '오늘 아직 전'; setP('due');
    });
    Object.keys(SUM).forEach(function (k) {
      var g = per[k] || { ok: 0, due: 0, bad: 0 }, e = SUM[k]; e.textContent = '';
      if (!g.due && !g.ok) { e.textContent = '오늘은 쉬는 날'; return; }
      e.append('오늘 '); e.appendChild(el('b', g.ok >= g.due ? null : 'todo', g.ok + '/' + Math.max(g.due, g.ok) + ' 완료'));
      if (g.bad) e.appendChild(el('span', 'bad', ' · 못 함 ' + g.bad));
    });
    if (st) { statusText.textContent = '오늘 비서실 업무 ' + n + '/' + m + ' 완료 · 결과는 아침·저녁 보고로 와요'; }
    else { statusText.textContent = '업무 기록을 불러오지 못했어요. 잠시 뒤 다시 열어 주세요.'; }
  }
  function load() {
    fetch('data/status.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) { renderDone(j); })
      .catch(function () { renderDone(null); });
  }
  load();
  setInterval(load, 120000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) load(); });
})();
</script>
