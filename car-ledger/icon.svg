<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- 스마트 차계부 홈 화면 아이콘: 행운로또와 같은 스티커풍(밝은 배경 + 굵은 남색 외곽선) -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.65" stop-color="#eef5fc"/>
      <stop offset="1" stop-color="#dfeaf6"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4aa3ff"/>
      <stop offset="0.55" stop-color="#2f7cf0"/>
      <stop offset="1" stop-color="#1f5fd0"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9f3ff"/>
      <stop offset="1" stop-color="#8fd3f7"/>
    </linearGradient>
    <linearGradient id="gaugeArc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5a5f"/>
      <stop offset="0.45" stop-color="#ffc83d"/>
      <stop offset="1" stop-color="#2ccf7c"/>
    </linearGradient>
    <linearGradient id="drop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffbe4a"/>
      <stop offset="1" stop-color="#ff8a1c"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe27a"/>
      <stop offset="1" stop-color="#f5b70a"/>
    </linearGradient>
    <g id="spark">
      <path d="M0 -26 C4 -6 6 -4 26 0 C6 4 4 6 0 26 C-4 6 -6 4 -26 0 C-6 -4 -4 -6 0 -26 Z" fill="#ffc83d"/>
    </g>
  </defs>

  <!-- 배경 -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- 흩날리는 점 -->
  <g fill="#ffc83d">
    <circle cx="262" cy="196" r="9"/><circle cx="790" cy="150" r="8"/><circle cx="118" cy="660" r="8"/>
    <circle cx="928" cy="690" r="9"/><circle cx="600" cy="120" r="7"/>
  </g>
  <g fill="#7cc6ff">
    <circle cx="430" cy="210" r="8"/><circle cx="905" cy="300" r="7"/><circle cx="96" cy="430" r="7"/>
  </g>
  <use href="#spark" transform="translate(104 470) scale(0.9)"/>
  <use href="#spark" transform="translate(720 230) scale(0.8)"/>
  <use href="#spark" transform="translate(930 760) scale(0.8)"/>
  <use href="#spark" transform="translate(96 760) scale(0.7)"/>

  <g transform="translate(512 640) scale(1.15) translate(-512 -640)">
  <!-- 계기판 아크 (원래 아이콘의 속도계 모티프) -->
  <g fill="none" stroke-linecap="round">
    <path d="M 210 600 A 302 302 0 0 1 814 600" stroke="#14213d" stroke-width="78"/>
    <path d="M 210 600 A 302 302 0 0 1 814 600" stroke="url(#gaugeArc)" stroke-width="50"/>
  </g>
  <g fill="#ffffff" opacity="0.95">
    <circle cx="238" cy="470" r="8"/><circle cx="318" cy="368" r="8"/><circle cx="512" cy="298" r="9"/>
    <circle cx="706" cy="368" r="8"/><circle cx="786" cy="470" r="8"/>
  </g>
  <!-- 바늘: 연비 좋음(초록) 쪽 -->
  <line x1="512" y1="600" x2="742" y2="392" stroke="#14213d" stroke-width="30" stroke-linecap="round"/>
  <line x1="512" y1="600" x2="742" y2="392" stroke="#ff5a5f" stroke-width="14" stroke-linecap="round"/>

  <!-- 자동차 마스코트 (정면) -->
  <g stroke="#14213d" stroke-width="18" stroke-linejoin="round" stroke-linecap="round">
    <!-- 사이드미러 -->
    <ellipse cx="238" cy="590" rx="52" ry="36" fill="url(#body)" transform="rotate(-18 238 590)"/>
    <ellipse cx="786" cy="590" rx="52" ry="36" fill="url(#body)" transform="rotate(18 786 590)"/>
    <!-- 바퀴 -->
    <rect x="288" y="790" width="104" height="96" rx="30" fill="#14213d"/>
    <rect x="632" y="790" width="104" height="96" rx="30" fill="#14213d"/>
    <!-- 캐빈 -->
    <path d="M 318 590 C 336 488 384 446 512 446 C 640 446 688 488 706 590 Z" fill="url(#body)"/>
    <path d="M 360 584 C 374 512 408 488 512 488 C 616 488 650 512 664 584 Z" fill="url(#glass)" stroke-width="14"/>
    <!-- 차체 -->
    <path d="M 286 574 C 330 560 420 556 512 556 C 604 556 694 560 738 574 C 800 594 826 650 826 712 C 826 790 792 828 730 828 L 294 828 C 232 828 198 790 198 712 C 198 650 224 594 286 574 Z" fill="url(#body)"/>
  </g>
  <!-- 유리 반사 -->
  <path d="M 400 572 C 410 532 432 512 470 508 L 446 572 Z" fill="#ffffff" opacity="0.75"/>
  <!-- 차체 하이라이트 -->
  <path d="M 262 640 C 280 604 320 590 370 586" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" opacity="0.55"/>

  <!-- 눈(헤드라이트) -->
  <g stroke="#14213d" stroke-width="14">
    <circle cx="398" cy="664" r="64" fill="#ffffff"/>
    <circle cx="626" cy="664" r="64" fill="#ffffff"/>
  </g>
  <circle cx="410" cy="668" r="34" fill="#14213d"/>
  <circle cx="614" cy="668" r="34" fill="#14213d"/>
  <circle cx="422" cy="654" r="12" fill="#ffffff"/>
  <circle cx="626" cy="654" r="12" fill="#ffffff"/>
  <circle cx="400" cy="682" r="5" fill="#ffffff"/>
  <circle cx="604" cy="682" r="5" fill="#ffffff"/>

  <!-- 볼터치 -->
  <ellipse cx="290" cy="740" rx="34" ry="20" fill="#ff8fa3" opacity="0.7"/>
  <ellipse cx="734" cy="740" rx="34" ry="20" fill="#ff8fa3" opacity="0.7"/>

  <!-- 입(그릴) -->
  <path d="M 452 736 C 470 790 554 790 572 736 Z" fill="#14213d" stroke="#14213d" stroke-width="12" stroke-linejoin="round"/>
  <path d="M 482 772 C 498 758 526 758 542 772 C 528 782 496 782 482 772 Z" fill="#ff6b81"/>

  <!-- 범퍼 + 번호판 -->
  <rect x="246" y="800" width="532" height="44" rx="22" fill="#cfdbe9" stroke="#14213d" stroke-width="16"/>
  <rect x="452" y="806" width="120" height="32" rx="8" fill="#ffffff" stroke="#14213d" stroke-width="8"/>
  <g fill="#14213d"><circle cx="486" cy="822" r="5"/><circle cx="512" cy="822" r="5"/><circle cx="538" cy="822" r="5"/></g>

  </g>

  <!-- 기름방울 -->
  <g transform="translate(150 236) rotate(-12) scale(0.9)">
    <path d="M 0 -78 C 34 -30 62 4 62 38 C 62 74 34 98 0 98 C -34 98 -62 74 -62 38 C -62 4 -34 -30 0 -78 Z" fill="url(#drop)" stroke="#14213d" stroke-width="16" stroke-linejoin="round"/>
    <path d="M -30 30 C -30 10 -18 -8 -6 -22" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.85"/>
  </g>

  <!-- 동전(₩) -->
  <g transform="translate(872 232) scale(0.9)">
    <circle r="72" fill="url(#coin)" stroke="#14213d" stroke-width="16"/>
    <circle r="48" fill="none" stroke="#e09a00" stroke-width="7"/>
    <path d="M -30 -24 L -16 26 L 0 -10 L 16 26 L 30 -24" fill="none" stroke="#8a5a00" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M -38 -2 L 38 -2" stroke="#8a5a00" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- 렌치 -->
  <g transform="translate(900 470) rotate(32) scale(0.78)">
    <path d="M -16 -20 L 16 -20 L 18 110 C 18 124 -18 124 -18 110 Z" fill="#c9d4e2" stroke="#14213d" stroke-width="14" stroke-linejoin="round"/>
    <path d="M -50 -64 C -60 -30 -40 -6 -16 -10 L 16 -10 C 40 -6 60 -30 50 -64 L 30 -60 L 24 -36 L -24 -36 L -30 -60 Z" fill="#c9d4e2" stroke="#14213d" stroke-width="14" stroke-linejoin="round"/>
  </g>

  <!-- 달력 -->
  <g transform="translate(300 150) rotate(-10) scale(0.78)">
    <rect x="-62" y="-54" width="124" height="118" rx="18" fill="#ffffff" stroke="#14213d" stroke-width="14"/>
    <path d="M -62 -36 C -62 -46 -54 -54 -44 -54 L 44 -54 C 54 -54 62 -46 62 -36 L 62 -14 L -62 -14 Z" fill="#ff5a5f" stroke="#14213d" stroke-width="14" stroke-linejoin="round"/>
    <g fill="#14213d"><rect x="-34" y="-70" width="14" height="30" rx="7"/><rect x="20" y="-70" width="14" height="30" rx="7"/></g>
    <g fill="#9fb3cc">
      <circle cx="-32" cy="12" r="8"/><circle cx="0" cy="12" r="8"/><circle cx="32" cy="12" r="8" fill="#2ccf7c"/>
      <circle cx="-32" cy="40" r="8"/><circle cx="0" cy="40" r="8"/><circle cx="32" cy="40" r="8"/>
    </g>
  </g>

  <!-- 행운로또와 같은 굵은 남색 프레임 (위쪽 가운데가 트인 모양) -->
  <path d="M 380 34 L 184 34 C 101 34 34 101 34 184 L 34 840 C 34 923 101 990 184 990 L 840 990 C 923 990 990 923 990 840 L 990 184 C 990 101 923 34 840 34 L 644 34"
        fill="none" stroke="#14213d" stroke-width="34" stroke-linecap="round"/>
</svg>
