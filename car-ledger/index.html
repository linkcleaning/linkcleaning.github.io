<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>스마트 차계부</title>
<meta name="description" content="주유·정비 기록, 연비 자동 계산, 소모품 교체 알림, 지출 캘린더">
<meta name="theme-color" content="#0a1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="차계부">
<link rel="manifest" href="app-v2.webmanifest">
<link rel="icon" href="favicon.ico?v=2" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png?v=2">
<link rel="icon" type="image/png" sizes="96x96" href="icons/icon-96.png?v=2">
<link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152.png?v=2">
<link rel="apple-touch-icon" sizes="167x167" href="icons/icon-167.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); }
html, body { margin: 0; }
/* 레이아웃: 휴대폰 한 열(최대 480px) 계기판 앱 — 상단 ODO 계기, 카드형 패널, 하단 고정 탭바 */
:root {
  /* 색: 아이콘의 딥 네이비 + 네온 시안 계기판 */
  --bg: #0a1020;
  --panel: #111a2e;
  --panel-2: #17223a;
  --line: #22304d;
  --ink: #e7eef8;
  --ink-dim: #8b9bb7;
  --ink-faint: #5d6d8a;
  --cyan: #38bdf8;
  --blue: #2563eb;
  --fuel: #38bdf8;
  --maint: #f5a524;
  --other: #a78bfa;
  --bad: #f87171;
  --warn: #fbbf24;
  --good: #34d399;
  /* 글꼴: 계기 숫자용 디스플레이 + 한글 본문 */
  --f-gauge: 'Chakra Petch', 'IBM Plex Sans KR', system-ui, sans-serif;
  --f-body: 'IBM Plex Sans KR', -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 18px;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
a { touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
.num { font-family: var(--f-gauge); font-variant-numeric: tabular-nums; }
.dim { color: var(--ink-dim); }
.faint { color: var(--ink-faint); }
.small { font-size: 12.5px; }

.app {
  max-width: 480px;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: 10px calc(84px + env(safe-area-inset-bottom, 0px));
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* ── 상단 ── */
.topbar { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.topbar h1 { font-size: 21px; font-weight: 700; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.eyebrow { font-size: 11.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-dim); }

/* 계기판 ODO: 숫자 칸 */
.odo { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.odo-cells { display: flex; gap: 2px; }
.odo-cells span {
  font-family: var(--f-gauge);
  font-weight: 600;
  font-size: 15px;
  width: 15px;
  height: 23px;
  display: grid;
  place-items: center;
  background: #050913;
  border: 1px solid var(--line);
  border-radius: 4px;
  color: var(--cyan);
  text-shadow: 0 0 8px rgba(56, 189, 248, 0.55);
}
.odo-cells .unit { width: auto; background: none; border: 0; color: var(--ink-dim); font-size: 12px; padding-left: 4px; text-shadow: none; }

.banner {
  display: flex; gap: 8px; align-items: center; justify-content: space-between; white-space: nowrap;
  border: 1px dashed rgba(245, 165, 36, 0.55);
  background: rgba(245, 165, 36, 0.08);
  border-radius: var(--r-md);
  padding: 7px 12px;
  font-size: 12.5px;
}
.banner > span { overflow: hidden; text-overflow: ellipsis; min-width: 0; }

/* ── 패널 ── */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 14px; min-width: 0; }
.panel h2 { font-size: 16px; margin: 0; font-weight: 700; }
.panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 8px; }
.hero {
  background:
    radial-gradient(120% 90% at 85% -10%, rgba(37, 99, 235, 0.35), transparent 60%),
    var(--panel-2);
  border-color: rgba(56, 189, 248, 0.3);
}
.hero .big { font-family: var(--f-gauge); font-size: clamp(26px, 8.4vw, 34px); font-weight: 700; line-height: 1.1; letter-spacing: -0.01em; }
.delta { font-size: 13px; font-weight: 600; }
.delta.up { color: var(--bad); }
.delta.down { color: var(--good); }
.breakdown { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
.breakdown .num { font-size: 14px; }
.swatch { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; vertical-align: 1px; }

.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-md); padding: 9px 10px; min-width: 0; }
.kpi .v { font-family: var(--f-gauge); font-size: clamp(17px, 5.4vw, 21px); font-weight: 600; }
.kpi .u { font-size: 11px; color: var(--ink-dim); margin-left: 3px; }

.quick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.quick button {
  border-radius: var(--r-md);
  min-height: 48px;
  padding: 8px 4px;
  border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
  background: color-mix(in srgb, var(--c) 12%, transparent);
  display: flex; align-items: center; justify-content: center; gap: 6px;
  font-weight: 600; font-size: 13.5px; white-space: nowrap;
}
.quick svg { width: 19px; height: 19px; color: var(--c); flex: none; }

/* ── 목록 ── */
.list { display: flex; flex-direction: column; }
.row {
  display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 10px; min-height: 56px; align-items: center;
  padding: 10px 0; border: 0; background: none; text-align: left; width: 100%;
  border-bottom: 1px solid color-mix(in srgb, var(--line) 60%, transparent);
}
.row:last-child { border-bottom: 0; }
.row .ic { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 16%, transparent); color: var(--c); }
.row .ic svg { width: 19px; height: 19px; }
.row .t { min-width: 0; }
.row .t b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .t span { display: block; font-size: 12.5px; color: var(--ink-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .amt { text-align: right; font-family: var(--f-gauge); font-weight: 600; }
.row .amt small { display: block; color: var(--cyan); font-size: 11.5px; font-family: var(--f-body); font-weight: 500; }
.empty { text-align: center; color: var(--ink-dim); padding: 18px 0; font-size: 13.5px; }

/* 상태 칩 */
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill.overdue { color: var(--bad); background: rgba(248, 113, 113, 0.14); }
.pill.soon { color: var(--warn); background: rgba(251, 191, 36, 0.14); }
.pill.ok { color: var(--good); background: rgba(52, 211, 153, 0.12); }
.pill.no_history { color: var(--ink-faint); background: rgba(139, 155, 183, 0.1); }
.due-line { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; gap: 8px; }

/* 정비 카드 */
.due-card.overdue { border-color: rgba(248, 113, 113, 0.5); }
.meter { height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; margin: 10px 0 8px; }
.meter i { display: block; height: 100%; border-radius: 3px; }

/* ── 차트 ── */
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.legend { display: flex; justify-content: center; gap: 14px; font-size: 12px; color: var(--ink-dim); margin-top: 6px; }

/* ── 캘린더 ── */
.cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.cal-head button { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; width: 36px; height: 36px; display: grid; place-items: center; }
.cal-head h2 { font-family: var(--f-gauge); font-size: 18px; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; }
.cal .dow { text-align: center; font-size: 11.5px; color: var(--ink-dim); padding: 4px 0; }
.cal .dow:first-child { color: var(--bad); }
.day {
  min-height: 52px; border-radius: 10px; border: 1px solid transparent; background: none; padding: 4px 2px;
  display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 0;
}
.day .d { font-size: 13.5px; }
.day .a { font-size: 9px; letter-spacing: -0.02em; color: var(--ink-dim); white-space: nowrap; }
.day .dots { display: flex; gap: 2px; }
.day .dots i { width: 5px; height: 5px; border-radius: 3px; }
.day.out { opacity: 0.28; }
.day.today .d { color: var(--cyan); font-weight: 700; }
.day.sel { background: rgba(56, 189, 248, 0.16); border-color: rgba(56, 189, 248, 0.45); }
.day.due { border-style: dashed; border-color: var(--maint); }
.month-sum { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.tag { padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); }

/* ── 폼 ── */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .label { font-size: 12.5px; font-weight: 600; color: var(--ink-dim); }
.input {
  display: flex; align-items: center; background: var(--panel-2); border: 1px solid var(--line);
  border-radius: var(--r-md); padding: 0 12px; min-width: 0;
}
.input:focus-within { border-color: var(--cyan); }
.input input, .input textarea, .input select { flex: 1; min-width: 0; width: 100%; background: none; border: 0; outline: 0; padding: 12px 0; font-size: 16px; }
.input .sfx { color: var(--ink-dim); font-size: 13.5px; margin-left: 8px; white-space: nowrap; }
.field.err .input { border-color: var(--bad); }
.hint { font-size: 12px; color: var(--ink-dim); }
.hint.auto { color: var(--cyan); }
.field.err .hint { color: var(--bad); }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.form { display: flex; flex-direction: column; gap: 14px; }

.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; margin-inline: -14px; padding-inline: 14px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.chips.scroll::-webkit-scrollbar { display: none; }
.chips.scroll .chip { flex: none; }
.chip { min-height: 38px; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel-2); color: var(--ink-dim); font-size: 14px; }
.chip[aria-pressed='true'] { border-color: var(--cyan); background: rgba(56, 189, 248, 0.15); color: var(--cyan); font-weight: 600; }

.seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--panel-2); border-radius: var(--r-md); padding: 4px; gap: 4px; }
.seg button { border: 0; background: none; padding: 9px 0; border-radius: var(--r-sm); font-weight: 600; color: var(--ink-dim); }
.seg button[aria-pressed='true'] { background: var(--cyan); color: #04101f; }

.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.switch { position: relative; width: 46px; height: 28px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.switch i { position: absolute; inset: 0; border-radius: 99px; background: var(--line); transition: background 0.15s; pointer-events: none; }
.switch i::after { content: ''; position: absolute; left: 3px; top: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--ink); transition: transform 0.15s; }
.switch input:checked + i { background: var(--cyan); }
.switch input:checked + i::after { transform: translateX(18px); }

.preview { border: 1px solid var(--cyan); background: rgba(56, 189, 248, 0.06); border-radius: var(--r-md); padding: 12px; }
.preview .eff { font-family: var(--f-gauge); font-size: 22px; font-weight: 700; color: var(--cyan); }
.warn-text { color: var(--warn); font-size: 13px; }

.photos { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
.photos .ph { position: relative; flex: none; width: 84px; height: 84px; border-radius: var(--r-md); overflow: hidden; border: 1px solid var(--line); background: var(--panel-2); }
.photos img { width: 100%; height: 100%; object-fit: cover; }
.photos .ph button { position: absolute; top: 4px; right: 4px; width: 24px; height: 24px; border-radius: 50%; border: 0; background: rgba(5, 9, 19, 0.75); font-size: 14px; line-height: 1; }
.photos label { white-space: pre-line; flex: none; width: 84px; height: 84px; border-radius: var(--r-md); border: 1px dashed var(--line); display: grid; place-items: center; text-align: center; font-size: 12.5px; color: var(--ink-dim); cursor: pointer; }
.photos label input { display: none; }

.btn { border: 0; border-radius: var(--r-md); padding: 13px 16px; font-weight: 700; background: var(--blue); color: #fff; width: 100%; text-align: center; text-decoration: none; display: block; }
.btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--cyan); }
.btn.danger { background: transparent; border: 1px solid rgba(248, 113, 113, 0.45); color: var(--bad); }
.btn.sm { padding: 8px 12px; font-size: 13.5px; width: auto; display: inline-block; }
.btn:disabled { opacity: 0.5; }
.linkbtn { background: none; border: 0; color: var(--cyan); font-weight: 600; padding: 0; font-size: 13.5px; }
.btns { display: flex; flex-direction: column; gap: 8px; }
.btn-row { display: flex; gap: 8px; }
.btn-row > * { flex: 1; }

/* ── 하단 탭 ── */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  background: color-mix(in srgb, var(--panel) 92%, transparent);
  backdrop-filter: blur(10px);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tabbar nav { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); align-items: end; }
.tabbar button { border: 0; background: none; padding: 9px 0 8px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11.5px; color: var(--ink-faint); }
.tabbar button svg { width: 22px; height: 22px; }
.tabbar button[aria-current='page'] { color: var(--cyan); }

.tabbar .add { color: var(--ink); padding-top: 0; }
.tabbar .add span {
  width: 52px; height: 52px; margin-top: -18px; border-radius: 50%; display: grid; place-items: center;
  background: var(--blue); color: #fff; border: 4px solid var(--bg); box-shadow: 0 4px 18px rgba(56, 189, 248, 0.35);
}
.tabbar .add span svg { width: 24px; height: 24px; }

/* ── 시트(모달) ── */
.overlay { position: fixed; inset: 0; z-index: 20; background: rgba(2, 5, 12, 0.72); display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  width: 100%; max-width: 480px; max-height: calc(100% - 28px - env(safe-area-inset-top, 0px)); overflow-y: auto; overscroll-behavior: contain; background: var(--bg);
  border: 1px solid var(--line); border-bottom: 0; border-radius: 22px 22px 0 0;
  padding: 4px 14px calc(14px + env(safe-area-inset-bottom, 0px));
  animation: up 0.22s ease-out;
}
.sheet-top { position: sticky; top: 0; background: var(--bg); padding: 6px 0 10px; display: flex; justify-content: space-between; align-items: center; z-index: 1; }
.sheet-top h2 { margin: 0; font-size: 18px; }
.grip { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 4px; }
.dialog { width: min(92%, 380px); align-self: center; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.dialog p { margin: 0; }
.overlay.center { align-items: center; }
@keyframes up { from { transform: translateY(24px); opacity: 0.6; } }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 30;
  bottom: calc(84px + env(safe-area-inset-bottom, 0px));
  background: var(--panel-2); border: 1px solid var(--cyan); border-radius: var(--r-md);
  padding: 10px 16px; font-size: 14px; max-width: min(92vw, 420px); box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
  white-space: pre-line; text-align: center;
}

h3.sec { margin: 6px 2px 0; font-size: 13px; color: var(--ink-dim); font-weight: 600; letter-spacing: 0.04em; }

@media (prefers-reduced-motion: reduce) {
  .sheet { animation: none; }
  .switch i, .switch i::after { transition: none; }
}

/* 폼 저장 버튼: 시트 아래에 고정 */
.sheet .save-bar { position: sticky; bottom: calc(-14px - env(safe-area-inset-bottom, 0px)); margin-inline: -14px; padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to top, var(--bg) 78%, transparent); display: flex; flex-direction: column; gap: 8px; z-index: 1; }
@media (max-width: 374px) {
  .app { padding-inline: 12px; }
  .chips.scroll { margin-inline: -12px; padding-inline: 12px; }
  .quick button { font-size: 12.5px; gap: 4px; }
  .day { min-height: 46px; }
}
@media (max-height: 700px) {
  .hero .big { font-size: 28px; }
  .day { min-height: 46px; }
}

/* ── 유종 고정 표시 ── */
.fixed-fuel { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

/* ── 주유소 (위치 기반) ── */
.st-find { display: flex; align-items: center; justify-content: center; gap: 6px; }
.st-find svg { width: 18px; height: 18px; }
.st-picked {
  display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 10px; align-items: center;
  background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--r-md); padding: 10px 12px;
}
.st-picked .ic { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 16%, transparent); color: var(--c); }
.st-picked .ic svg { width: 18px; height: 18px; }
.st-picked .t { min-width: 0; }
.st-picked .t b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.st-picked .t span { display: block; font-size: 12.5px; color: var(--ink-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.st-map { height: 210px; border-radius: var(--r-md); overflow: hidden; border: 1px solid var(--line); background: var(--panel-2); }
.st-map .leaflet-tile-pane { filter: brightness(0.72) contrast(1.08) saturate(0.7); }
.st-map .leaflet-control-attribution { background: rgba(10, 16, 32, 0.7); color: var(--ink-dim); font-size: 10px; }
.st-map .leaflet-control-attribution a { color: var(--ink-dim); }
.st-row.on { background: rgba(56, 189, 248, 0.1); border-radius: var(--r-md); }
.st-row .amt { font-size: 14px; color: var(--cyan); }
.st-status { display: flex; align-items: center; gap: 10px; padding: 18px 4px; color: var(--ink-dim); font-size: 14px; }
.st-status.err { flex-direction: column; align-items: flex-start; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-md); padding: 14px; }
.spinner { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--cyan); animation: spin 0.8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2s; } }

</style>
</head>
