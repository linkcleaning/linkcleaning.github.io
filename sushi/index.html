  <div class="grid grid-cols-2 gap-2 mt-2">
   ${mini('한국 비급여 예상',Math.round(kr/10000).toLocaleString(),'만 원','4주 평균 시세 기준')}
   ${mini('예상 절감',(save>0?'':'-')+Math.abs(Math.round(save/10000)).toLocaleString(),'만 원','항공·숙박비 제외')}
  </div>`;
}

/* ═══════════════  탭 4: 회화·준비  ═══════════════ */
function vPrep(){
 const d=S.get('chk',{}), total=CHECK.reduce((a,g)=>a+g.items.length,0), n=Object.values(d).filter(Boolean).length;
 return `<section class="fade space-y-2">
  <h2 class="num text-[19px] text-deep px-1">보여 주는 일본어 카드</h2>
  <div class="rounded-2xl bg-card divide-y divide-line">
   ${PHRASES.map(([tag,ko,jp],i)=>`<button class="w-full text-left p-4" onclick="big(${i})">
    <div class="flex items-center gap-2"><span class="text-[11px] font-bold px-2 py-0.5 rounded-md bg-paper shrink-0">${tag}</span><span class="text-[12.5px] text-muted truncate">${ko}</span></div>
    <div class="text-[16px] font-semibold mt-1 leading-snug">${jp}</div></button>`).join('')}
  </div>
  <p class="text-[11.5px] text-muted px-1">누르면 전체 화면으로 커지고 일본어로 읽어 줘요.</p>

  <div class="rounded-2xl bg-deep text-white p-4 mt-3">
   <div class="text-[12px] text-white/70 font-medium">준비물 체크</div>
   <div class="flex items-end gap-1 mt-1"><span class="num text-[44px] leading-none" id="chkN">${n}</span><span class="text-[15px] mb-1 font-semibold">/ ${total}</span></div>
   <div class="h-2 rounded-full bg-white/20 mt-3 overflow-hidden"><div id="chkBar" class="h-full bg-accent rounded-full transition-all" style="width:${n/total*100}%"></div></div>
  </div>
  ${CHECK.map(g=>`<div class="rounded-2xl bg-card p-4"><div class="text-[12px] text-muted font-semibold mb-1">${g.g}</div>
   ${g.items.map(([id,t])=>`<label class="flex items-start gap-3 py-1.5 cursor-pointer"><input type="checkbox" class="mt-0.5 w-5 h-5 accent-[#E07A2E] shrink-0" data-id="${id}" ${d[id]?'checked':''} onchange="chk(this)"><span class="text-[14px] leading-snug">${t}</span></label>`).join('')}</div>`).join('')}
  <button class="w-full rounded-full bg-card text-[13px] font-semibold py-2.5" onclick="if(confirm('체크 표시를 모두 지울까요?')){S.set('chk',{});render()}">체크 전부 지우기</button>
 </section>`;
}
function chk(el){const d=S.get('chk',{});d[el.dataset.id]=el.checked;S.set('chk',d);
 const total=CHECK.reduce((a,g)=>a+g.items.length,0),n=Object.values(d).filter(Boolean).length;$('#chkN').textContent=n;$('#chkBar').style.width=(n/total*100)+'%'}
function speak(t){try{if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=.9;
 const v=speechSynthesis.getVoices().find(v=>/^ja/i.test(v.lang));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
function big(i){
 const [tag,ko,jp]=PHRASES[i], o=document.createElement('div');
 o.className='fixed inset-0 z-50 bg-paper flex flex-col p-6 pt-[calc(env(safe-area-inset-top)+24px)] fade';
 o.innerHTML=`<div class="text-[13px] font-bold text-accent">${tag}</div><div class="text-[14px] text-muted mt-1">${ko}</div>
  <div class="flex-1 grid place-items-center"><div class="text-[32px] font-bold leading-snug text-center">${jp}</div></div>
  <div class="grid grid-cols-2 gap-2 mb-[env(safe-area-inset-bottom)]">
   <button data-a="s" class="rounded-full bg-accent font-bold py-3.5 text-[15px]">다시 듣기</button>
   <button data-a="x" class="rounded-full bg-deep text-white font-bold py-3.5 text-[15px]">닫기</button></div>`;
 o.querySelector('[data-a=s]').onclick=()=>speak(jp);
 o.querySelector('[data-a=x]').onclick=()=>{try{speechSynthesis.cancel()}catch(e){}o.remove()};
 document.body.appendChild(o); speak(jp);
}

/* ═══════════════  공통  ═══════════════ */
function render(){
 const v={guide:vGuide,clinic:vClinic,calc:vCalc,prep:vPrep}[st.tab]||vGuide;
 $('#app').innerHTML=v();
 document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===st.tab));
 if(st.tab==="clinic")renderList();
 if(st.tab==='calc')calcOut();
}
function go(t){st.tab=t;S.set('tab',t);render();window.scrollTo({top:0})}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>go(b.dataset.tab));
render();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
<script src="/v.js" data-v="v2" defer></script>
</body>
</html>
