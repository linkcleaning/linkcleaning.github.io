      <div class="text-[12px] text-white/70 font-medium">준비 진행</div>
      <div class="flex items-end gap-1 mt-1"><span class="num text-[48px] leading-none" id="chkN">${n}</span><span class="text-[15px] mb-1 font-semibold">/ ${total}</span></div>
      <div class="h-2 rounded-full bg-white/20 mt-3 overflow-hidden"><div id="chkBar" class="h-full bg-accent rounded-full transition-all" style="width:${n/total*100}%"></div></div>
    </div>

    ${CHECK.map(g=>`
      <div class="rounded-2xl bg-card p-4">
        <div class="text-[12px] text-muted font-semibold mb-2">${g.g}</div>
        <div class="space-y-1">
          ${g.items.map(([id,t])=>`<label class="flex items-start gap-3 py-1.5 cursor-pointer">
            <input type="checkbox" class="chk mt-0.5 w-5 h-5 accent-[#E07A2E] shrink-0" data-id="${id}" ${done[id]?'checked':''} onchange="chk(this)">
            <span class="text-[14px] leading-snug">${t}</span></label>`).join('')}
        </div>
      </div>`).join('')}

    <h2 class="num text-[19px] text-deep pt-3 px-1">엔화 → 원화 계산</h2>
    <div class="rounded-2xl bg-card p-4">
      <div class="grid grid-cols-2 gap-2">
        <label class="block"><span class="text-[12px] text-muted font-semibold">금액 (엔)</span>
          <input id="yen" type="number" inputmode="numeric" value="${yen}" class="mt-1 w-full rounded-xl bg-paper px-3 py-2.5 text-[17px] font-semibold outline-none focus:ring-2 ring-accent" oninput="calc()"></label>
        <label class="block"><span class="text-[12px] text-muted font-semibold">1엔 = 원 (직접 수정)</span>
          <input id="rate" type="number" inputmode="decimal" step="0.01" value="${rate}" class="mt-1 w-full rounded-xl bg-paper px-3 py-2.5 text-[17px] font-semibold outline-none focus:ring-2 ring-accent" oninput="calc()"></label>
      </div>
      <div class="mt-3 flex items-end justify-between">
        <span class="text-[12px] text-muted font-semibold">원화 약</span>
        <span><span class="num text-[32px] leading-none" id="krw"></span><span class="text-[13px] text-muted font-semibold ml-1">원</span></span>
      </div>
      <div class="flex flex-wrap gap-1.5 mt-3">
        ${[10700,15800,16500,46200,46500,52000].map(v=>`<button class="text-[12px] font-semibold px-2.5 py-1 rounded-md bg-paper" onclick="setYen(${v})">${v.toLocaleString()}엔</button>`).join('')}
      </div>
      <div class="text-[11.5px] text-muted mt-2">환율은 카드사·날짜마다 달라요. 결제 직전 환율로 바꿔 넣으세요.</div>
    </div>

    <h2 class="num text-[19px] text-deep pt-3 px-1">병원에서 보여 줄 일본어 카드</h2>
    <div class="rounded-2xl bg-card divide-y divide-line">
      ${PHRASES.map(([ko,jp],i)=>`<button class="w-full text-left p-4" onclick="big(${i})">
        <div class="text-[12.5px] text-muted">${ko}</div>
        <div class="text-[16px] font-semibold mt-0.5 leading-snug">${jp}</div></button>`).join('')}
    </div>
    <p class="text-[11.5px] text-muted px-1">문장을 누르면 크게 보여요. 직원에게 화면을 그대로 보여 주세요.</p>
    <button class="w-full rounded-full bg-paper border border-line text-[13px] font-semibold py-2.5 mt-1" onclick="resetChk()">체크 전부 지우기</button>
  </section>`;
}
function chk(el){
  const d = S.get('chk',{}); d[el.dataset.id] = el.checked; S.set('chk', d);
  const total = CHECK.reduce((a,g)=>a+g.items.length,0), n = Object.values(d).filter(Boolean).length;
  $('#chkN').textContent = n; $('#chkBar').style.width = (n/total*100)+'%';
}
function resetChk(){ if(confirmReset()) { S.set('chk',{}); render() } }
function confirmReset(){ return window.confirm('체크 표시를 모두 지울까요?') }
function calc(){
  const y = parseFloat($('#yen').value)||0, r = parseFloat($('#rate').value)||0;
  S.set('yen', y); S.set('rate', r);
  $('#krw').textContent = Math.round(y*r).toLocaleString();
}
function setYen(v){ $('#yen').value = v; calc() }
function big(i){
  const [ko,jp] = PHRASES[i];
  const o = document.createElement('div');
  o.className = 'fixed inset-0 z-50 bg-paper flex flex-col p-6 pt-[calc(env(safe-area-inset-top)+24px)] fade';
  o.innerHTML = `<div class="text-[14px] text-muted">${ko}</div>
    <div class="flex-1 grid place-items-center"><div class="text-[34px] font-bold leading-snug text-ink text-center">${jp}</div></div>
    <button class="rounded-full bg-deep text-white font-bold py-3.5 text-[15px] mb-[env(safe-area-inset-bottom)]">닫기</button>`;
  o.querySelector('button').onclick = () => o.remove();
  document.body.appendChild(o);
}

/* ─────────────────────────  공통  ───────────────────────── */
function render(){
  const v = {guide:viewGuide, clinic:viewClinic, customs:viewCustoms, prep:viewPrep}[S.tab] || viewGuide;
  $('#app').innerHTML = v();
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', b.dataset.tab===S.tab));
  if(S.tab==='prep') calc();
}
function go(t){ S.tab=t; S.set('tab',t); render(); window.scrollTo({top:0}) }
document.querySelectorAll('.tab').forEach(b => b.onclick = () => go(b.dataset.tab));
render();

if('serviceWorker' in navigator && location.protocol==='https:'){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
<script src="/v.js" data-v="v1" defer></script>
</body>
</html>
