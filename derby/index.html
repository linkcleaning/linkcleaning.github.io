<script>
/* =========================================================
   STAR DERBY — 엔진 (시뮬레이션 / 렌더링 / 사운드)
   ========================================================= */
/*SIM_START*/
const FRAME = {1:{bg:'#ffffff',fg:'#111111'},2:{bg:'#141414',fg:'#ffffff'},3:{bg:'#e03131',fg:'#ffffff'},
               4:{bg:'#1971c2',fg:'#ffffff'},5:{bg:'#fcc419',fg:'#111111'},6:{bg:'#2f9e44',fg:'#ffffff'},7:{bg:'#f76707',fg:'#ffffff'},8:{bg:'#f06595',fg:'#ffffff'}};
const FIELD=8;
const LANE_HALF=0.38/(FIELD-1);
const COND_MUL = {5:1.0018,4:1.0009,3:1.0,2:0.9991,1:0.9982};
const COND_INFO = {5:{a:'↑',t:'최상',c:'#ff4d4f'},4:{a:'↗',t:'양호',c:'#ff9f43'},3:{a:'→',t:'보통',c:'#c7cbd6'},
                   2:{a:'↘',t:'저조',c:'#4dabf7'},1:{a:'↓',t:'나쁨',c:'#748ffc'}};
const GOING_MUL = {'양호':1.0,'다습':0.985,'불량':0.97};
const K_PROF = 0.6;
const RACE_NAMES = [['제주 그랑프리','G1'],['한라산 스테이크스','G2'],['광안리 오션컵','G3'],['탐라 마일','G2'],
  ['부산 해운대 더비','G1'],['성산 일출배','G3'],['링크클린 컵','G2'],['하나토탈컵','G1'],['이케이클린컵','G2'],['크리머스 스위트 스테이크스','G3']];

/* ---- 매 경주 새로 편성되는 출전마 (랜덤 이름·털색·무늬·복색·각질) ---- */
const COATS=[
  {n:'밤색',coat:'#8a4b22',dark:'#4a2610',mane:'#1a0f0a',w:5},
  {n:'흑갈색',coat:'#5e3a1f',dark:'#2e1a0c',mane:'#120c08',w:4},
  {n:'흑마',coat:'#2a2321',dark:'#0d0a09',mane:'#080606',w:2},
  {n:'적토',coat:'#b4471e',dark:'#6c280e',mane:'#7a2c0c',w:3},
  {n:'회색',coat:'#a3a3a1',dark:'#5e5e5c',mane:'#454544',dapple:true,w:2},
  {n:'백마',coat:'#eeeae2',dark:'#b9b2a6',mane:'#d6cfc2',w:1},
  {n:'금색',coat:'#d6a85a',dark:'#9a7232',mane:'#f4e8c8',w:1.2},
  {n:'청모',coat:'#7d8186',dark:'#45484c',mane:'#2a2b2d',w:1}];
const SILK_COLORS=['#e03131','#1c7ed6','#2f9e44','#fcc419','#ff5fa2','#5b2ca0','#ffffff','#212529','#ff922b','#12b886','#74c0fc','#a61e4d','#e8590c','#364fc7','#94d82d'];
const PATTERNS=['hoops','sash','diamonds','stars','chevron','halves','plain','spots','quarters','cross'];
const NAME_A=['번개','천둥','질풍','황금','백설','흑','청룡','적','은빛','바람','한라','탐라','태양','달빛','별빛','폭풍','불꽃','무지개','초원','해무','파도','설악','광안','동백','유채','오름','올레','성산','새벽','노을','하늘','천마','구름','은하','벽력','해운대','용두','다이아'];
const NAME_B=['호','마','왕','킹','스타','드림','특급','가도','질주','천하','공주','기사','대장','파워','로켓','선풍','전설','신화','엔진','일섬','여왕','장군','돌풍'];
const NAME_FULL=['닥터 스피드','미스터 제주','럭키 스트라이크','골든 크림','블루 오션','레드 썬더','실버 애로우','다크 호스','캡틴 링크','스카이 러너','미드나잇 런','슈가 러시','오션 블리츠','썬셋 레이서','퀵 실버','윈드 브레이커','크림 캐슬','카멜 킹','라스트 댄스','문라이트 소나타'];
const J_SUR=['김','이','박','최','정','강','조','윤','장','임','한','오','서','신','권','황','안','송','고','문'];
const J_GIV=['하늘','태양','바람','영웅','민준','서준','도윤','지호','현우','준혁','시우','건우','우진','선우','유찬','한결','다온','이안','라온','지안'];
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function horseName(used){
  for(let t=0;t<50;t++){
    const n = Math.random()<0.25 ? pick(NAME_FULL) : pick(NAME_A)+pick(NAME_B);
    if(!used.has(n) && n.length<=7){ used.add(n); return n; }
  }
  return '무명'+used.size;
}
function generateField(){
  const used=new Set();
  const jockeys=shuffle(['안영삼','한승우','김기훈','한정민','한정호','이은경','맹길이','박시은']);
  const FIXED={'안영삼':'하나토탈이','한승우':'링크돌이','김기훈':'기훈짱','이은경':'링크순이','한정민':'핑크공주','맹길이':'까스돌이','박시은':'크림어스','한정호':'리턴팩토리'};
  Object.values(FIXED).forEach(n=>used.add(n));
  const styles=shuffle(['도주','추입',...shuffle(['도주','선행','선행','선입','선입','추입','추입','도주']).slice(0,FIELD-2)]);
  return styles.map((style,i)=>{
    const c=pickW(COATS,COATS.map(x=>x.w));
    let base=pick(SILK_COLORS), acc=pick(SILK_COLORS); while(acc===base) acc=pick(SILK_COLORS);
    return { no:i+1, name:FIXED[jockeys[i]]||horseName(used), coatName:c.n, coat:c.coat, coatDark:c.dark, mane:c.mane, dapple:!!c.dapple,
      blaze: Math.random()<0.45 ? pick(['star','stripe','blaze']) : null,
      socks: [0,1,2,3].map(()=>Math.random()<0.22),
      style, dirtFit:0.99+Math.random()*0.02, sex:pickW(['수','암','거'],[5,3,2]), age:3+Math.floor(Math.random()*4),
      silk:{base,accent:acc,pattern:pick(PATTERNS)}, cap:Math.random()<0.5?acc:base, jockey:jockeys[i] };
  });
}

function laneZ(i){ return 0.12 + i*(0.76/(FIELD-1)); }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function pickW(a,w){ let s=0; for(const x of w) s+=x; let r=Math.random()*s; for(let i=0;i<a.length;i++){ r-=w[i]; if(r<=0) return a[i]; } return a[a.length-1]; }
function quinKey(a,b){ return a<b ? a+'-'+b : b+'-'+a; }

function profileMul(style,p,r){
  let m;
  const st = r.h.stam;
  if(style==='도주'){ m = p<0.6 ? 1.031 : 1.031 - ((p-0.6)/0.4)*0.118*(2-st); }
  else if(style==='선행'){ m = p<0.65 ? 1.012 : 1.012 - ((p-0.65)/0.35)*0.027*(2-st); }
  else if(style==='선입'){ m = p<0.3 ? 0.995 : (p<0.72 ? 1.0 : 1.0 + Math.min(1,(p-0.72)/0.06)*0.03); }
  else { m = p<r.spurtAt ? 0.977 : 0.977 + Math.min(1,(p-r.spurtAt)/0.05)*0.14; }
  return 1 + K_PROF*(m-1);
}
function speedOf(r,D,going){
  const h=r.h, p=Math.max(0,r.pos)/D;
  const base = 16.6*h.abil*COND_MUL[h.cond]*r.luck*going;
  const wave = 1 + 0.005*Math.sin(r.t*r.w1+r.p1) + 0.003*Math.sin(r.t*r.w2+r.p2);
  return base*profileMul(h.style,p,r)*wave;
}
function makeRunner(h,i){
  return { h, i, pos:-0.6, prev:-0.6, v:0, t:0,
    luck: 1+(Math.random()-0.5)*0.017,
    w1:0.25+Math.random()*0.35, w2:0.8+Math.random()*0.7, p1:Math.random()*6.283, p2:Math.random()*6.283,
    spurtAt: 0.73+Math.random()*0.07, react: 0.05+Math.random()*0.3, kick: 1+(Math.random()-0.5)*0.02,
    fin:false, finT:0, finV:0, spurting:false, spurtSaid:false,
    lane: laneZ(i), phase: Math.random()*6.283 };
}
function stepRunner(r,dt,D,going,leadPos){
  r.t += dt;
  if(r.t < r.react) return;
  let tgt = r.fin ? Math.max(4, 9 - (r.t-r.finT)*0.9) : speedOf(r,D,going);
  if(!r.fin){
    const p=r.pos/D;
    // 중반까지는 뒤쪽 말이 바람막이 효과로 따라붙어 마군이 촘촘하게 유지됨 → 막판 대혼전
    if(leadPos!=null && p>0.05 && p<0.78){ const gap=leadPos-r.pos; if(gap>1.5) tgt*=1+Math.min(0.012,(gap-1.5)*0.0012); }
    if(p>0.72) tgt*=r.kick;   // 막판 컨디션 변수 → 역전 드라마
  }
  const rate = r.v<tgt ? (r.h.style==='도주'?0.95:(r.h.style==='추입'?0.7:0.82)) : 0.5;
  r.v += (tgt-r.v)*Math.min(1,rate*dt);
  r.prev = r.pos; r.pos += r.v*dt;
  if(!r.fin && r.pos>=D){
    r.fin = true; r.finV = r.v;
    r.finT = r.t - dt*(r.pos-D)/Math.max(1e-6, r.pos-r.prev);
  }
  if(r.h.style==='추입' && !r.spurting && !r.fin && r.pos/D>=r.spurtAt) r.spurting = true;
}
function runSim(horses,D,going){
  const rs = horses.map((h,i)=>makeRunner(h,i));
  let t=0;
  while(t<600){
    let all=true;
    let lp=-1e9; for(const r of rs) if(r.pos>lp) lp=r.pos;
    for(const r of rs){ stepRunner(r,0.1,D,going,lp); if(!r.fin) all=false; }
    t+=0.1; if(all) break;
  }
  return rs.sort((a,b)=>a.finT-b.finT);
}
function computeOdds(horses,D,going,N){
  N = N||500;
  const win={}, top2={}, pair={};
  horses.forEach(h=>{ win[h.no]=0; top2[h.no]=0; });
  for(let n=0;n<N;n++){
    const o = runSim(horses,D,going);
    const a=o[0].h.no, b=o[1].h.no;
    win[a]++; top2[a]++; top2[b]++;
    const k=quinKey(a,b); pair[k]=(pair[k]||0)+1;
  }
  const R=0.8, r1=x=>Math.round(x*10)/10;
  const odds={win:{},place:{},quin:{}};
  horses.forEach(h=>{
    const pw=(win[h.no]+0.6)/(N+3.6);
    const noise = 1+(Math.random()-0.5)*0.08;
    odds.win[h.no] = r1(Math.min(99.9, Math.max(1.2, R/pw*noise)));
    const p2=(top2[h.no]+1)/(N+3);
    odds.place[h.no] = r1(Math.min(30, Math.max(1.1, R/p2)));
  });
  for(let a=1;a<=FIELD;a++) for(let b=a+1;b<=FIELD;b++){
    const k=quinKey(a,b);
    const pp=((pair[k]||0)+0.3)/(N+4.5);
    odds.quin[k] = r1(Math.min(999.9, Math.max(1.5, R/pp)));
  }
  return odds;
}
function makeRaceSetup(raceNo){
  const nm = RACE_NAMES[(raceNo-1)%RACE_NAMES.length];
  const D = pick([1200,1400,1600,1800]);
  const surface = Math.random()<0.6 ? 'turf' : 'dirt';
  const weather = pickW(['맑음','흐림','비','노을','야간'],[4,2,1.8,1.5,1.7]);
  const going = weather==='비' ? pickW(['다습','불량'],[1,1.2]) : weather==='흐림' ? pickW(['양호','다습'],[3,1]) : pickW(['양호','다습'],[7,1]);
  const horses = generateField().map(h=>{
    const cond = pickW([1,2,3,4,5],[1,2,4,3,1.5]);
    let abil = 0.997+Math.random()*0.006;
    if(surface==='dirt') abil *= 1+(h.dirtFit-1)*0.14;
    const stam = 0.95+Math.random()*0.1;
    const q = (abil-0.996)/0.008;
    const recent = [];
    for(let k=0;k<5;k++){ const rr=Math.min(6,Math.max(1,Math.round(1+Math.random()*5*(1.15-q*0.8)))); recent.push(rr); }
    return { ...h, cond, abil, stam, recent,
      weightKg: 440+Math.floor(Math.random()*70), delta: (Math.floor(Math.random()*9)-4)*2 };
  });
  const odds = computeOdds(horses,D,GOING_MUL[going],380);
  const byOdds = horses.map(h=>h.no).sort((a,b)=>odds.win[a]-odds.win[b]);
  const pop={}; byOdds.forEach((no,i)=>pop[no]=i+1);
  const expert = horses.map(h=>({no:h.no, s:Math.log(odds.win[h.no])+(Math.random()-0.5)*0.9})).sort((a,b)=>a.s-b.s);
  const marks={}; ['◎','○','▲','△','△','','',''].slice(0,expert.length).forEach((m,i)=>marks[expert[i].no]=m);
  return { raceNo, name:nm[0], grade:nm[1], D, surface, going, goingMul:GOING_MUL[going], weather, horses, odds, pop, marks };
}
/*SIM_END*/

/* ---------- 한글 조사 ---------- */
function hasJong(w){ const s=String(w); const c=s.charCodeAt(s.length-1); if(c<0xAC00||c>0xD7A3) return false; return (c-0xAC00)%28!==0; }
const iga  = w => w+(hasJong(w)?'이':'가');
const eul  = w => w+(hasJong(w)?'을':'를');
const wagwa= w => w+(hasJong(w)?'과':'와');
const eun  = w => w+(hasJong(w)?'은':'는');
const lblOf = h => `${h.no}번 ${h.name}`;

/* =========================================================
   사운드 (Web Audio API)
   ========================================================= */
const Sound = {
  ctx:null, master:null, muted:false, noiseBuf:null, crowd:null,
  init(){
    try{
      if(!this.ctx){
        const AC = window.AudioContext||window.webkitAudioContext; if(!AC) return;
        this.ctx = new AC();
        const comp = this.ctx.createDynamicsCompressor();
        comp.threshold.value=-14; comp.ratio.value=4;
        this.master = this.ctx.createGain(); this.master.gain.value = this.muted?0:0.9;
        this.master.connect(comp); comp.connect(this.ctx.destination);
        const len = this.ctx.sampleRate*2;
        const b = this.ctx.createBuffer(1,len,this.ctx.sampleRate); const d=b.getChannelData(0);
        for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
        this.noiseBuf = b;
      }
      if(this.ctx.state==='suspended') this.ctx.resume();
    }catch(e){}
  },
  setMuted(m){ this.muted=m; if(this.master) this.master.gain.setTargetAtTime(m?0:0.9,this.ctx.currentTime,0.05); },
  ok(){ return !!(this.ctx && this.master); },
  env(g,t,a,peak,d){
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002,peak),t+a);
    g.gain.exponentialRampToValueAtTime(0.0001,t+a+d);
  },
  osc(type,f,t,a,d,vol,f2){
    const c=this.ctx, o=c.createOscillator(), g=c.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t);
    if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+a+d);
    this.env(g,t,a,vol,d); o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t+a+d+0.05);
  },
  noise(t,dur,vol,ftype,freq,q,a){
    const c=this.ctx, s=c.createBufferSource(), f=c.createBiquadFilter(), g=c.createGain();
    s.buffer=this.noiseBuf; f.type=ftype; f.frequency.value=freq; f.Q.value=q||1;
    this.env(g,t,a||0.003,vol,dur);
    s.connect(f); f.connect(g); g.connect(this.master);
    s.start(t, Math.random()*1.5, dur+0.1);
  },
  brass(freq,t,dur,vol){
    const c=this.ctx;
    const lp=c.createBiquadFilter(); lp.type='lowpass'; lp.Q.value=2;
    lp.frequency.setValueAtTime(500,t); lp.frequency.linearRampToValueAtTime(3200,t+0.05); lp.frequency.linearRampToValueAtTime(1800,t+Math.max(0.08,dur));
    const g=c.createGain();
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.03);
    g.gain.setValueAtTime(vol*0.85,t+Math.max(0.04,dur-0.04)); g.gain.exponentialRampToValueAtTime(0.0001,t+dur+0.12);
    const lfo=c.createOscillator(), lg=c.createGain(); lfo.frequency.value=5.5; lg.gain.setValueAtTime(0,t); lg.gain.linearRampToValueAtTime(freq*0.006,t+Math.min(dur,0.3));
    lfo.connect(lg);
    [-6,6].forEach(det=>{
      const o=c.createOscillator(); o.type='sawtooth'; o.frequency.value=freq; o.detune.value=det;
      lg.connect(o.frequency); o.connect(lp); o.start(t); o.stop(t+dur+0.2);
    });
    const sq=c.createOscillator(); sq.type='square'; sq.frequency.value=freq; const sg=c.createGain(); sg.gain.value=0.3;
    sq.connect(sg); sg.connect(lp); sq.start(t); sq.stop(t+dur+0.2);
    lfo.start(t); lfo.stop(t+dur+0.2);
    lp.connect(g); g.connect(this.master);
  },
  fanfare(){
    if(!this.ok()) return;
    const t0=this.ctx.currentTime+0.08;

const MALE_RE=/injoon|in-joon|minsu|min-su|jian|hyunsu|bongjin|gookmin|seoyeon_m|male|남성|남자|kod|koc|ko-kr-standard-c|ko-kr-standard-d|wavenet-c|wavenet-d|neural2-c/i;

  q:[], busy:false, cur:null, wd:null,

    if(!this.ok||!this.on||Sound.muted) return;

  {fore:false,far:true, off:0.00, sock:2},
  {fore:true, far:true, off:0.30, sock:0},

    const s=(u-DUTY)/(1-DUTY);
    const e=s<0.5?2*s*s:1-2*(1-s)*(1-s);
    x=back+(reach-back)*e;

  constructor(canvas,setup,cb){

  resize(){

  }

    o.forEach((r,rank)=>{

          vx:r.v*(0.35+Math.random()*0.3),vy:1.2+Math.random()*2.4,vz:(Math.random()-0.5)*0.05,life:0.5+Math.random()*0.6,max:1,
          s:0.05+Math.random()*(this.dirt?0.14:0.09), col:turfClod?(Math.random()<0.5?'#3f7f2a':'#5d8c34'):(this.dirt?'#8a603a':'#7a5a3a'), fire:false}); }

    { const half=(W*0.40)/(this.ppm*sZ(a.lane)*Math.max(1,this.zoomT)); if(!a.fin) focus=Math.max(focus,a.pos-half+1.0); }

    mk('600',remain<=600&&remain>220,`4코너 돌아 직선주로! 남은 거리 600! 선두는 ${lblOf(a.h)}!`,true,'남은 거리 600m');

    const xmin=cam-(W/2+100)/(ppm*sZ(z)), xmax=cam+(W/2+100)/(ppm*sZ(z));

      const ad=ADS[(((i+2)%ADS.length)+ADS.length)%ADS.length]; const bx0=this.X(i*16,z), bx1=this.X(i*16+15,z);
      if(bx1<-50||bx0>W+50) continue;

      ctx.fillStyle='rgba(255,255,255,0.2)'; ctx.fillRect(bx0,yt+2,bx1-bx0,rh*0.25);
      ctx.fillStyle=ad[3]; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.font=`500 ${Math.round(rh*0.58)}px "Noto Sans KR",sans-serif`; ctx.fillText(ad[0],bx0+(bx1-bx0)*0.3,yt+rh/2+1);
      ctx.font=`400 ${Math.round(rh*0.34)}px "Noto Sans KR",sans-serif`; ctx.fillText(ad[1],bx0+(bx1-bx0)*0.72,yt+rh/2+1);
    }
    ctx.fillStyle='#f1f3f5';
    for(let i=Math.floor(xmin/16)-1;i<=Math.ceil(xmax/16)+1;i++){ const px=this.X(i*16-0.5,z); ctx.fillRect(px-4,yt,8,rh); }
    ctx.fillStyle='#ffffff'; ctx.fillRect(-300,yt-5,W+600,9);
    ctx.fillStyle='rgba(0,0,0,0.18)'; ctx.fillRect(-300,yt+4,W+600,3);

    const zz=1.35, f2=-(((cam*ppm*sZ(zz))%60)+60)%60;
    ctx.fillStyle='rgba(255,255,255,0.08)';
    for(let x=f2-60;x<W+60;x+=60){ ctx.fillRect(x,H-30,30,3); }
    if(this.state==='run' && this.order[0].v>10 && this.slow>0.7){ ctx.strokeStyle='rgba(255,255,255,0.09)'; ctx.lineWidth=2;
      for(let k=0;k<6;k++){ const yy=y0+8+((k*37+Math.floor(this.real*60)*13)%60); const xx=((k*211-this.real*1800)%(W+300)+W+300)%(W+300)-150; ctx.beginPath(); ctx.moveTo(xx,yy); ctx.lineTo(xx+140,yy); ctx.stroke(); } }
  }
  drawHUD(ctx){
    const S=this.setup, o=this.order;
    // 좌상단 레이스 정보
    ctx.fillStyle='rgba(6,12,30,0.78)'; rr(ctx,16,14,300,74,10); ctx.fill();
    ctx.fillStyle='#ffd43b'; ctx.font='700 19px "Noto Sans KR",sans-serif'; ctx.textAlign='left'; ctx.textBaseline='top';
    ctx.fillText(`${S.raceNo}R ${S.name}`,28,22);
    ctx.fillStyle='#ffffff'; ctx.font='bold 15px "Noto Sans KR",sans-serif';
    ctx.fillText(`${S.grade} · ${S.D}m · ${this.dirt?'더트':'잔디'} · ${S.going}`,28,46);
    const rem=this.state==='intro'?S.D:Math.max(0,Math.ceil(S.D-o[0].pos));
    ctx.fillStyle='#69db7c'; ctx.font='700 15px "Noto Sans KR",sans-serif'; ctx.fillText(rem>0?`남은 거리 ${rem.toLocaleString()}m`:'골인!',28,66);
    // 우상단 LIVE + 시계
    ctx.fillStyle='rgba(6,12,30,0.78)'; rr(ctx,W-196,14,180,44,10); ctx.fill();
    ctx.fillStyle=Math.floor(this.real*2)%2?'#ff4d4f':'#a61e1e'; ctx.beginPath(); ctx.arc(W-176,36,7,0,6.283); ctx.fill();
    ctx.fillStyle='#fff'; ctx.font='700 16px "Noto Sans KR",sans-serif'; ctx.textBaseline='middle'; ctx.fillText('LIVE',W-162,37);
    const tt=Math.max(0,this.simT); ctx.font='bold 18px monospace'; ctx.textAlign='right';
    ctx.fillText(`${Math.floor(tt/60)}:${(tt%60).toFixed(1).padStart(4,'0')}`,W-28,37);
    if(this.slow<0.6){ ctx.fillStyle='#ffd43b'; ctx.font='700 16px "Noto Sans KR",sans-serif'; ctx.textAlign='right'; ctx.fillText('◀◀ SLOW MOTION',W-24,74); }
    // 상단 실시간 순위 바
    const NR=this.runners.length, bw=Math.min(84,(W-44)/NR), bx0=W/2-bw*NR/2, RY=96;
    ctx.fillStyle='rgba(6,12,30,0.82)'; rr(ctx,bx0-12,RY,bw*NR+24,76,12); ctx.fill();
    ctx.fillStyle='#8da2c9'; ctx.font='bold 12px "Noto Sans KR",sans-serif'; ctx.textAlign='center'; ctx.textBaseline='top';
    for(let i=0;i<NR;i++) ctx.fillText(['1st','2nd','3rd','4th','5th','6th','7th','8th'][i],bx0+i*bw+bw/2,RY+4);
    o.forEach((r,i)=>{ const no=r.h.no; this.rankX[no]+= (i-this.rankX[no])*0.18; });
    this.runners.slice().sort((a,b)=>this.rankX[b.h.no]-this.rankX[a.h.no]).forEach(r=>{
      const no=r.h.no, fr=FRAME[no], x=bx0+this.rankX[no]*bw+6, y=RY+21, isTop=o[0]===r;
      ctx.fillStyle='rgba(0,0,0,0.5)'; rr(ctx,x+2,y+2,bw-12,46,7); ctx.fill();
      ctx.fillStyle=fr.bg; rr(ctx,x,y,bw-12,46,7); ctx.fill();
      if(isTop){ ctx.strokeStyle='#ffd43b'; ctx.lineWidth=3; ctx.stroke(); }
      ctx.fillStyle=fr.fg; ctx.font='700 30px "Noto Sans KR",sans-serif'; ctx.textBaseline='middle'; ctx.fillText(String(no),x+(bw-12)/2,y+24);
      if(r.spurting&&!r.fin){ ctx.font='14px sans-serif'; ctx.fillText('🔥',x+bw-16,y+6); }
    });
    // 미니맵 진행 바
    const mx=16, my=RY+84, mw=W-32;
    ctx.fillStyle='rgba(6,12,30,0.78)'; rr(ctx,mx,my,mw,30,8); ctx.fill();
    ctx.strokeStyle='#4dabf7'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(mx+20,my+15); ctx.lineTo(mx+mw-30,my+15); ctx.stroke();
    ctx.fillStyle='#fff'; ctx.fillRect(mx+mw-30,my+5,3,20);
    ctx.fillStyle='#e03131'; ctx.font='bold 10px sans-serif'; ctx.textAlign='center'; ctx.fillText('G',mx+mw-16,my+15);
    this.runners.slice().reverse().forEach(r=>{ const p=Math.max(0,Math.min(1,r.pos/S.D)); const px=mx+20+p*(mw-50);
      ctx.fillStyle=FRAME[r.h.no].bg; ctx.strokeStyle='#000'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(px,my+15,7,0,6.283); ctx.fill(); ctx.stroke();
      ctx.fillStyle=FRAME[r.h.no].fg; ctx.font='bold 9px sans-serif'; ctx.fillText(String(r.h.no),px,my+15.5); });
    // 배너
    if(this.banner && this.real-this.banner.t<2.4){
      const e=this.real-this.banner.t, a=e<0.3?e/0.3:(e>2.0?(2.4-e)/0.4:1), sx=(1-Math.min(1,e/0.3))*-300;
      ctx.save(); ctx.globalAlpha=a; ctx.translate(sx,0);
      const g=ctx.createLinearGradient(0,0,W,0); g.addColorStop(0,'rgba(224,49,49,0)'); g.addColorStop(0.25,'rgba(224,49,49,0.92)'); g.addColorStop(0.75,'rgba(224,49,49,0.92)'); g.addColorStop(1,'rgba(224,49,49,0)');
      ctx.fillStyle=g; ctx.fillRect(0,Y_FAR-170,W,80);
      ctx.fillStyle='#fff'; ctx.font='700 52px "Noto Sans KR",sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(this.banner.text,W/2,Y_FAR-128); ctx.restore();
    }
    if(this.state==='intro'){
      ctx.fillStyle='rgba(6,12,30,0.7)'; rr(ctx,W/2-200,H/2-130,400,70,12); ctx.fill();
      ctx.fillStyle='#ffd43b'; ctx.font='700 34px "Noto Sans KR",sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(this.real<3?'게이트 입장 완료':'출발 대기...',W/2,H/2-95);
      if(this.cd){ const e=this.real-this.cd.t, sc=1.6-Math.min(0.6,e*2); ctx.save(); ctx.globalAlpha=Math.max(0,1-e*1.2); ctx.translate(W/2,H/2+20); ctx.scale(sc,sc);
        ctx.fillStyle='#fff'; ctx.strokeStyle='rgba(0,0,0,0.6)'; ctx.lineWidth=8; ctx.font='700 120px "Noto Sans KR",sans-serif'; ctx.strokeText(String(this.cd.n),0,0); ctx.fillText(String(this.cd.n),0,0); ctx.restore(); }
    }
  }
  /* 결승 사진(Photo Finish) — 실제 슬릿 카메라처럼 '결승선을 통과한 순간'의 각 말을 시간축으로 늘어놓은 사진 */
  makePhotoFinish(){
    const Wp=1000,Hp=470, c=document.createElement('canvas'); c.width=Wp; c.height=Hp; const g=c.getContext('2d');
    const rnd=seeded(this.setup.raceNo*7+11);
    // 배경: 슬릿 카메라 특유의 가로 줄무늬(정지한 배경이 시간에 따라 늘어남)
    const bgG=g.createLinearGradient(0,0,0,Hp); bgG.addColorStop(0,'#b9bdc2'); bgG.addColorStop(0.22,'#8e949b'); bgG.addColorStop(0.26,'#f1f3f5'); bgG.addColorStop(0.28,'#9aa0a6'); bgG.addColorStop(0.36,this.dirt?'#8d6c4c':'#5d7f52'); bgG.addColorStop(1,this.dirt?'#a07c58':'#6e955f');
    g.fillStyle=bgG; g.fillRect(0,0,Wp,Hp);
    for(let y=0;y<Hp;y+=2){ g.fillStyle=`rgba(${rnd()<0.5?0:255},${rnd()<0.5?0:255},${rnd()<0.5?0:255},${0.03+rnd()*0.05})`; g.fillRect(0,y,Wp,1+(rnd()*2|0)); }
    g.fillStyle='rgba(255,255,255,0.9)'; g.fillRect(0,118,Wp,6);                          // 안쪽 펜스(가로로 늘어난 모습)
    const o=this.order, t1=o[0].finT, lineX=Wp*0.74, pps=Math.max(700,Math.min(2600, 420/Math.max(0.05,(o[Math.min(3,o.length-1)].finT-t1))));
    const items=this.runners.map(r=>({r,ft:r.finT})).filter(it=>lineX-(it.ft-t1)*pps>-260).sort((a,b)=>a.r.lane-b.r.lane);
    for(const it of items){
      const r=it.r, x=lineX-(it.ft-t1)*pps, lz=Math.max(0,Math.min(1,(r.lane-0.08)/0.84)), y=300+lz*140, s=1.25+lz*0.45;
      drawHorse(g,r.h,x-92*s,y,s,0.36*6.283+r.i*0.15,1,{});
      it.x=x; it.y=y; it.s=s;
    }
    // 결승선 + 각 말 코끝 기준선/마번
    g.strokeStyle='#ff1f1f'; g.lineWidth=3; g.beginPath(); g.moveTo(lineX,0); g.lineTo(lineX,Hp-34); g.stroke();
    items.slice().sort((a,b)=>b.x-a.x).forEach((it,k)=>{ const fr=FRAME[it.r.h.no];
      g.strokeStyle='rgba(255,255,255,0.7)'; g.lineWidth=1; g.setLineDash([4,4]); g.beginPath(); g.moveTo(it.x,40); g.lineTo(it.x,Hp-34); g.stroke(); g.setLineDash([]);
      const ly=44+k*30; g.fillStyle=fr.bg; g.strokeStyle='#000'; g.lineWidth=1.5; rr(g,it.x-14,ly,28,24,4); g.fill(); g.stroke();
      g.fillStyle=fr.fg; g.font='700 16px "Noto Sans KR",sans-serif'; g.textAlign='center'; g.textBaseline='middle'; g.fillText(String(it.r.h.no),it.x,ly+12.5); });
    // 하단 시간 눈금 (1/100초)
    g.fillStyle='rgba(0,0,0,0.85)'; g.fillRect(0,Hp-34,Wp,34);
    g.strokeStyle='#fff'; g.fillStyle='#fff'; g.font='600 11px monospace'; g.textAlign='center'; g.textBaseline='top';
    for(let k=0;k<200;k++){ const x=lineX-k*0.01*pps; if(x<0) break; const big=k%10===0; g.lineWidth=1; g.beginPath(); g.moveTo(x,Hp-34); g.lineTo(x,Hp-34+(big?14:k%5===0?9:5)); g.stroke(); if(big){ const tv=t1+k*0.01; g.fillText(`${Math.floor(tv/60)}:${(tv%60).toFixed(2).padStart(5,'0')}`,x,Hp-17); } }
    g.fillStyle='rgba(0,0,0,0.8)'; g.fillRect(0,0,Wp,30); g.fillStyle='#fff'; g.font='700 15px "Noto Sans KR",sans-serif'; g.textAlign='left'; g.textBaseline='middle';
    g.fillText(`PHOTO FINISH  ·  제${this.setup.raceNo}경주 ${this.setup.name}  ·  ${this.setup.D}m`,12,15);
    g.textAlign='right'; g.fillText(`1착 기록 ${Math.floor(t1/60)}:${(t1%60).toFixed(2).padStart(5,'0')}`,Wp-12,15);
    // 세피아 톤 (실제 판독 사진 느낌)
    try{ const im=g.getImageData(0,30,Wp,Hp-64), d=im.data;
      for(let i=0;i<d.length;i+=4){ const l=0.3*d[i]+0.59*d[i+1]+0.11*d[i+2]; const v=Math.min(255,(l-128)*1.18+128); d[i]=Math.min(255,v*1.07+8); d[i+1]=v*0.97+4; d[i+2]=v*0.82; }
      g.putImageData(im,0,30);
      g.strokeStyle='#ff1f1f'; g.lineWidth=3; g.beginPath(); g.moveTo(lineX,30); g.lineTo(lineX,Hp-34); g.stroke();
      items.forEach((it,k)=>{}); }catch(e){}
    // 마번 배지는 컬러로 다시 (세피아 위)
    items.slice().sort((a,b)=>b.x-a.x).forEach((it,k)=>{ const fr=FRAME[it.r.h.no]; const ly=44+k*30;
      g.fillStyle=fr.bg; g.strokeStyle='#000'; g.lineWidth=1.5; rr(g,it.x-14,ly,28,24,4); g.fill(); g.stroke();
      g.fillStyle=fr.fg; g.font='700 16px "Noto Sans KR",sans-serif'; g.textAlign='center'; g.textBaseline='middle'; g.fillText(String(it.r.h.no),it.x,ly+12.5); });
    return c;
  }
  drawPhoto(ctx){
    const e=this.real-this.photoT;
    ctx.fillStyle='rgba(0,0,0,0.82)'; ctx.fillRect(0,0,W,H);
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle='#fff'; ctx.font='700 44px "Noto Sans KR",sans-serif'; ctx.fillText('📸 PHOTO FINISH',W/2,H*0.3-60);
    if(this.pf){
      const k=Math.min(1,e/0.35), pw=W*0.94*(0.9+0.1*k), ph=pw*this.pf.height/this.pf.width, px=(W-pw)/2, py=H*0.3;

    else {
      const o=this.order, m=this.margins()[1];
      ctx.save(); ctx.translate(W/2,H*0.66); ctx.rotate(-0.06); const sc=Math.min(1,(e-2.2)/0.25); ctx.scale(1.6-0.6*sc,1.6-0.6*sc);
      ctx.fillStyle='rgba(255,255,255,0.92)'; rr(ctx,-210,-46,420,92,12); ctx.fill();
      ctx.strokeStyle='#e03131'; ctx.lineWidth=5; ctx.stroke();
      ctx.fillStyle='#e03131'; ctx.font='700 34px "Noto Sans KR",sans-serif'; ctx.fillText(`확정 1착 ${o[0].h.no}번 ${o[0].h.name}`,0,-12);
      ctx.font='700 20px "Noto Sans KR",sans-serif'; ctx.fillText(`2착 ${o[1].h.no}번 · ${m} 차이`,0,24); ctx.restore();
    }
  }
}

<script type="text/babel" data-presets="react">

function MiniHorse({h,w=150,hgt=96}){
  const ref=useRef(null);
  useEffect(()=>{
    const c=ref.current; if(!c) return; const ctx=c.getContext('2d');
    const dpr=Math.min(2,window.devicePixelRatio||1); c.width=w*dpr; c.height=hgt*dpr;
    let raf, ph=Math.random()*6, alive=true, lastT=0;

      ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,w,hgt);
      const g=ctx.createLinearGradient(0,hgt*0.7,0,hgt); g.addColorStop(0,'rgba(80,160,70,0)'); g.addColorStop(1,'rgba(80,160,70,0.5)');
      ctx.fillStyle=g; ctx.fillRect(0,0,w,hgt);
      drawHorse(ctx,h,w*0.45,hgt-6,0.62,ph,0.55,{}); };
    loop();
    return ()=>{ alive=false; cancelAnimationFrame(raf); };

function QuinMatrix({setup,sel,onPair}){
  const cols=Array.from({length:FIELD-1},(_,k)=>k+2), rows=Array.from({length:FIELD-1},(_,k)=>k+1);
  return (
    <div className="overflow-x-auto no-scrollbar">

        <thead><tr><th></th>{cols.map(b=><th key={b} className="p-[2px]"><NumBadge no={b} size={20}/></th>)}</tr></thead>
        <tbody>
          {rows.map(a=>(
            <tr key={a}><td className="p-[2px]"><NumBadge no={a} size={20}/></td>
              {cols.map(b=>{
                if(b<=a) return <td key={b}></td>;
                const k=quinKey(a,b), od=setup.odds.quin[k], on=sel.length===2&&quinKey(sel[0],sel[1])===k;
                return <td key={b} className="p-[2px]"><button onClick={()=>onPair(a,b)} className={`w-[38px] py-1 rounded font-bold ${on?'bg-yellow-300 text-black':od>=50?'bg-fuchsia-600/70 text-white':'bg-white/10 text-white'}`}>{od>=100?Math.round(od):od.toFixed(1)}</button></td>;

}

function RaceView({setup,bets,onDone}){
  const cvRef=useRef(null), engRef=useRef(null), wrapRef=useRef(null);
  const [comm,setComm]=useState(null);
  const [ff,setFf]=useState(false);
  const [vo,setVo]=useState(Voice.on);
  useEffect(()=>{
    Voice.pickVoice();
    const eng=new RaceEngine(cvRef.current,setup,{
      onComment:(text,hot,I)=>{ setComm({id:Math.random(),text,hot}); Voice.say(text,hot,I); },
      onDone:(res)=>setTimeout(()=>onDone(res),900)
    });
    engRef.current=eng;
    const onR=()=>eng.resize(); window.addEventListener('resize',onR);
    return ()=>{ window.removeEventListener('resize',onR); eng.destroy(); Voice.stop(); };
  },[]);
  const toggleFf=()=>{ const v=!ff; setFf(v); if(engRef.current) engRef.current.ff=v; };
  const full=()=>{ try{ const el=wrapRef.current; if(document.fullscreenElement) document.exitFullscreen(); else if(el.requestFullscreen) el.requestFullscreen().catch(()=>{}); }catch(e){} };
  return (
    <div className="mx-auto" style={{maxWidth:'min(100vw, calc((100vh - 52px) * 9 / 16))'}}>
      <div ref={wrapRef} className="relative bg-black overflow-hidden">
        <canvas ref={cvRef} className="w-full block" style={{aspectRatio:'9/16'}}/>
        {/* 아나운서 자막 */}
        {comm && <div key={comm.id} className="tick-in absolute left-2 right-2 bottom-12 rounded-xl bg-black/65 backdrop-blur-sm px-3 py-2 border border-white/10">
          <div className={`text-[15px] font-bold leading-snug ${comm.hot?'text-yellow-300':'text-white'}`}><span className="text-red-400 mr-1">🎙️</span>{comm.text}</div>
        </div>}
        <div className="absolute bottom-2 right-2 left-2 flex justify-end gap-1.5">
          {bets.length>0 && <div className="mr-auto px-2 py-1 rounded-lg text-[11px] font-bold bg-black/60 text-yellow-200">🎫 마권 {bets.length}장 · {fmt(bets.reduce((s,b)=>s+b.amount,0))} CR</div>}
          {Voice.ok && <button onClick={()=>{ const v=!vo; setVo(v); Voice.on=v; if(!v) Voice.stop(); else Voice.unlock(); }} className={`px-2.5 py-1 rounded-lg text-xs font-black ${vo?'bg-red-600 text-white':'bg-black/60 text-white'}`}>🎙️ {vo?'ON':'OFF'}</button>}
          <button onClick={toggleFf} className={`px-2.5 py-1 rounded-lg text-xs font-black ${ff?'bg-yellow-400 text-black':'bg-black/60 text-white'}`}>▶▶</button>
          <button onClick={full} className="px-2.5 py-1 rounded-lg text-xs font-black bg-black/60 text-white">⛶</button>
        </div>
      </div>
    </div>
  );
}

/* ---------------- 코인 레인 ---------------- */
function CoinRain({big}){
  const ref=useRef(null);
  useEffect(()=>{
    const c=ref.current; const ctx=c.getContext('2d'); let raf, alive=true;
    const resize=()=>{ c.width=window.innerWidth; c.height=window.innerHeight; }; resize();
    const N=big?160:70; const coins=[];
    for(let i=0;i<N;i++) coins.push({x:Math.random()*c.width,y:-Math.random()*c.height*1.2,v:3+Math.random()*5,r:8+Math.random()*10,a:Math.random()*6,va:0.1+Math.random()*0.2});
    const loop=()=>{ if(!alive) return; ctx.clearRect(0,0,c.width,c.height);
      for(const k of coins){ k.y+=k.v; k.a+=k.va; if(k.y>c.height+30){ k.y=-30; k.x=Math.random()*c.width; }
        const sx=Math.abs(Math.cos(k.a));
        ctx.save(); ctx.translate(k.x,k.y); ctx.scale(Math.max(0.15,sx),1);
        const g=ctx.createRadialGradient(-k.r*0.3,-k.r*0.3,1,0,0,k.r); g.addColorStop(0,'#fff6c8'); g.addColorStop(0.5,'#ffd43b'); g.addColorStop(1,'#d08700');
        ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,k.r,0,6.283); ctx.fill();
        ctx.strokeStyle='#a86b00'; ctx.lineWidth=2; ctx.stroke();
        ctx.fillStyle='#a86b00'; ctx.font=`700 ${k.r}px sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('C',0,1);
        ctx.restore(); }
      raf=requestAnimationFrame(loop); };
    loop(); window.addEventListener('resize',resize);
    return ()=>{ alive=false; cancelAnimationFrame(raf); window.removeEventListener('resize',resize); };
  },[]);
  return <canvas ref={ref} className="fixed inset-0 pointer-events-none z-50"/>;
}

const rint=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function mkOpts(ans,wrongs){ const set=[String(ans)]; for(const w of wrongs){ const s=String(w); if(!set.includes(s)) set.push(s); if(set.length>=4) break; } return shuffle(set); }
function numWrongs(ans,spread){ const out=[]; let g=0; while(out.length<6&&g<50){ g++; const d=rint(1,spread)*(Math.random()<0.5?-1:1); const v=ans+d; if(v!==ans&&v>=0&&!out.includes(v)) out.push(v);} return out; }
function genQuestion(setup){
  const t=pickW(['arith','pay','seq','pct','time','race','race2'],[3,2,2,1.5,1,1.5,1.5]);
  if(t==='arith'){ const a=rint(12,49),b=rint(3,9),c=rint(10,99); const ans=a*b+c;
    return {q:`${a} × ${b} + ${c} = ?`,a:String(ans),o:mkOpts(ans,numWrongs(ans,12)),ex:`${a}×${b}=${a*b}, 여기에 ${c}을 더하면 ${ans}`}; }
  if(t==='pay'){ const amt=pick([100,200,300,500]), od=rint(12,95)/10; const ans=Math.round(amt*od);
    return {q:`단승 배당 ${od.toFixed(1)}배인 말에 ${amt} CREDIT을 걸어 적중! 받는 금액은?`,a:fmtN(ans),o:mkOpts(fmtN(ans),numWrongs(ans,Math.max(20,Math.round(ans*0.3))).map(v=>fmtN(Math.round(v/10)*10||v))),ex:`${amt} × ${od.toFixed(1)} = ${fmtN(ans)}`}; }
  if(t==='seq'){ if(Math.random()<0.5){ const s=rint(2,20),d=rint(3,13); const arr=[0,1,2,3].map(i=>s+d*i); const ans=s+d*4;
      return {q:`규칙을 찾아 빈칸을 채우세요: ${arr.join(', ')}, ?`,a:String(ans),o:mkOpts(ans,numWrongs(ans,d)),ex:`${d}씩 커지므로 ${arr[3]}+${d}=${ans}`}; }
    const s=rint(1,5),r=pick([2,3]); const arr=[0,1,2,3].map(i=>s*Math.pow(r,i)); const ans=s*Math.pow(r,4);
    return {q:`규칙을 찾아 빈칸을 채우세요: ${arr.join(', ')}, ?`,a:String(ans),o:mkOpts(ans,[ans-arr[3],ans+arr[3],arr[3]*2+r,ans+r]),ex:`${r}배씩 커지므로 ${arr[3]}×${r}=${ans}`}; }
  if(t==='pct'){ const base=pick([200,400,600,800,1200,1500,2000,3000]), p=pick([10,15,20,25,30,40,50]); const ans=base*p/100;
    return {q:`${fmtN(base)}의 ${p}%는?`,a:fmtN(ans),o:mkOpts(fmtN(ans),[base*(p+10)/100,base*(p-5)/100,ans*2,ans+50].map(fmtN)),ex:`${fmtN(base)} × ${p/100} = ${fmtN(ans)}`}; }
  if(t==='time'){ const m=rint(1,3),s=rint(5,55); const ans=m*60+s;
    return {q:`경주 기록 ${m}분 ${s}초는 모두 몇 초일까?`,a:`${ans}초`,o:mkOpts(`${ans}초`,[`${m*100+s}초`,`${ans+10}초`,`${ans-10}초`,`${(m+1)*60+s}초`]),ex:`${m}분=${m*60}초, ${m*60}+${s}=${ans}초`}; }
  const hs=setup?setup.horses:null;
  if(hs && t==='race'){ const fav=hs.slice().sort((a,b)=>setup.odds.win[a.no]-setup.odds.win[b.no])[0];
    return {q:`이번 경주 예상지에서 단승 배당이 가장 낮은 1인기 말은?`,a:fav.name,o:mkOpts(fav.name,shuffle(hs.filter(h=>h!==fav).map(h=>h.name))),ex:`${fav.no}번 ${fav.name} — 단승 ${setup.odds.win[fav.no].toFixed(1)}배`}; }
  if(hs){ const h=pick(hs);
    if(Math.random()<0.5) return {q:`이번 경주 ${h.no}번 ${h.name}의 각질은?`,a:h.style,o:mkOpts(h.style,shuffle(['도주','선행','선입','추입'].filter(x=>x!==h.style))),ex:`예상지에 ${h.name}은(는) '${h.style}'으로 표시돼 있어요.`};

function fmtN(n){ return Math.round(n).toLocaleString(); }
function nextQuestion(setup){
  if(Math.random()<0.5){
    let used=ls.get('sd_quiz_used',[]); if(used.length>=QUIZ_BANK.length) used=[];

    const [q,a,w,ex]=QUIZ_BANK[i]; return {q,a,o:shuffle([a,...w]),ex,cat:'상식'};

  return {...genQuestion(setup),cat:'두뇌'};
}

    <div className="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-start sm:items-center justify-center p-3 overflow-y-auto">
      <div className="glass rounded-3xl p-4 w-full max-w-md pop mt-6 sm:mt-0">
        <div className="flex items-center gap-2">
          <div className="fx-title text-2xl gold">🧠 CREDIT 퀴즈</div>
          <span className="text-[11px] px-2 py-0.5 rounded-full bg-white/10">{q.cat}</span>
          <button onClick={onClose} className="ml-auto w-9 h-9 rounded-full bg-white/10 text-xl">×</button>
        </div>
        <div className="flex justify-between text-xs text-blue-200/80 mt-1">
          <span>정답 1개당 <b className="text-yellow-300">+{fmtN(QUIZ_REWARD)} CR</b></span>
          <span>연속 정답 {streak} · 이번에 받은 {fmtN(earned)} CR</span>
        </div>
        <div className="h-1.5 rounded bg-white/10 mt-2 overflow-hidden"><div className={`h-full transition-all duration-1000 ${time<=5?'bg-red-500':'bg-emerald-400'}`} style={{width:`${(picked!==null?0:time)/20*100}%`}}/></div>
        <div className="mt-4 text-lg font-black leading-snug min-h-[56px]">{q.q}</div>
        <div className="grid gap-2 mt-3">
          {q.o.map(o=>{
            let cls='bg-white/10 hover:bg-white/20';
            if(picked!==null){ if(o===q.a) cls='bg-emerald-500 text-white ring-2 ring-emerald-200'; else if(o===picked) cls='bg-red-600/80 text-white'; else cls='bg-white/5 opacity-60'; }
            return <button key={o} onClick={()=>choose(o)} className={`text-left rounded-xl px-4 py-3 font-bold transition ${cls}`}>{o}</button>;
          })}
        </div>
        {picked!==null && <div className="mt-3 rounded-xl bg-black/30 p-3 pop">
          <div className={`font-black text-lg ${ok?'text-yellow-300':'text-red-300'}`}>{ok?`정답! +${fmtN(QUIZ_REWARD)} CREDIT`:picked==='__timeout'?'시간 초과!':'오답!'}</div>
          <div className="text-sm text-blue-100/90 mt-1">{q.ex}</div>
          <div className="grid grid-cols-2 gap-2 mt-3">
            <button onClick={onClose} className="py-3 rounded-xl font-black bg-white/10">경마하러 가기</button>
            <button onClick={next} className="py-3 rounded-xl font-black bg-gradient-to-b from-yellow-300 to-orange-500 text-black">다음 문제 ▶</button>
          </div>
        </div>}
      </div>
    </div>
  );
}

/* ---------------- 앱 ---------------- */
function App(){
  const [credit,setCredit]=useState(()=>ls.get('sd_credit',1000));
  const [raceNo,setRaceNo]=useState(()=>ls.get('sd_race',1));
  const [history,setHistory]=useState(()=>ls.get('sd_hist',[]));
  const [setup,setSetup]=useState(null);
  const [phase,setPhase]=useState('paddock');
  const [bets,setBets]=useState([]);
  const [result,setResult]=useState(null);
  const [payouts,setPayouts]=useState([]);
  const [muted,setMuted]=useState(false);
  const [quiz,setQuiz]=useState(false);
  useEffect(()=>{ setSetup(null); const t=setTimeout(()=>setSetup(makeRaceSetup(raceNo)),30); return ()=>clearTimeout(t); },[raceNo]);
  useEffect(()=>ls.set('sd_credit',credit),[credit]);
  useEffect(()=>ls.set('sd_race',raceNo),[raceNo]);
  useEffect(()=>ls.set('sd_hist',history),[history]);
  useEffect(()=>{ Sound.setMuted(muted); if(muted) Voice.stop(); },[muted]);

  const total=bets.reduce((s,b)=>s+b.amount,0);
  const start=()=>{ Sound.init(); Voice.unlock(); Sound.setMuted(muted); setCredit(c=>c-total); setPhase('race'); window.scrollTo(0,0); };
  const done=res=>{
    const o=res.order;
    const pays=bets.map(b=>{
      let hit=false;
      if(b.type==='WIN') hit=b.sel[0]===o[0];
      else if(b.type==='PLACE') hit=b.sel[0]===o[0]||b.sel[0]===o[1];
      else hit=quinKey(b.sel[0],b.sel[1])===quinKey(o[0],o[1]);
      return hit?Math.round(b.amount*b.odds):0;
    });
    const win=pays.reduce((s,p)=>s+p,0);
    setPayouts(pays); setResult(res); setCredit(c=>c+win);
    setHistory(h=>[[o[0],o[1]],...h].slice(0,20));
    setPhase('result');
    if(win>0){ const big=bets.some((b,i)=>pays[i]>0&&b.odds>=10); Sound.jackpot(big); }
    else if(bets.length) Sound.miss();
  };
  const next=()=>{ Sound.click(); setBets([]); setResult(null); setPayouts([]); setPhase('paddock'); setRaceNo(n=>n+1); window.scrollTo(0,0); };

  return (
    <div className="min-h-screen" style={{background:'radial-gradient(1200px 600px at 50% -200px,#1b2f6e 0%,#070d1f 60%)'}}>
      <header className="sticky top-0 z-20 backdrop-blur bg-[#070d1f]/80 border-b border-white/5">
        <div className="max-w-md mx-auto flex items-center gap-2 px-3 py-2 h-[52px]">
          <div className="fx-title text-[19px] leading-none whitespace-nowrap"><span className="gold">★ STAR</span> <span className="text-white">DERBY</span></div>
          
          <div className="ml-auto flex items-center gap-2">
            {phase==='paddock' && <button onClick={()=>{Sound.init();Sound.click();setQuiz(true);}} className="h-8 px-2.5 rounded-full bg-gradient-to-b from-fuchsia-500 to-purple-700 text-[13px] font-black whitespace-nowrap">🧠 퀴즈</button>}
            <button onClick={()=>{Sound.init(); setMuted(m=>!m);}} className="w-8 h-8 shrink-0 rounded-full bg-white/10 text-base">{muted?'🔇':'🔊'}</button>
            <div className="rounded-full bg-gradient-to-b from-yellow-300 to-amber-500 text-black px-2.5 py-1 font-black text-[13px] shadow whitespace-nowrap">💰 {fmt(credit)}</div>
          </div>
        </div>
      </header>
      {!setup ? <div className="text-center py-24"><div className="fx-title text-3xl gold animate-pulse">예상지 집계 중...</div><div className="text-blue-200/70 mt-2 text-sm">배당률 계산 중입니다</div></div> :
        phase==='paddock' ? <Paddock setup={setup} credit={credit} bets={bets} setBets={setBets} onStart={start} onQuiz={()=>setQuiz(true)} history={history}/> :
        <RaceView key={setup.raceNo} setup={setup} bets={bets} onDone={done}/>}
      {quiz && setup && <QuizModal setup={setup} onClose={()=>setQuiz(false)} onReward={n=>setCredit(c=>c+n)}/>}
      {phase==='result' && result && <ResultModal setup={setup} result={result} bets={bets} payouts={payouts} onNext={next}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
