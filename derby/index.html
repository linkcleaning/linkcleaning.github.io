function generateField(){
  const used=new Set();
  const jockeys=shuffle(['안영삼','한승우','김기훈','한정민','한정호','이은경','맹길이','박시은']);
  const FIXED={'안영삼':'하나토탈이','한승우':'링크돌이','김기훈':'기훈짱','이은경':'링크순이','한정민':'핑크공주','맹길이':'까스돌이','박시은':'크림어스','한정호':'리턴팩토리'};
  Object.values(FIXED).forEach(n=>used.add(n));
  const styles=shuffle(['도주','추입',...shuffle(['도주','선행','선행','선입','선입','추입','추입','도주']).slice(0,FIELD-2)]);
  return styles.map((style,i)=>{
    const c=pickW(COATS,COATS.map(x=>x.w));
    let base=pick(SILK_COLORS), acc=pick(SILK_COLORS); while(acc===base) acc=pick(SILK_COLORS);
    return { no:i+1, name:FIXED[jockeys[i]]||horseName(used), coatName:c.n, coat:c.coat, coatDark:c.dark, mane:c.mane, dapple:!!c.dapple,
      blaze: Math.random()<0.45 ? pick(['star','stripe','blaze']) : null,
      socks: [0,1,2,3].map(()=>Math.random()<0.22),
      style, dirtFit:0.99+Math.random()*0.02, sex:pickW(['수','암','거'],[5,3,2]), age:3+Math.floor(Math.random()*4),
      silk:{base,accent:acc,pattern:pick(PATTERNS)}, cap:Math.random()<0.5?acc:base, jockey:jockeys[i] };
  });
}

function laneZ(i){ return 0.12 + i*(0.76/(FIELD-1)); }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function pickW(a,w){ let s=0; for(const x of w) s+=x; let r=Math.random()*s; for(let i=0;i<a.length;i++){ r-=w[i]; if(r<=0) return a[i]; } return a[a.length-1]; }
function quinKey(a,b){ return a<b ? a+'-'+b : b+'-'+a; }

function profileMul(style,p,r){
  let m;
  const st = r.h.stam;
  if(style==='도주'){ m = p<0.6 ? 1.031 : 1.031 - ((p-0.6)/0.4)*0.118*(2-st); }
  else if(style==='선행'){ m = p<0.65 ? 1.012 : 1.012 - ((p-0.65)/0.35)*0.027*(2-st); }
  else if(style==='선입'){ m = p<0.3 ? 0.995 : (p<0.72 ? 1.0 : 1.0 + Math.min(1,(p-0.72)/0.06)*0.03); }
  else { m = p<r.spurtAt ? 0.977 : 0.977 + Math.min(1,(p-r.spurtAt)/0.05)*0.14; }
  return 1 + K_PROF*(m-1);
}
function speedOf(r,D,going){
  const h=r.h, p=Math.max(0,r.pos)/D;
  const base = 16.6*h.abil*COND_MUL[h.cond]*r.luck*going;
  const wave = 1 + 0.005*Math.sin(r.t*r.w1+r.p1) + 0.003*Math.sin(r.t*r.w2+r.p2);
  return base*profileMul(h.style,p,r)*wave;
}
function makeRunner(h,i){

    w1:0.25+Math.random()*0.35, w2:0.8+Math.random()*0.7, p1:Math.random()*6.283, p2:Math.random()*6.283,
    spurtAt: 0.73+Math.random()*0.07, react: 0.05+Math.random()*0.3, kick: 1+(Math.random()-0.5)*0.02,
    fin:false, finT:0, finV:0, spurting:false, spurtSaid:false,

function stepRunner(r,dt,D,going,leadPos){
  r.t += dt;
  if(r.t < r.react) return;
  let tgt = r.fin ? Math.max(4, 9 - (r.t-r.finT)*0.9) : speedOf(r,D,going);
  if(!r.fin){
    const p=r.pos/D;
    // 중반까지는 뒤쪽 말이 바람막이 효과로 따라붙어 마군이 촘촘하게 유지됨 → 막판 대혼전
    if(leadPos!=null && p>0.05 && p<0.78){ const gap=leadPos-r.pos; if(gap>1.5) tgt*=1+Math.min(0.012,(gap-1.5)*0.0012); }
    if(p>0.72) tgt*=r.kick*(1+(r.h.kickB||0));   // 막판 컨디션 변수 → 역전 드라마
  }
  const rate = r.v<tgt ? (r.h.style==='도주'?0.95:(r.h.style==='추입'?0.7:0.82)) : 0.5;
  r.v += (tgt-r.v)*Math.min(1,rate*dt);
  r.prev = r.pos; r.pos += r.v*dt;
  if(!r.fin && r.pos>=D){
    r.fin = true; r.finV = r.v;
    r.finT = r.t - dt*(r.pos-D)/Math.max(1e-6, r.pos-r.prev);
  }
  if(r.h.style==='추입' && !r.spurting && !r.fin && r.pos/D>=r.spurtAt) r.spurting = true;
}
function runSim(horses,D,going){
  const rs = horses.map((h,i)=>makeRunner(h,i));
  let t=0;
  while(t<600){
    let all=true;
    let lp=-1e9; for(const r of rs) if(r.pos>lp) lp=r.pos;
    for(const r of rs){ stepRunner(r,0.1,D,going,lp); if(!r.fin) all=false; }
    t+=0.1; if(all) break;
  }
  return rs.sort((a,b)=>a.finT-b.finT);
}
function computeOdds(horses,D,going,N){
  N = N||500;
  const win={}, top2={}, pair={};
  horses.forEach(h=>{ win[h.no]=0; top2[h.no]=0; });
  for(let n=0;n<N;n++){
    const o = runSim(horses,D,going);
    const a=o[0].h.no, b=o[1].h.no;
    win[a]++; top2[a]++; top2[b]++;
    const k=quinKey(a,b); pair[k]=(pair[k]||0)+1;
  }
  const R=0.8, r1=x=>Math.round(x*10)/10;
  const odds={win:{},place:{},quin:{}};
  horses.forEach(h=>{
    const pw=(win[h.no]+0.6)/(N+3.6);
    const noise = 1+(Math.random()-0.5)*0.08;
    odds.win[h.no] = r1(Math.min(99.9, Math.max(1.2, R/pw*noise)));
    const p2=(top2[h.no]+1)/(N+3);
    odds.place[h.no] = r1(Math.min(30, Math.max(1.1, R/p2)));
  });
  for(let a=1;a<=FIELD;a++) for(let b=a+1;b<=FIELD;b++){
    const k=quinKey(a,b);
    const pp=((pair[k]||0)+0.3)/(N+4.5);
    odds.quin[k] = r1(Math.min(999.9, Math.max(1.5, R/pp)));
  }
  return odds;
}
function makeRaceSetup(raceNo,stable,barn){
  const venue = venueOf(raceNo), nm = pick(venue.races);
  const D = pick([1200,1400,1600,1800]);
  const surface = Math.random()<venue.dirt ? 'dirt' : 'turf';
  const weather = pickW(['맑음','흐림','비','노을','야간'],venue.wx);
  const going = weather==='비' ? pickW(['다습','불량'],[1,1.2]) : weather==='흐림' ? pickW(['양호','다습'],[3,1]) : pickW(['양호','다습'],[7,1]);
  const field=generateField();
  const ent = barn&&barn.entry ? WORLD_HORSES.find(w=>w.id===barn.entry) : null;
  if(ent){ const slots=field.filter(h=>!(stable&&stable.name===h.name)); const t=slots[Math.floor(Math.random()*slots.length)], c=COATS[ent.coat];
    Object.assign(t,{name:ent.name, coatName:c.n, coat:c.coat, coatDark:c.dark, mane:c.mane, dapple:!!c.dapple, style:ent.style, world:{id:ent.id,flag:ent.flag,grade:ent.grade,home:ent.home===venue.id}}); }
  const horses = field.map(h=>{
    let cond = pickW([1,2,3,4,5],[1,2,4,3,1.5]);
    let abil = 0.997+Math.random()*0.006;
    if(surface==='dirt') abil *= 1+(h.dirtFit-1)*0.14;
    let stam = 0.95+Math.random()*0.1;
    const owned = !!(stable && stable.name===h.name);
    if(owned){ // 구단주 투자 효과: 스피드·지구력·순발력 레벨, 컨디션 관리
      abil += 0.0002*(stable.spd||0); stam += 0.006*(stable.sta||0); h.kickB=0.0012*(stable.kick||0);
      if(stable.care) cond=5; }
    if(h.world){ h.hidden=0.00018*h.world.grade+(h.world.home?0.0004:0); abil += 0.00018*h.world.grade + (h.world.home?0.0004:0); stam += 0.01*h.world.grade; cond=Math.max(cond,3); }
    const q = (abil-0.996)/0.008;
    const recent = [];
    for(let k=0;k<5;k++){ const rr=Math.min(6,Math.max(1,Math.round(1+Math.random()*5*(1.15-q*0.8)))); recent.push(rr); }
    return { ...h, owned:owned||!!h.world, cond, abil, stam, recent,
      weightKg: 440+Math.floor(Math.random()*70), delta: (Math.floor(Math.random()*9)-4)*2 };
  });
  const odds = computeOdds(horses,D,GOING_MUL[going],380);
  horses.forEach(h=>{ if(h.hidden) h.abil+=h.hidden; });   // 숨은 실력: 배당표엔 안 잡힌 구단주 관리 효과
  const byOdds = horses.map(h=>h.no).sort((a,b)=>odds.win[a]-odds.win[b]);
  const pop={}; byOdds.forEach((no,i)=>pop[no]=i+1);
  const expert = horses.map(h=>({no:h.no, s:Math.log(odds.win[h.no])+(Math.random()-0.5)*0.9})).sort((a,b)=>a.s-b.s);
  const marks={}; ['◎','○','▲','△','△','','',''].slice(0,expert.length).forEach((m,i)=>marks[expert[i].no]=m);
  return { raceNo, venue:{id:venue.id,flag:venue.flag,country:venue.country,city:venue.city,course:venue.course,sky:venue.sky,ad:venue.ad,hello:venue.hello}, tourIdx:((raceNo-1)%VENUES.length)+1, name:nm[0], grade:nm[1], D, surface, going, goingMul:GOING_MUL[going], weather, horses, odds, pop, marks };
}

      for(let x=3;x<1600;){
        const r0=rnd(), r1=rnd(), r2=rnd(), r3=rnd(), r4=rnd();

  // 주로 질감 타일 (더트 알갱이 / 잔디 잎)

    const bgG=g.createLinearGradient(0,0,0,Hp); bgG.addColorStop(0,'#b9bdc2'); bgG.addColorStop(0.22,'#8e949b'); bgG.addColorStop(0.26,'#f1f3f5'); bgG.addColorStop(0.28,'#9aa0a6'); bgG.addColorStop(0.36,this.dirt?'#8d6c4c':'#5d7f52'); bgG.addColorStop(1,this.dirt?'#a07c58':'#6e955f');

              {h.world && <span className="ml-1 px-1.5 py-0.5 rounded bg-sky-400 text-black text-[10px] font-black whitespace-nowrap">{h.world.flag} {'★'.repeat(h.world.grade)}{h.world.home?' 홈':''}</span>}
            {mark && <div className="ml-auto text-2xl font-black text-yellow-300 drop-shadow">{mark}</div>}
          </div>
          <div className="flex items-end gap-1 mt-1">
            <div className="shrink-0 -ml-2 -mb-1"><MiniHorse h={h} w={128} hgt={84}/></div>
            <div className="flex-1 grid grid-cols-2 gap-1.5 text-[12px]">
              <div className="rounded-lg bg-black/30 px-2 py-1">
                <div className="text-blue-200/70 text-[10px]">컨디션</div>
                <div className="font-black text-base leading-tight" style={{color:ci.c}}>{ci.a} {ci.t}</div>
              </div>
              <div className="rounded-lg bg-black/30 px-2 py-1">
                <div className="text-blue-200/70 text-[10px]">각질</div>
                <div className={`inline-block mt-0.5 px-1.5 rounded text-white font-bold ${styleColor}`}>{h.style}</div>
              </div>
              <div className="rounded-lg bg-black/30 px-2 py-1">
                <div className="text-blue-200/70 text-[10px]">단승 · {pop}인기</div>
                <div className={`font-black text-lg leading-tight ${wo<4?'text-red-400':wo>15?'text-fuchsia-300':'text-white'}`}>{wo.toFixed(1)}<span className="text-xs">배</span></div>
              </div>
              <div className="rounded-lg bg-black/30 px-2 py-1">
                <div className="text-blue-200/70 text-[10px]">연승</div>
                <div className="font-black text-lg leading-tight text-sky-300">{po.toFixed(1)}<span className="text-xs">배</span></div>
              </div>
            </div>
          </div>
          {(()=>{ const wh=h.world&&WORLD_HORSES.find(w=>w.id===h.world.id); const pf=wh?{tag:wh.tag,horse:wh.desc+(h.world.home?' 오늘은 고향 경마장이라 힘이 넘친다!':''),jockey:'구단주님의 해외 초청마에 오늘 특별 기승합니다.'}:PROFILES[h.name]; const talk=horseTalk(h,setup); return (
            <div className="mt-1.5 rounded-xl bg-black/25 px-2.5 py-2 space-y-1 text-[12px] leading-snug">
              {pf && <div><span className="inline-block mr-1 px-1.5 rounded bg-yellow-400/20 text-yellow-200 text-[10px] font-black align-middle">{pf.tag}</span><span className="text-blue-50/90">🐎 {pf.horse}</span></div>}
              {pf && <div className="text-blue-100/80">🏇 <b className="text-white">{h.jockey}</b> 기수 — {pf.jockey}</div>}
              <div className="text-amber-200/90">💬 오늘의 한마디: {talk}</div>
            </div>); })()}
          <div className="flex items-center gap-1 mt-1.5 text-[11px] text-blue-200/80">
            최근 5전
            {h.recent.map((r,i)=><span key={i} className={`w-5 h-5 inline-flex items-center justify-center rounded font-bold ${r===1?'bg-yellow-400 text-black':r===2?'bg-slate-300 text-black':r===3?'bg-amber-700 text-white':'bg-white/10'}`}>{r}</span>)}
          </div>
        </div>
      </div>
      {selected && <div className="absolute top-2 right-2 text-[10px] font-black bg-yellow-300 text-black px-2 py-0.5 rounded-full">{TYPE_INFO[type].label} 선택</div>}
    </button>
  );
}

function QuinMatrix({setup,sel,onPair}){
  const cols=Array.from({length:FIELD-1},(_,k)=>k+2), rows=Array.from({length:FIELD-1},(_,k)=>k+1);
  return (
    <div className="overflow-x-auto no-scrollbar">
      <table className="text-[10px] mx-auto">
        <thead><tr><th></th>{cols.map(b=><th key={b} className="p-[2px]"><NumBadge no={b} size={20}/></th>)}</tr></thead>
        <tbody>
          {rows.map(a=>(
            <tr key={a}><td className="p-[2px]"><NumBadge no={a} size={20}/></td>
              {cols.map(b=>{
                if(b<=a) return <td key={b}></td>;
                const k=quinKey(a,b), od=setup.odds.quin[k], on=sel.length===2&&quinKey(sel[0],sel[1])===k;
                return <td key={b} className="p-[2px]"><button onClick={()=>onPair(a,b)} className={`w-[38px] py-1 rounded font-bold ${on?'bg-yellow-300 text-black':od>=50?'bg-fuchsia-600/70 text-white':'bg-white/10 text-white'}`}>{od>=100?Math.round(od):od.toFixed(1)}</button></td>;
              })}
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

function Paddock({setup,credit,bets,setBets,onStart,onQuiz,onEvent,evLabel,onOwner,stable,barn,history,stats,daily,setDaily,onCredit}){
  const [tab,setTab]=useState('card');
  const [type,setType]=useState('WIN');
  const [sel,setSel]=useState([]);
  const [amt,setAmt]=useState(100);
  const [msg,setMsg]=useState('');
  const total=bets.reduce((s,b)=>s+b.amount,0);
  const avail=credit-total;
  const pickHorse=no=>{ Sound.init(); Sound.click();
    if(type==='QUIN'){ setSel(s=>s.includes(no)?s.filter(x=>x!==no):(s.length<2?[...s,no]:[s[1],no])); }
    else setSel(s=>s[0]===no?[]:[no]);
  };
  const goBet=no=>{ Sound.init(); Sound.click(); if(type==='QUIN') setSel(s=>s.includes(no)?s:(s.length<2?[...s,no]:[s[1],no])); else setSel([no]); setTab('bet'); window.scrollTo(0,0); };
  const changeType=t=>{ Sound.init(); Sound.click(); setType(t); setSel(s=>t==='QUIN'?s.slice(0,2):s.slice(0,1)); };
  const curOdds = (()=>{ if(type==='WIN'&&sel.length===1) return setup.odds.win[sel[0]];
    if(type==='PLACE'&&sel.length===1) return setup.odds.place[sel[0]];
    if(type==='QUIN'&&sel.length===2) return setup.odds.quin[quinKey(sel[0],sel[1])]; return null; })();
  const addBet=()=>{
    Sound.init();
    if(sel.length!==TYPE_INFO[type].need){ setMsg(type==='QUIN'?'복승식은 말 2마리를 골라 주세요':'말을 1마리 골라 주세요'); return; }
    if(amt<MIN_BET){ setMsg(`마권은 1장에 최소 ${MIN_BET} CR이에요`); return; }
    if(amt>avail){ setMsg('CREDIT이 부족합니다'); return; }
    const s=type==='QUIN'?[...sel].sort((a,b)=>a-b):sel;
    setBets(b=>[...b,{id:Date.now()+Math.random(),type,sel:s,amount:amt,odds:curOdds}]);
    Sound.coin(); setMsg(''); setSel([]);
  };
  const S=setup;
  const [quick,setQuick]=useState(false);
  const tryStart=()=>{ Sound.init(); if(bets.length) onStart(); else { Sound.click(); setQuick(true); } };
  const unit=Math.max(0,Math.min(100,Math.floor(avail/10)*10)); // 빠른 마권 1장 금액 (최소 MIN_BET)
  const nos=S.horses.map(h=>h.no), bestNo=Object.keys(S.marks).map(Number).find(n=>S.marks[n]==='◎')||nos[0], secNo=Object.keys(S.marks).map(Number).find(n=>S.marks[n]==='○')||nos[1];
  const mk=(type,sel,amount)=>{ const ss=type==='QUIN'?[...sel].sort((a,b)=>a-b):sel; const od=type==='WIN'?S.odds.win[ss[0]]:type==='PLACE'?S.odds.place[ss[0]]:S.odds.quin[quinKey(ss[0],ss[1])]; return {id:Date.now()+Math.random(),type,sel:ss,amount,odds:od}; };
  const quickPick=kind=>{
    if(unit<MIN_BET) return;
    let L=[];
    if(kind==='pro'){ L.push(mk('WIN',[bestNo],unit)); if(avail>=unit*2) L.push(mk('QUIN',[bestNo,secNo],unit)); }
    else if(kind==='safe'){ L.push(mk('PLACE',[bestNo],unit)); }
    else if(kind==='jackpot'){ const pairs=Object.entries(S.odds.quin).filter(([k,v])=>v>=30&&v<=200); const pk=pairs.length?pick(pairs)[0]:pick(Object.keys(S.odds.quin)); L.push(mk('QUIN',pk.split('-').map(Number),unit)); }
    else { const t=pick(['WIN','PLACE','QUIN']); const sh=shuffle(nos.slice()); L.push(mk(t,t==='QUIN'?sh.slice(0,2):[sh[0]],unit)); }
    Sound.coin(); setQuick(false); setBets(L); onStart(L);
  };
  return (
    <div className="max-w-md mx-auto px-3 pb-28">
      {quick && <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-end justify-center" onClick={()=>setQuick(false)}>
        <div className="glass w-full max-w-md rounded-t-3xl p-4 pop" onClick={e=>e.stopPropagation()} style={{paddingBottom:'max(16px, env(safe-area-inset-bottom))'}}>
          <div className="fx-title text-xl gold text-center">🎫 마권을 사야 출주할 수 있어요!</div>
          <p className="text-center text-[13px] text-blue-200/80 mt-1">한 번 터치로 바로 사고 출발합니다 ({unit} CR씩)</p>
          {unit<MIN_BET ? <button onClick={()=>{setQuick(false);onQuiz();}} className="w-full mt-3 py-3 rounded-xl font-black bg-gradient-to-b from-fuchsia-500 to-purple-700">🧠 CREDIT이 부족해요 — 퀴즈로 받기 (하루 최대 5,000)</button> :
          <div className="grid grid-cols-2 gap-2 mt-3">
            <button onClick={()=>quickPick('pro')} className="rounded-2xl p-3 text-left bg-gradient-to-b from-sky-500/40 to-blue-800/40 ring-1 ring-sky-300/40"><div className="font-black">⭐ 예상지 추천</div><div className="text-[11px] text-blue-100/80 mt-0.5">◎ {S.horses.find(h=>h.no===bestNo).name} 단승 + ◎○ 복승</div></button>
            <button onClick={()=>quickPick('safe')} className="rounded-2xl p-3 text-left bg-gradient-to-b from-emerald-500/40 to-emerald-800/40 ring-1 ring-emerald-300/40"><div className="font-black">🛡️ 안전빵</div><div className="text-[11px] text-blue-100/80 mt-0.5">◎ 말 연승 (2착 안에만 들면 적중)</div></button>
            <button onClick={()=>quickPick('jackpot')} className="rounded-2xl p-3 text-left bg-gradient-to-b from-fuchsia-500/40 to-purple-800/40 ring-1 ring-fuchsia-300/40"><div className="font-black">💎 잭팟 노리기</div><div className="text-[11px] text-blue-100/80 mt-0.5">배당 30배 이상 복승 랜덤</div></button>
            <button onClick={()=>quickPick('random')} className="rounded-2xl p-3 text-left bg-gradient-to-b from-amber-400/40 to-orange-700/40 ring-1 ring-amber-300/40"><div className="font-black">🎲 운에 맡기기</div><div className="text-[11px] text-blue-100/80 mt-0.5">마권 종류·말 모두 랜덤</div></button>
          </div>}
          <button onClick={()=>{Sound.click();setQuick(false);setTab('bet');window.scrollTo(0,0);}} className="w-full mt-2 py-3 rounded-xl font-black bg-white/10">✍️ 내가 직접 고를게요</button>
        </div>
      </div>}
      {/* 레이스 정보 */}
      <div className="glass rounded-2xl px-3 py-2.5 mt-2">
        <div className="flex items-center gap-1.5">
          <span className="px-1.5 py-0.5 rounded bg-red-600 text-white text-[11px] font-black">{S.raceNo}R</span>
          <span className="px-1.5 py-0.5 rounded bg-yellow-400 text-black text-[11px] font-black">{S.grade}</span>
          <h2 className="fx-title text-xl gold truncate">{S.name}</h2>
        </div>
        {S.venue && <div className="mt-1.5 flex items-center gap-1.5 text-[12px]">
          <span className="text-lg leading-none">{S.venue.flag}</span>
          <b className="text-white">{S.venue.course}</b>
          <span className="text-blue-200/70">{S.venue.country}</span>
          <span className="ml-auto px-1.5 py-0.5 rounded bg-sky-500/25 text-sky-100 font-bold whitespace-nowrap">🌍 월드 투어 {S.tourIdx}/{VENUES.length}</span>
        </div>}
        {S.venue && <div className="flex items-center gap-0.5 mt-1 overflow-x-auto no-scrollbar">{VENUES.map((v,i)=><span key={v.id} title={v.course} className={`shrink-0 text-[15px] px-1 rounded ${i+1===S.tourIdx?'bg-yellow-300/30 ring-1 ring-yellow-300':i+1<S.tourIdx?'opacity-90':'opacity-35'}`}>{v.flag}</span>)}<span className="text-[10px] text-blue-200/60 ml-1 whitespace-nowrap">다음: {venueOf(S.raceNo+1).city}</span></div>}
        {stats && <div className="flex flex-wrap items-center gap-1.5 mt-1.5 text-[11px] whitespace-nowrap">
          <span className="px-1.5 py-0.5 rounded bg-gradient-to-r from-yellow-500/30 to-amber-700/30 text-yellow-100 font-bold">🏅 {ownerTitle(stats.earned)}</span>
          {stats.streak>0 && <span className="px-1.5 py-0.5 rounded bg-red-600/40 text-red-100 font-bold">🔥 {stats.streak}연속 적중 · 다음 보너스 +{Math.min(50,stats.streak*10)}%</span>}
          {stats.races>0 && <span className="text-blue-200/70">적중률 {Math.round(stats.hits/stats.races*100)}%</span>}
        </div>}
        <div className="flex flex-wrap gap-1.5 mt-1.5 text-[12px]">
          <span className="px-1.5 py-0.5 rounded bg-white/10">📏 {S.D}m</span>
          <span className={`px-1.5 py-0.5 rounded ${S.surface==='turf'?'bg-green-600/40':'bg-amber-800/50'}`}>{S.surface==='turf'?'🌱 잔디':'🟫 더트'}</span>
          <span className="px-1.5 py-0.5 rounded bg-white/10">주로 {S.going}</span>
          <span className="px-1.5 py-0.5 rounded bg-white/10">{({'맑음':'☀️','흐림':'☁️','비':'🌧️','노을':'🌇','야간':'🌙'})[S.weather]} {S.weather==='야간'?'나이트':S.weather}</span>
          <span className="px-1.5 py-0.5 rounded bg-white/10">{S.horses.length}두</span>
        </div>
        {history.length>0 && <div className="flex items-center gap-1 mt-1.5 overflow-x-auto no-scrollbar text-[11px] text-blue-200/80">
          <span className="shrink-0">최근</span>
          {history.slice(0,8).map((h,i)=><span key={i} className="shrink-0 px-1.5 rounded bg-black/30 font-bold">{h[0]}-{h[1]}</span>)}
        </div>}
      </div>

      {daily && <DailyPanel daily={daily} setDaily={setDaily} onReward={n=>onCredit(n)}/>}
      {/* 메뉴: 커피 이벤트 / 내 구단 / 퀴즈 */}
      <div className="grid grid-cols-3 gap-1.5 mt-2">
        <button onClick={()=>{Sound.init();Sound.click();onEvent();}} className="rounded-xl py-2 bg-gradient-to-b from-emerald-600 to-teal-800 text-[12.5px] font-black leading-tight">{evLabel?evLabel[0]:'☕ 커피 이벤트'}<div className="text-[9.5px] font-bold opacity-80 truncate px-1">{evLabel?evLabel[1]:'3만·5만 CR 교환'}</div></button>
        <button onClick={()=>{Sound.init();Sound.click();onOwner();}} className="rounded-xl py-2 bg-gradient-to-b from-amber-500 to-orange-700 text-[12.5px] font-black leading-tight">🏇 내 구단<div className="text-[9.5px] font-bold opacity-80">{(barn&&barn.horses.length)?(barn.lastPay!==todayKey()?`💰 수익 ${fmt(barnDaily(barn))} 받기!`:`🐎 ${barn.horses.length+(stable?1:0)}마리 · WP ${barnWP(barn)}`):stable?`👑 ${stable.name}`:'구단주 되기 · 말 시장'}</div></button>
        <button onClick={()=>{Sound.init();Sound.click();onQuiz();}} className="rounded-xl py-2 bg-gradient-to-b from-fuchsia-500 to-purple-700 text-[12.5px] font-black leading-tight">🧠 퀴즈<div className="text-[9.5px] font-bold opacity-80">오늘 {fmtN(quizToday())}/5,000</div></button>
      </div>
      {/* 탭: 출전표 / 마권 구매 */}
      <div className="sticky top-[52px] z-20 mt-2 -mx-3 px-3 py-1.5 bg-[#070d1f]/90 backdrop-blur">
        <div className="grid grid-cols-2 gap-1 p-1 rounded-2xl bg-white/5">
          <button onClick={()=>{Sound.init();Sound.click();setTab('card');}} className={`py-2.5 rounded-xl font-black text-[15px] ${tab==='card'?'bg-gradient-to-b from-sky-500 to-blue-700 text-white shadow':'text-blue-200'}`}>📋 출전표</button>
          <button onClick={()=>{Sound.init();Sound.click();setTab('bet');}} className={`py-2.5 rounded-xl font-black text-[15px] ${tab==='bet'?'bg-gradient-to-b from-amber-400 to-orange-600 text-black shadow':'text-blue-200'}`}>🎫 마권 구매{bets.length?` (${bets.length})`:''}</button>
        </div>
      </div>

      {tab==='card' && <div className="mt-1">
        <div className="flex items-center justify-between mb-2 px-1 text-[11px] text-blue-200/75">
          <span>👆 말을 누르면 마권 구매로 넘어가요</span><span>◎본명 ○대항 ▲단혈 △연하</span>
        </div>
        <div className="grid gap-2.5">
          {S.horses.map(h=><HorseCard key={h.no} h={h} setup={S} type={type} selected={false} onPick={goBet}/>)}
        </div>
      </div>}

      {tab==='bet' && <div className="mt-1 space-y-2.5">
        <div className="glass rounded-2xl p-3">
          <div className="grid grid-cols-3 gap-1.5">
            {Object.entries(TYPE_INFO).map(([k,v])=>(
              <button key={k} onClick={()=>changeType(k)} className={`rounded-xl py-2 px-1 font-black text-sm ${type===k?`bg-gradient-to-b ${v.color} text-white shadow-lg`:'bg-white/10 text-blue-100'}`}>
                {v.label}<div className="text-[9px] font-bold opacity-80">{v.en}</div>
              </button>))}
          </div>
          <p className="text-[12px] text-blue-200/80 mt-1.5">{TYPE_INFO[type].desc}{type==='QUIN'&&' · 최대 50배 이상 잭팟!'}</p>
          {type!=='QUIN' && <div className="grid grid-cols-2 gap-1.5 mt-2">
            {S.horses.map(h=>{ const on=sel.includes(h.no), od=type==='PLACE'?S.odds.place[h.no]:S.odds.win[h.no], ci=COND_INFO[h.cond];
              return <button key={h.no} onClick={()=>pickHorse(h.no)} className={`flex items-center gap-1.5 rounded-xl px-2 py-2 text-left ${on?'bg-yellow-300 text-black':'bg-white/10'}`}>
                <NumBadge no={h.no} size={26}/>
                <div className="min-w-0 flex-1"><div className="font-bold text-[13px] leading-tight truncate">{h.name}</div><div className="text-[10px] opacity-75">{h.style} · <span style={{color:on?undefined:ci.c}}>{ci.a}{ci.t}</span></div></div>
                <div className="font-black text-[13px]">{od.toFixed(1)}</div>
              </button>; })}
          </div>}
          {type==='QUIN' && <div className="mt-2 rounded-xl bg-black/25 p-1.5"><div className="text-[11px] text-blue-200/80 mb-1 px-1">복승 배당표 — 두 말이 만나는 칸을 누르세요</div><QuinMatrix setup={S} sel={sel} onPair={(a,b)=>{Sound.init();Sound.click();setSel([a,b]);}}/></div>}
          <div className="mt-2 flex items-center gap-2 rounded-xl bg-black/30 p-2 min-h-[48px]">
            <span className="text-xs text-blue-200/80">선택</span>
            {sel.length?sel.map(n=><span key={n} className="flex items-center gap-1"><NumBadge no={n} size={26}/><span className="text-[12px] font-bold">{S.horses.find(h=>h.no===n).name}</span></span>):<span className="text-sm text-blue-200/50">말을 골라 주세요</span>}
            {curOdds && <span className="ml-auto font-black text-xl text-yellow-300">{curOdds.toFixed(1)}<span className="text-xs">배</span></span>}
          </div>
          <div className="grid grid-cols-5 gap-1.5 mt-2">
            {[MIN_BET,50,100,500].map(v=><button key={v} onClick={()=>{Sound.init();Sound.click();setAmt(v);}} className={`rounded-lg py-2 text-sm font-black ${amt===v?'bg-yellow-400 text-black':'bg-white/10'}`}>{v}</button>)}

          </div>
          {curOdds && <div className="text-xs text-center text-blue-200/80 mt-1.5">적중 시 예상 환급 <b className="text-yellow-300">{fmt(amt*curOdds)}</b> CR</div>}

        </div>
        <div className="glass rounded-2xl p-3">
          <div className="flex items-center justify-between"><h3 className="fx-title text-base">🧾 내 마권</h3><span className="text-sm">합계 <b className="text-yellow-300">{fmt(total)}</b> CR</span></div>
          {bets.length===0 ? <p className="text-[13px] text-blue-200/60 mt-1">마권을 1장 이상 사야 출주할 수 있어요. (1장 최소 {MIN_BET} CR)</p> :
            <div className="mt-2 space-y-1.5">
              {bets.map(b=>(

/* ---------------- 코인 레인 ---------------- */
function CoinRain({big}){
  const ref=useRef(null);
  useEffect(()=>{
    const c=ref.current; const ctx=c.getContext('2d'); let raf, alive=true;
    const resize=()=>{ c.width=window.innerWidth; c.height=window.innerHeight; }; resize();
    const N=big?160:70; const coins=[];
    for(let i=0;i<N;i++) coins.push({x:Math.random()*c.width,y:-Math.random()*c.height*1.2,v:3+Math.random()*5,r:8+Math.random()*10,a:Math.random()*6,va:0.1+Math.random()*0.2});
    const loop=()=>{ if(!alive) return; ctx.clearRect(0,0,c.width,c.height);
      for(const k of coins){ k.y+=k.v; k.a+=k.va; if(k.y>c.height+30){ k.y=-30; k.x=Math.random()*c.width; }
        const sx=Math.abs(Math.cos(k.a));
        ctx.save(); ctx.translate(k.x,k.y); ctx.scale(Math.max(0.15,sx),1);
        const g=ctx.createRadialGradient(-k.r*0.3,-k.r*0.3,1,0,0,k.r); g.addColorStop(0,'#fff6c8'); g.addColorStop(0.5,'#ffd43b'); g.addColorStop(1,'#d08700');
        ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,k.r,0,6.283); ctx.fill();
        ctx.strokeStyle='#a86b00'; ctx.lineWidth=2; ctx.stroke();
        ctx.fillStyle='#a86b00'; ctx.font=`700 ${k.r}px sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('C',0,1);
        ctx.restore(); }
      raf=requestAnimationFrame(loop); };
    loop(); window.addEventListener('resize',resize);
    return ()=>{ alive=false; cancelAnimationFrame(raf); window.removeEventListener('resize',resize); };
  },[]);
  return <canvas ref={ref} className="fixed inset-0 pointer-events-none z-50"/>;
}

const rint=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function mkOpts(ans,wrongs){ const set=[String(ans)]; for(const w of wrongs){ const s=String(w); if(!set.includes(s)) set.push(s); if(set.length>=4) break; } return shuffle(set); }
function numWrongs(ans,spread){ const out=[]; let g=0; while(out.length<6&&g<50){ g++; const d=rint(1,spread)*(Math.random()<0.5?-1:1); const v=ans+d; if(v!==ans&&v>=0&&!out.includes(v)) out.push(v);} return out; }
function genQuestion(setup){
  const t=pickW(['arith','pay','seq','pct','time','race','race2'],[3,2,2,1.5,1,1.5,1.5]);
  if(t==='arith'){ const a=rint(12,49),b=rint(3,9),c=rint(10,99); const ans=a*b+c;
    return {q:`${a} × ${b} + ${c} = ?`,a:String(ans),o:mkOpts(ans,numWrongs(ans,12)),ex:`${a}×${b}=${a*b}, 여기에 ${c}을 더하면 ${ans}`}; }
  if(t==='pay'){ const amt=pick([100,200,300,500]), od=rint(12,95)/10; const ans=Math.round(amt*od);
    return {q:`단승 배당 ${od.toFixed(1)}배인 말에 ${amt} CREDIT을 걸어 적중! 받는 금액은?`,a:fmtN(ans),o:mkOpts(fmtN(ans),numWrongs(ans,Math.max(20,Math.round(ans*0.3))).map(v=>fmtN(Math.round(v/10)*10||v))),ex:`${amt} × ${od.toFixed(1)} = ${fmtN(ans)}`}; }
  if(t==='seq'){ if(Math.random()<0.5){ const s=rint(2,20),d=rint(3,13); const arr=[0,1,2,3].map(i=>s+d*i); const ans=s+d*4;
      return {q:`규칙을 찾아 빈칸을 채우세요: ${arr.join(', ')}, ?`,a:String(ans),o:mkOpts(ans,numWrongs(ans,d)),ex:`${d}씩 커지므로 ${arr[3]}+${d}=${ans}`}; }
    const s=rint(1,5),r=pick([2,3]); const arr=[0,1,2,3].map(i=>s*Math.pow(r,i)); const ans=s*Math.pow(r,4);
    return {q:`규칙을 찾아 빈칸을 채우세요: ${arr.join(', ')}, ?`,a:String(ans),o:mkOpts(ans,[ans-arr[3],ans+arr[3],arr[3]*2+r,ans+r]),ex:`${r}배씩 커지므로 ${arr[3]}×${r}=${ans}`}; }
  if(t==='pct'){ const base=pick([200,400,600,800,1200,1500,2000,3000]), p=pick([10,15,20,25,30,40,50]); const ans=base*p/100;
    return {q:`${fmtN(base)}의 ${p}%는?`,a:fmtN(ans),o:mkOpts(fmtN(ans),[base*(p+10)/100,base*(p-5)/100,ans*2,ans+50].map(fmtN)),ex:`${fmtN(base)} × ${p/100} = ${fmtN(ans)}`}; }
  if(t==='time'){ const m=rint(1,3),s=rint(5,55); const ans=m*60+s;
    return {q:`경주 기록 ${m}분 ${s}초는 모두 몇 초일까?`,a:`${ans}초`,o:mkOpts(`${ans}초`,[`${m*100+s}초`,`${ans+10}초`,`${ans-10}초`,`${(m+1)*60+s}초`]),ex:`${m}분=${m*60}초, ${m*60}+${s}=${ans}초`}; }
  const hs=setup?setup.horses:null;
  if(hs && t==='race'){ const fav=hs.slice().sort((a,b)=>setup.odds.win[a.no]-setup.odds.win[b.no])[0];
    return {q:`이번 경주 예상지에서 단승 배당이 가장 낮은 1인기 말은?`,a:fav.name,o:mkOpts(fav.name,shuffle(hs.filter(h=>h!==fav).map(h=>h.name))),ex:`${fav.no}번 ${fav.name} — 단승 ${setup.odds.win[fav.no].toFixed(1)}배`}; }
  if(hs){ const h=pick(hs);
    if(Math.random()<0.5) return {q:`이번 경주 ${h.no}번 ${h.name}의 각질은?`,a:h.style,o:mkOpts(h.style,shuffle(['도주','선행','선입','추입'].filter(x=>x!==h.style))),ex:`예상지에 ${h.name}은(는) '${h.style}'으로 표시돼 있어요.`};
    return {q:`이번 경주 ${h.name}에 기승하는 기수는?`,a:h.jockey,o:mkOpts(h.jockey,shuffle(hs.filter(x=>x!==h).map(x=>x.jockey))),ex:`${h.no}번 ${h.name} — 기수 ${h.jockey}`}; }
  return genQuestion(null);
}
function fmtN(n){ return Math.round(n).toLocaleString(); }
function nextQuestion(setup){
  if(Math.random()<0.5){
    let used=ls.get('sd_quiz_used',[]); if(used.length>=QUIZ_BANK.length) used=[];
    const free=QUIZ_BANK.map((_,i)=>i).filter(i=>!used.includes(i)); const i=pick(free);
    used.push(i); ls.set('sd_quiz_used',used);
    const [q,a,w,ex]=QUIZ_BANK[i]; return {q,a,o:shuffle([a,...w]),ex,cat:'상식'};
  }
  return {...genQuestion(setup),cat:'두뇌'};
}

    const t=setTimeout(()=>setTime(x=>x-1),1000); return ()=>clearTimeout(t); },[time,picked]);

function VoiceTest({onClose}){
  const [,force]=useState(0);
  useEffect(()=>{ const t=setInterval(()=>force(x=>x+1),400); return ()=>clearInterval(t); },[]);
  const ko=Voice.list();
  const tryVoice=v=>{ Sound.init(); Sound.muted=false; Voice.on=true;
    try{ const u=new SpeechSynthesisUtterance(v?`${v.name} 목소리로 말합니다. 들리시나요?`:'기본 목소리로 말합니다. 들리시나요?'); u.lang='ko-KR'; if(v) u.voice=v;
      u.onstart=()=>Voice.L('[테스트] ▶ 소리 시작'); u.onend=()=>Voice.L('[테스트] ■ 끝'); u.onerror=e=>Voice.L('[테스트] ✖ '+(e&&e.error||'오류'));
      Voice.L('[테스트] 말하기: '+(v?v.name:'기본')); speechSynthesis.speak(u); }catch(e){ Voice.L('[테스트] 예외 '+e.message); } };
  const use=v=>{ if(v){ Voice.noVoice=false; try{ localStorage.removeItem('sd_vnov'); localStorage.setItem('sd_voice',v.name); }catch(e){} Voice.v=v; Voice.male=MALE_RE.test(v.name); }
    else { Voice.noVoice=true; try{ localStorage.setItem('sd_vnov','1'); }catch(e){} } Sound.coin(); };
  let flags=''; try{ flags=`speaking=${speechSynthesis.speaking} pending=${speechSynthesis.pending} paused=${speechSynthesis.paused}`; }catch(e){ flags='speechSynthesis 없음'; }
  return (
    <div className="fixed inset-0 overflow-y-auto" style={{zIndex:80,background:"rgba(0,0,0,0.92)"}} onClick={onClose}>
      <div className="max-w-md mx-auto p-3 pt-6" onClick={e=>e.stopPropagation()}>
        <div className="glass rounded-3xl p-4">
          <div className="flex items-center"><div className="fx-title text-xl gold">🎙️ 아나운서 소리 점검</div><button onClick={onClose} className="ml-auto w-9 h-9 rounded-full bg-white/10 text-xl">×</button></div>
          <p className="text-[12px] text-blue-100/85 mt-1">아래 버튼을 하나씩 눌러 보고, <b>들리는 목소리의 [이걸로 사용]</b>을 눌러 주세요.</p>
          <div className="mt-2 space-y-1.5">
            <div className="flex gap-1.5 items-center rounded-xl bg-white/5 p-2"><span className="flex-1 text-[13px] font-bold">기본 목소리 (자동)</span>
              <button onClick={()=>tryVoice(null)} className="px-2.5 py-1.5 rounded-lg bg-sky-500 text-[12px] font-black">▶ 듣기</button>
              <button onClick={()=>use(null)} className={`px-2.5 py-1.5 rounded-lg text-[12px] font-black ${Voice.noVoice?'bg-yellow-300 text-black':'bg-white/10'}`}>{Voice.noVoice?'✓ 사용 중':'이걸로 사용'}</button></div>
            {ko.map(v=><div key={v.name+v.voiceURI} className="flex gap-1.5 items-center rounded-xl bg-white/5 p-2"><span className="flex-1 text-[12.5px] font-bold truncate">{v.name}{MALE_RE.test(v.name)?' (남)':''}{v.localService===false?' ☁️':''}</span>
              <button onClick={()=>tryVoice(v)} className="px-2.5 py-1.5 rounded-lg bg-sky-500 text-[12px] font-black">▶ 듣기</button>
              <button onClick={()=>use(v)} className={`px-2.5 py-1.5 rounded-lg text-[12px] font-black ${!Voice.noVoice&&Voice.v&&Voice.v.name===v.name?'bg-yellow-300 text-black':'bg-white/10'}`}>{!Voice.noVoice&&Voice.v&&Voice.v.name===v.name?'✓ 사용 중':'이걸로 사용'}</button></div>)}
            {!ko.length && <div className="text-[12px] text-red-300">한국어 목소리를 찾지 못했어요. (설정 → 손쉬운 사용 → 읽기 및 말하기 → 음성 → 한국어)</div>}
          </div>
          <button onClick={()=>{ try{ speechSynthesis.cancel(); }catch(e){} Voice.stop(); Voice.L('엔진 초기화'); }} className="w-full mt-2 py-2 rounded-xl bg-white/10 text-[12px] font-bold">🔄 음성 엔진 초기화</button>
          <div className="mt-3 text-[11px] text-blue-200/80">상태: {flags} · 한국어 목소리 {ko.length}개 · 전체 {(()=>{ try{ return speechSynthesis.getVoices().length; }catch(e){ return 0; } })()}개</div>
          <div className="mt-1 rounded-xl bg-black/50 p-2 font-mono text-[10.5px] leading-snug max-h-56 overflow-y-auto">{Voice.log.slice().reverse().map((l,i)=><div key={i}>{l}</div>)}{!Voice.log.length&&'기록 없음'}</div>
          <p className="mt-2 text-[11px] text-blue-200/70">안 되면 이 화면을 캡처해서 보내 주세요.</p>
        </div>
      </div>
    </div>);
}

function App(){

  const [muted,setMuted]=useState(false);
  const [quiz,setQuiz]=useState(false);
  const [stable,setStable]=useState(()=>ls.get('sd_stable',null));
  const [claims,setClaims]=useState(()=>ls.get('sd_claims',[]));
  const [vtest,setVtest]=useState(false);
  const [ev,setEv]=useState(()=>loadEv());
  const [barn,setBarn]=useState(()=>loadBarn());
  const [wpBonus,setWpBonus]=useState(0);
  useEffect(()=>ls.set('sd_barn',barn),[barn]);
  useEffect(()=>ls.set('sd_ev',ev),[ev]);
  const [modal,setModal]=useState(null);
  const [daily,setDaily]=useState(()=>loadDaily());
  const [attendMsg,setAttendMsg]=useState(null);
  useEffect(()=>ls.set('sd_daily',daily),[daily]);
  useEffect(()=>{ if(!daily.attend){ const y=new Date(Date.now()-864e5), yk=`${y.getFullYear()}-${y.getMonth()+1}-${y.getDate()}`;
      const streak=daily.last===yk?Math.min(7,(daily.streak||0)+1):1, rw=100+streak*100;   // 연속 출석할수록 보너스 (최대 7일째 800)
      setDaily(d=>({...d,attend:true,streak,last:todayKey()})); setCredit(c=>c+rw); setAttendMsg({streak,rw}); } },[]);
  const [ownerPrize,setOwnerPrize]=useState(0);
  useEffect(()=>ls.set('sd_stable',stable),[stable]);
  useEffect(()=>ls.set('sd_claims',claims),[claims]);
  const [stats,setStats]=useState(()=>ls.get('sd_stats',{streak:0,best:0,earned:0,hits:0,races:0}));
  const [bonus,setBonus]=useState(0);
  useEffect(()=>ls.set('sd_stats',stats),[stats]);
  useEffect(()=>{ setSetup(null); const t=setTimeout(()=>setSetup(makeRaceSetup(raceNo,ls.get('sd_stable',null),ls.get('sd_barn',null))),30); return ()=>clearTimeout(t); },[raceNo]);
  const reroll=b=>{ if(phase!=='paddock') return; setBets([]); setSetup(makeRaceSetup(raceNo,ls.get('sd_stable',null),b)); };
  useEffect(()=>ls.set('sd_credit',credit),[credit]);
  useEffect(()=>ls.set('sd_race',raceNo),[raceNo]);
  useEffect(()=>ls.set('sd_hist',history),[history]);
  useEffect(()=>{ Sound.setMuted(muted); if(muted) Voice.stop(); },[muted]);

  const start=(list)=>{ const L=Array.isArray(list)?list:bets; if(!L.length) return; const tt=L.reduce((s,b)=>s+b.amount,0); Sound.init(); Sound.setMuted(muted); Voice.kick(pick(['마권 접수 완료! 곧 출발합니다!','좋습니다, 마권 접수됐습니다! 출주 준비!','마권 확인! 경기장으로 갑니다!'])); if(Array.isArray(list)) setBets(L); setCredit(c=>c-tt); setPhase('race'); window.scrollTo(0,0); };
  const done=res=>{
    const o=res.order;
    const pays=bets.map(b=>{
      let hit=false;
      if(b.type==='WIN') hit=b.sel[0]===o[0];
      else if(b.type==='PLACE') hit=b.sel[0]===o[0]||b.sel[0]===o[1];
      else hit=quinKey(b.sel[0],b.sel[1])===quinKey(o[0],o[1]);
      return hit?Math.round(b.amount*b.odds):0;
    });
    const win=pays.reduce((s,p)=>s+p,0);
    const streak=win>0?stats.streak+1:0;
    const bn=win>0&&streak>=2?Math.round(win*Math.min(0.5,0.1*(streak-1))):0;   // 연속 적중 보너스 (2연속 10% ~ 최대 50%)
    setStats(st=>({streak, best:Math.max(st.best,streak), earned:st.earned+win+bn, hits:st.hits+(win>0?1:0), races:st.races+1}));
    setBonus(bn);
    const ownHit=setup.horses.find(h=>h.world); const ownWinAmt=ownHit?bets.reduce((s2,b,i)=>s2+((b.sel.includes(ownHit.no)&&pays[i]>0)?pays[i]:0),0):0;
    const wpb=(win>0?Math.round(win*barnWP(barn)/100):0)+Math.round(ownWinAmt*OWN_BET_BONUS); setWpBonus(wpb);
    const wh=setup.horses.find(h=>h.world); let wpz=0;
    if(wh){ const rk=o.indexOf(wh.no); wpz=worldPrize(rk,wh.world.grade)+appearFee(wh.world.grade);
      setBarn(B=>({...B,horses:B.horses.map(x=>x.id===wh.world.id?{...x,races:(x.races||0)+1,prize:(x.prize||0)+wpz,w:(x.w||[0,0,0]).map((v,i)=>i===rk?v+1:v)}:x)})); }
    const own=setup.horses.find(h=>h.owned&&!h.world); let op=0;
    if(own && stable && stable.name===own.name){ const rk=o.indexOf(own.no); op=rk<3?PRIZE[rk]:0;
      setStable(st=>st?({...st,care:false,races:st.races+1,prize:st.prize+op,w:st.w.map((v,i)=>i===rk?v+1:v)}):st); }
    op+=wpz; setOwnerPrize(op);
    setPayouts(pays); setResult(res); setCredit(c=>c+win+bn+op+wpb);
    setHistory(h=>[[o[0],o[1]],...h].slice(0,20));
    if(cupsOf(claims)>=COFFEE_MAX){ const spent=bets.reduce((s,b)=>s+b.amount,0), net=win+bn+op+wpb-spent;
      const isQ=bets.some((b,i)=>b.type==='QUIN'&&pays[i]>0), big=bets.some((b,i)=>pays[i]>0&&b.odds>=10), ownWin=!!((own&&stable&&stable.name===own.name&&o[0]===own.no)||(wh&&o[0]===wh.no)), vid=setup.venue&&setup.venue.id;
      setEv(e=>{ const p={...newProg(),...e.prog}; const cur=win>0?(p.cur||0)+1:0;
        return {...e,prog:{...p,races:p.races+1,profit:p.profit+net,quin:p.quin+(isQ?1:0),big:p.big+(big?1:0),own:p.own+(ownWin?1:0),cur,streak:Math.max(p.streak,cur),
          venues:(win>0&&vid&&!p.venues.includes(vid))?[...p.venues,vid]:p.venues}}; }); }
    setDaily(d=>({...d,races:d.races+1,hits:d.hits+(win>0?1:0),quin:d.quin+(bets.some((b,i)=>b.type==='QUIN'&&pays[i]>0)?1:0)}));
    setPhase('result');
    if(win>0){ const big=bets.some((b,i)=>pays[i]>0&&b.odds>=10); Sound.jackpot(big); }
    else if(bets.length) Sound.miss();
  };
  const next=()=>{ Sound.click(); setBets([]); setResult(null); setPayouts([]); setPhase('paddock'); setRaceNo(n=>n+1); window.scrollTo(0,0); };

  return (
    <div className="min-h-screen" style={{background:'radial-gradient(1200px 600px at 50% -200px,#1b2f6e 0%,#070d1f 60%)'}}>
      <header className="sticky top-0 z-20 backdrop-blur bg-[#070d1f]/80 border-b border-white/5">
        <div className="max-w-md mx-auto flex items-center gap-2 px-3 py-2 h-[52px]">
          <div className="fx-title text-[19px] leading-none whitespace-nowrap"><span className="gold">★ LINK</span> <span className="text-white">DERBY</span></div>
          
          <div className="ml-auto flex items-center gap-2">
            {Voice.ok && <button onClick={()=>{ Sound.init(); if(muted) setMuted(false); Sound.muted=false; Voice.on=true; Voice.kick('안녕하세요! 링크 더비 아나운서입니다. 소리 잘 들리시죠?'); setVtest(true); }} className="h-8 px-2 shrink-0 rounded-full bg-white/10 text-[11px] font-black whitespace-nowrap">🎙️ 테스트</button>}
            <button onClick={()=>{Sound.init(); setMuted(m=>!m);}} className="w-8 h-8 shrink-0 rounded-full bg-white/10 text-base">{muted?'🔇':'🔊'}</button>
            <div className="rounded-full bg-gradient-to-b from-yellow-300 to-amber-500 text-black px-2.5 py-1 font-black text-[13px] shadow whitespace-nowrap">💰 {fmt(credit)}</div>
          </div>
        </div>
      </header>
      {!setup ? <div className="text-center py-24"><div className="fx-title text-3xl gold animate-pulse">예상지 집계 중...</div><div className="text-blue-200/70 mt-2 text-sm">배당률 계산 중입니다</div></div> :
        phase==='paddock' ? <Paddock setup={setup} credit={credit} bets={bets} setBets={setBets} onStart={start} onQuiz={()=>setQuiz(true)} onEvent={()=>setModal('event')} evLabel={cupsOf(claims)>=COFFEE_MAX?(()=>{const se=seasonOf(ev); return [`${se.icon} 시즌 ${se.no}`,`${se.name} ${Math.min(seasonVal(ev,se),se.goal)>=se.goal?'✅':''}`];})():['☕ 커피 이벤트',cupsOf(claims)?`남은 1잔 · 2만 CR`:'3만·5만 CR 교환']} onOwner={()=>setModal('owner')} stable={stable} barn={barn} history={history} stats={stats} daily={daily} setDaily={setDaily} onCredit={n=>setCredit(c=>c+n)}/> :
        <RaceView key={setup.raceNo} setup={setup} bets={bets} onDone={done} onCheer={()=>setDaily(d=>({...d,cheer:(d.cheer||0)+1}))}/>}
      {attendMsg && <div className="fixed inset-0 z-[70] bg-black/70 flex items-center justify-center p-6" onClick={()=>setAttendMsg(null)}>
        <div className="glass rounded-3xl p-5 w-full max-w-xs text-center pop">
          <div className="text-5xl">📅</div>
          <div className="fx-title text-2xl gold mt-1">출석 {attendMsg.streak}일째!</div>
          <div className="text-[13px] text-blue-200/85 mt-1">오늘의 출석 보너스</div>
          <div className="text-3xl font-black text-yellow-300 mt-1">+{fmt(attendMsg.rw)} CR</div>
          <div className="flex justify-center gap-1 mt-3">{Array.from({length:7},(_,i)=><div key={i} className={`w-7 h-7 rounded-lg text-[11px] font-black flex items-center justify-center ${i<attendMsg.streak?'bg-yellow-300 text-black':'bg-white/10 text-white/40'}`}>{i+1}</div>)}</div>
          <p className="text-[11px] text-blue-200/70 mt-2">매일 접속하면 보너스가 커져요 (최대 7일째 800 CR)</p>
          <button onClick={()=>{Sound.init();Sound.coin();setAttendMsg(null);}} className="w-full mt-3 py-3 rounded-xl font-black bg-gradient-to-b from-yellow-300 to-orange-500 text-black">받기</button>
        </div>
      </div>}
      {vtest && <VoiceTest onClose={()=>setVtest(false)}/>}
      {quiz && setup && <QuizModal setup={setup} onClose={()=>setQuiz(false)} onReward={n=>setCredit(c=>c+n)}/>}
      {phase==='result' && result && <ResultModal setup={setup} result={result} bets={bets} payouts={payouts} bonus={bonus} streak={stats.streak} ownerPrize={ownerPrize} wpBonus={wpBonus} onNext={next}/>}
      {modal==='event' && <EventModal credit={credit} claims={claims} ev={ev} onClose={()=>setModal(null)} onClaim={c=>{ setCredit(x=>x-c.cr); setClaims(L=>[c,...L]); if(cupsOf(claims)+c.cups>=COFFEE_MAX) setEv(e=>({...e,prog:newProg()})); }} onSeasonClear={b=>{ setCredit(x=>x+b.rw); setEv(e=>({s:e.s+1,prog:newProg(),badges:[...e.badges,b]})); }}/>}
      {modal==='owner' && <OwnerModal credit={credit} stable={stable} setStable={setStable} spend={n=>setCredit(x=>x-n)} onClose={()=>setModal(null)} barn={barn} setBarn={b=>{ setBarn(b); if(b.entry!==barn.entry) reroll(b); }}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
