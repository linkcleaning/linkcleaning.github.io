name: 인스타 영업비서 - 제주 신규 타겟 수집

on:
  schedule:
    - cron: "17 21 * * *"   # 매일 오전 6:17 (한국시간)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/insta_leads.py"
      - ".github/workflows/insta-leads.yml"

permissions:
  contents: write

concurrency:
  group: insta-leads
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 공공데이터 수집
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python .github/scripts/insta_leads.py
      - name: 결과 저장
        run: |
          git config user.name "linkclean-bot"
          git config user.email "linkclean-bot@users.noreply.github.com"
          git add insta/leads.json
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "인스타 영업비서: 신규 타겟 갱신 $(TZ=Asia/Seoul date +%F)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 5; done
