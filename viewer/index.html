<!DOCTYPE html>
<html lang="ko">
<head>

<!-- 글꼴 · Tailwind · JSZip (모두 CDN, 서비스워커가 한 번 받은 뒤 오프라인용으로 보관) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/variable/woff2/SUIT-Variable.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">

<script>

    theme: { extend: {
      colors: {
        ink: '#111214', panel: '#1A1C1F', line: '#2A2D31', mute: '#8E9196', paper: '#ECE8E1',

  };
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" defer></script>

<!-- 앱 아이콘 + manifest.json 을 파일 하나 안에서 만들어 붙임 -->
<script>
(function () {
  function icon(size) {
    var c = document.createElement('canvas'); c.width = c.height = size;
    var x = c.getContext('2d'), s = size / 512;
    x.fillStyle = '#0E3B40'; x.fillRect(0, 0, size, size);
    x.fillStyle = '#ECE8E1';
    x.fillRect(108 * s, 124 * s, 138 * s, 268 * s);                       // 왼쪽 페이지
    x.beginPath(); x.moveTo(266 * s, 124 * s); x.lineTo(356 * s, 124 * s); // 오른쪽 페이지 (모서리 접힘)
    x.lineTo(404 * s, 172 * s); x.lineTo(404 * s, 392 * s); x.lineTo(266 * s, 392 * s); x.closePath(); x.fill();
    x.fillStyle = '#F2994A';
    x.beginPath(); x.moveTo(356 * s, 124 * s); x.lineTo(356 * s, 172 * s); x.lineTo(404 * s, 172 * s); x.closePath(); x.fill();
    x.strokeStyle = '#0E3B40'; x.lineWidth = 9 * s;                         // 만화 칸
    x.strokeRect(128 * s, 146 * s, 98 * s, 96 * s); x.strokeRect(128 * s, 262 * s, 98 * s, 108 * s);
    x.strokeRect(286 * s, 196 * s, 98 * s, 174 * s);
    x.fillStyle = '#6CC24A'; x.beginPath(); x.arc(256 * s, 432 * s, 12 * s, 0, Math.PI * 2); x.fill();
    return c.toDataURL('image/png');
  }
  try {
    var i512 = icon(512), i192 = icon(192), i180 = icon(180);
    var here = location.href.split('#')[0].split('?')[0];
    var scope = new URL('./', here).href;
    var manifest = {
      name: '넘김 - 미니멀 만화 뷰어', short_name: '넘김', lang: 'ko',
      start_url: here, scope: scope, id: scope, display: 'standalone', orientation: 'any',
      background_color: '#F4F1EA', theme_color: '#0B3B40',
      icons: [
        { src: i192, sizes: '192x192', type: 'image/png', purpose: 'any maskable' },
        { src: i512, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }
      ]
    };
    var add = function (rel, href) { var l = document.createElement('link'); l.rel = rel; l.href = href; document.head.appendChild(l); };
    add('manifest', 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifest)));
    add('apple-touch-icon', i180);
    add('icon', i192);
  } catch (e) {}
})();
</script>

<style>
  :root { --bg:#111214; --bar:rgba(20,21,24,.93); --teal:#1C7C80; --orange:#F2994A; --leaf:#6CC24A; --mute:#8E9196; --line:#2A2D31; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:var(--bg); color:#ECE8E1; font-family:"SUIT Variable",SUIT,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; }
  button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
  button:focus:not(:focus-visible) { outline:none; }
  .hidden { display:none !important; }

  body.reading #lib { display:none; }
  body:not(.reading) #reader { display:none; }
  body.reading { overflow:hidden; overscroll-behavior:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }

  /* ---------- 뷰어: 3장 슬롯(이전·현재·다음)이 나란히 놓인 띠를 손가락으로 끌어 넘김 ---------- */
  #stage { position:fixed; inset:0; background:var(--bg); overflow:hidden; touch-action:none; }
  #stage.fit-width { touch-action:pan-y; }
  #strip { position:absolute; inset:0; will-change:transform; }
  .slot { position:absolute; inset:0; overflow:hidden; }
  .fit-width .slot { overflow-x:hidden; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; }
  #stage.zoomed, #stage.zoomed .slot { touch-action:none; overflow:hidden; }
  .wrap { display:flex; justify-content:center; align-items:center; width:100%; min-height:100%; transform-origin:0 0; }
  .wrap.rtl { flex-direction:row-reverse; }
  .wrap.ease { transition:transform .22s ease; }
  .fit-height .wrap { height:100%; }
  .fit-height .pg { height:100%; width:auto; max-width:calc(100% / var(--n,1)); object-fit:contain; }
  .fit-width .wrap { align-items:flex-start; }
  .fit-width .pg { width:calc(100% / var(--n,1)); height:auto; }
  .pg { display:block; flex:0 1 auto; min-width:0; -webkit-user-drag:none; pointer-events:none; }
  #dim { position:fixed; inset:0; background:#000; opacity:0; pointer-events:none; z-index:10; transition:opacity .15s; }

  .bar { position:fixed; left:0; right:0; z-index:20; background:var(--bar); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); transition:transform .22s ease, opacity .22s ease; }
  #top { top:0; padding-top:env(safe-area-inset-top); border-bottom:1px solid rgba(255,255,255,.05); }
  #bottom { bottom:0; padding-bottom:max(env(safe-area-inset-bottom), 6px); border-top:1px solid rgba(255,255,255,.05); }
  body.hide-bars #top { transform:translateY(-100%); opacity:0; pointer-events:none; }
  body.hide-bars #bottom { transform:translateY(100%); opacity:0; pointer-events:none; }

  .tool { display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 4px; min-width:56px; border-radius:12px; color:#C9C6C0; font-size:10.5px; letter-spacing:-.01em; }
  .tool svg { width:22px; height:22px; }
  .tool.on { color:var(--orange); }
  .tool:active { background:rgba(255,255,255,.06); }

  input[type=range] { -webkit-appearance:none; appearance:none; width:100%; height:28px; background:transparent; }
  input[type=range]::-webkit-slider-runnable-track { height:4px; border-radius:4px; background:linear-gradient(to right, var(--teal) var(--p,0%), #33363B var(--p,0%)); }
  input[type=range].rtl::-webkit-slider-runnable-track { background:linear-gradient(to left, var(--teal) var(--p,0%), #33363B var(--p,0%)); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:20px; height:20px; margin-top:-8px; border-radius:50%; background:var(--orange); border:3px solid #1A1C1F; }
  input[type=range]::-moz-range-track { height:4px; border-radius:4px; background:#33363B; }
  input[type=range]::-moz-range-progress { height:4px; border-radius:4px; background:var(--teal); }
  input[type=range]::-moz-range-thumb { width:16px; height:16px; border-radius:50%; background:var(--orange); border:3px solid #1A1C1F; }
  input[type=range].rtl { direction:rtl; }

  #seek { position:absolute; bottom:100%; margin-bottom:10px; transform:translateX(-50%); width:92px; pointer-events:none; }
  #seek .ph { aspect-ratio:2/3; border-radius:10px; overflow:hidden; background:#202327; border:2px solid var(--orange); box-shadow:0 10px 30px rgba(0,0,0,.6); }
  #seek img { width:100%; height:100%; object-fit:cover; }

  .pop { position:fixed; left:50%; transform:translateX(-50%); z-index:22; width:min(360px, calc(100% - 24px)); bottom:calc(122px + env(safe-area-inset-bottom)); }
  .seg { display:flex; background:#111214; border-radius:11px; padding:3px; }
  .seg button { flex:1; padding:8px 0; border-radius:8px; font-size:13px; color:var(--mute); }
  .seg button.on { background:#2A2D31; color:#ECE8E1; font-weight:700; }
  .sw { width:44px; height:26px; border-radius:13px; background:#33363B; position:relative; transition:background .2s; flex:none; }
  .sw::after { content:''; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:#ECE8E1; transition:transform .2s; }
  .sw.on { background:var(--teal); }
  .sw.on::after { transform:translateX(18px); }

  #scrim { position:fixed; inset:0; z-index:25; background:rgba(0,0,0,.45); opacity:0; pointer-events:none; transition:opacity .2s; }
  #scrim.open { opacity:1; pointer-events:auto; }
  #drawer { position:fixed; left:0; right:0; bottom:0; z-index:30; height:min(64dvh, 640px); transform:translateY(102%); transition:transform .25s cubic-bezier(.2,.8,.2,1); padding-bottom:env(safe-area-inset-bottom); }
  #drawer.open { transform:none; }
  #grid { overscroll-behavior:contain; -webkit-overflow-scrolling:touch; }
  .th { position:relative; aspect-ratio:2/3; border-radius:10px; overflow:hidden; background:#202327; outline:2px solid transparent; outline-offset:2px; }
  .th img { width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity .2s; }
  .th img.ok { opacity:1; }
  .th span { position:absolute; left:6px; bottom:5px; font-size:11px; font-weight:700; padding:1px 6px; border-radius:7px; background:rgba(0,0,0,.65); }
  .th.cur { outline-color:var(--orange); }

  #toast { position:fixed; left:50%; top:calc(env(safe-area-inset-top) + 70px); transform:translate(-50%, -10px); z-index:60; opacity:0; pointer-events:none; transition:all .2s; }
  #toast.show { opacity:1; transform:translate(-50%, 0); }
  #loading { position:fixed; inset:0; z-index:70; background:rgba(17,18,20,.82); display:flex; align-items:center; justify-content:center; flex-direction:column; gap:14px; }
  .spin { width:34px; height:34px; border-radius:50%; border:3px solid #33363B; border-top-color:var(--orange); animation:sp 0.8s linear infinite; }
  @keyframes sp { to { transform:rotate(360deg); } }
  body.dragging #dropHint { opacity:1; }
  #dropHint { position:fixed; inset:10px; z-index:80; border:2px dashed var(--orange); border-radius:24px; background:rgba(17,18,20,.85); display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:700; opacity:0; pointer-events:none; transition:opacity .15s; }
  .card-cover { aspect-ratio:3/4; background:#202327; }
  .badge { position:absolute; left:7px; top:7px; font-size:10px; font-weight:800; letter-spacing:.04em; padding:2px 7px; border-radius:7px; }
  #ver { position:fixed; left:5px; bottom:2px; font:500 9px/1 system-ui,-apple-system,sans-serif; color:#888; opacity:.45; pointer-events:none; z-index:2147483647; letter-spacing:.02em; user-select:none; -webkit-user-select:none; }

  /* ---------- 서재 (밝은 화면 · 링크 앱 스타일 가이드) ---------- */
  body:not(.reading) { background:#F4F1EA; }
  #lib { --s100:#F4F1EA; --card:#fff; --brand:#0E5A60; --deep:#0B3B40; --tint:#DCEDEB; --acc:#D9691F; --leafL:#3F8F2E; --ink:#14262A; --muted:#56676A; --lineL:#E2DBCD;
         min-height:100vh; background:var(--s100); color:var(--ink); font-family:"IBM Plex Sans KR","SUIT Variable","Apple SD Gothic Neo",system-ui,sans-serif; padding-bottom:calc(env(safe-area-inset-bottom) + 24px); }
  #libHead { position:sticky; top:0; z-index:15; background:var(--deep); color:#fff; padding-top:env(safe-area-inset-top); box-shadow:0 1px 0 rgba(0,0,0,.08); }
  .lh-in { max-width:1080px; margin:0 auto; height:56px; padding:0 12px 0 14px; display:flex; align-items:center; gap:10px; }
  .lh-logo { width:30px; height:30px; border-radius:9px; }
  .lh-title { font-size:20px; line-height:28px; font-weight:700; letter-spacing:-.02em; flex:1; }
  .lh-usage { font-size:12px; opacity:.7; }
  .lh-add { width:38px; height:38px; border-radius:999px; background:#F2964F; color:var(--ink); display:grid; place-items:center; }
  .lh-add svg { width:20px; height:20px; }
  .lh-add:active { transform:scale(.94); }
  #addMenu { position:absolute; right:12px; top:calc(env(safe-area-inset-top) + 54px); background:#fff; color:var(--ink); border-radius:14px; box-shadow:0 12px 34px rgba(11,59,64,.22); overflow:hidden; min-width:220px; }
  #addMenu button { display:block; width:100%; text-align:left; padding:13px 16px; }
  #addMenu button + button { border-top:1px solid var(--lineL); }
  #addMenu b { display:block; font-size:15px; }
  #addMenu span { font-size:12px; color:var(--muted); }
  .lb { max-width:1080px; margin:0 auto; padding:12px; }
  #lib .card { background:var(--card); border-radius:14px; }
  .hero { width:100%; display:flex; gap:14px; align-items:stretch; text-align:left; background:var(--brand); color:#fff; border-radius:22px; padding:18px; min-height:150px; }
  .hero:active { transform:scale(.99); }
  .hero-txt { flex:1; min-width:0; display:flex; flex-direction:column; }
  #lib .lab { font-size:12px; line-height:16px; font-weight:600; }
  .hero .lab { opacity:.85; }
  .hero-name { font-size:15px; font-weight:700; margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hero-num { font-family:"Black Han Sans","IBM Plex Sans KR",sans-serif; font-size:48px; line-height:52px; margin-top:auto; padding-top:8px; }
  .u { font-family:"IBM Plex Sans KR",sans-serif; font-size:13px; font-weight:500; margin-left:4px; }
  .hero-sub { font-size:13px; opacity:.85; }
  .hero-bar { height:5px; border-radius:999px; background:rgba(255,255,255,.22); margin-top:10px; overflow:hidden; }
  .hero-bar div { height:100%; background:#F2964F; border-radius:999px; }
  .hero-cover { width:86px; flex:none; border-radius:10px; overflow:hidden; background:rgba(255,255,255,.12); align-self:center; aspect-ratio:3/4; }
  .hero-cover img { width:100%; height:100%; object-fit:cover; display:block; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; }
  .act { text-align:left; padding:16px; display:flex; flex-direction:column; gap:2px; }
  .act svg { width:26px; height:26px; color:var(--acc); margin-bottom:10px; }
  .act b { font-size:15px; }
  .act span { font-size:12px; color:var(--muted); }
  .act:active { transform:scale(.98); }
  .sec { display:flex; align-items:center; justify-content:space-between; margin:24px 4px 10px; }
  .sec h2 { margin:0; font-size:17px; font-weight:700; }
  .sec h2 span { font-size:13px; font-weight:500; color:var(--muted); margin-left:2px; }
  .chip { font-size:12px; font-weight:600; padding:6px 12px; border-radius:999px; background:var(--tint); color:var(--ink); }
  .shelf { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; }
  @media (min-width:640px) { .shelf { grid-template-columns:repeat(4, 1fr); } }
  @media (min-width:900px) { .shelf { grid-template-columns:repeat(6, 1fr); } }
  .bk { position:relative; background:#fff; border-radius:14px; padding:6px 6px 10px; }
  .bk .open { display:block; width:100%; text-align:left; }
  .bk .open:active { transform:scale(.98); }
  .bk .cv { position:relative; aspect-ratio:3/4; border-radius:10px; overflow:hidden; background:#EDE8DE; }
  .bk .cv img { width:100%; height:100%; object-fit:cover; display:block; }
  .bk .pr { position:absolute; left:0; right:0; bottom:0; height:4px; background:rgba(0,0,0,.25); }
  .bk .pr div { height:100%; background:#F2964F; }
  .bk .nm { font-size:12.5px; font-weight:700; line-height:17px; margin:7px 2px 0; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; word-break:break-all; }
  .bk .pg2 { font-size:11px; color:var(--muted); margin:2px 2px 0; display:flex; align-items:center; gap:5px; }
  .bk .dot { width:7px; height:7px; border-radius:999px; flex:none; }
  .bk .del { position:absolute; top:10px; right:10px; width:24px; height:24px; border-radius:999px; background:rgba(20,38,42,.55); color:#fff; font-size:11px; display:grid; place-items:center; }
  .empty { padding:36px 16px; text-align:center; font-size:14px; line-height:22px; color:var(--muted); }
  .empty .pc { display:block; font-size:12px; margin-top:8px; }
  .tip { margin-top:24px; padding:14px 16px; font-size:13px; line-height:20px; color:var(--muted); }
  .tip b { color:var(--ink); }
  .to-top { position:fixed; right:16px; bottom:calc(env(safe-area-inset-bottom) + 18px); width:46px; height:46px; border-radius:999px; background:var(--deep); color:#fff; display:grid; place-items:center; box-shadow:0 8px 22px rgba(11,59,64,.3); opacity:0; transform:translateY(12px); pointer-events:none; transition:all .2s; z-index:14; }
  .to-top svg { width:22px; height:22px; }
  .to-top.show { opacity:1; transform:none; pointer-events:auto; }
</style>
</head>
<body class="antialiased">

<!-- ======================= 서재 화면 ======================= -->
<section id="lib">
  <header id="libHead">
    <div class="lh-in">
      <img id="logo" alt="" class="lh-logo">
      <div class="lh-title">넘김</div>
      <span id="usage" class="lh-usage"></span>
      <button id="btnAdd" class="lh-add" aria-label="책 넣기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
    <div id="addMenu" class="hidden">
      <button data-a="zip"><b>압축파일</b><span>ZIP · CBZ · 여러 권 한 번에</span></button>
      <button data-a="img"><b>이미지 여러 장</b><span>JPG · PNG · WebP</span></button>
    </div>
  </header>

  <main class="lb">
    <!-- 대표 카드: 이어서 보기 / 서재 요약 -->
    <button id="hero" class="hero">
      <div class="hero-txt">
        <div id="heroLab" class="lab"></div>
        <div id="heroName" class="hero-name"></div>
        <div class="hero-num"><span id="heroNum"></span><span id="heroUnit" class="u"></span></div>
        <div id="heroSub" class="hero-sub"></div>
        <div id="heroBarWrap" class="hero-bar"><div id="heroBar"></div></div>
      </div>
      <div id="heroCover" class="hero-cover"><img id="heroImg" alt=""></div>
    </button>

    <div class="two">
      <button id="btnZip" class="card act">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7.5 12 3l8 4.5v9L12 21l-8-4.5z"/><path d="M12 12v9M4 7.5l8 4.5 8-4.5"/></svg>
        <b>압축파일 열기</b><span>ZIP · CBZ · 여러 권</span>
      </button>
      <button id="btnImg" class="card act">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="14" height="14" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/><path d="m3 16 4-4 4 4 2-2 4 4"/></svg>
        <b>이미지 여러 장</b><span>JPG · PNG · WebP</span>
      </button>
    </div>

    <div class="sec">
      <h2>내 서재 <span id="libCount"></span></h2>
      <button id="btnSort" class="chip"></button>
    </div>
    <div id="books" class="shelf"></div>
    <div id="empty" class="hidden card empty">아직 열어 본 책이 없어요.<br>위 버튼으로 만화나 사진을 불러오세요.<span class="pc">PC에서는 파일을 이 창에 끌어다 놓아도 돼요.</span></div>

    <div id="iosTip" class="hidden card tip"><b>앱처럼 쓰기</b> · Safari 아래 <b>공유 버튼</b> → <b>홈 화면에 추가</b>를 누르면 주소창 없이 열려요.</div>
  </main>
  <button id="toTop" class="to-top" aria-label="맨 위로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 14 6-6 6 6"/></svg></button>
</section>

<!-- ======================= 뷰어 화면 ======================= -->
<section id="reader">
  <div id="stage" class="fit-height">
    <div id="strip">
      <div class="slot"><div class="wrap"></div></div>
      <div class="slot"><div class="wrap"></div></div>
      <div class="slot"><div class="wrap"></div></div>
    </div>

<!--
  서비스워커 코드 (오프라인 실행용)
  ─ 서비스워커는 브라우저 규칙상 HTML 안에 넣을 수 없고 '별도 주소의 JS 파일'이어야 합니다.
  ─ 그래서 이 HTML은 같은 폴더의 sw.js 를 등록합니다. 아래 내용을 그대로 sw.js 로 저장해 같은 폴더에 두면 됩니다.
    (linkcleaning.github.io/viewer/ 에는 이미 올려 두었습니다)
-->
<script type="text/plain" id="sw-source">
const CACHE = 'neomgim-v3';
const CORE = ['./', './index.html'];
const CDN = [
  'https://cdn.tailwindcss.com',
  'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js',
  'https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/variable/woff2/SUIT-Variable.css',
  'https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap'
];
self.addEventListener('install', e => {
  e.waitUntil(caches.open(CACHE).then(async c => {
    await c.addAll(CORE).catch(() => {});
    await Promise.all(CDN.map(u => fetch(new Request(u, { mode: 'no-cors' })).then(r => c.put(u, r)).catch(() => {})));
  }));
  self.skipWaiting();
});
self.addEventListener('activate', e => {
  e.waitUntil(caches.keys().then(ks => Promise.all(ks.filter(k => k.startsWith('neomgim-') && k !== CACHE).map(k => caches.delete(k)))));
  self.clients.claim();
});
self.addEventListener('fetch', e => {
  const req = e.request;
  if (req.method !== 'GET' || !req.url.startsWith('http')) return;
  if (req.mode === 'navigate') {            // 화면(HTML): 인터넷 먼저, 안 되면 저장본
    e.respondWith(fetch(req).then(r => { const cp = r.clone(); caches.open(CACHE).then(c => c.put('./index.html', cp)); return r; })
      .catch(() => caches.match('./index.html').then(r => r || caches.match('./'))));
    return;
  }
  e.respondWith(caches.open(CACHE).then(async c => {   // 나머지(CDN·글꼴): 저장본 먼저, 뒤에서 새로 받아 갱신
    const hit = await c.match(req);
    const net = fetch(req).then(r => { if (r && (r.ok || r.type === 'opaque')) c.put(req, r.clone()); return r; }).catch(() => hit);
    return hit || net;
  }));
});
</script>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const LS = 'neomgim.';
const MAX_BOOKS = 30;
const IMG_RE = /\.(jpe?g|png|webp|gif|avif|bmp)$/i;
const ARC_RE = /\.(zip|cbz)$/i;
const MIME = { jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', webp: 'image/webp', gif: 'image/gif', avif: 'image/avif', bmp: 'image/bmp' };
const collator = new Intl.Collator('ko', { numeric: true, sensitivity: 'base' });
const mimeOf = n => MIME[(n.split('.').pop() || '').toLowerCase()] || 'image/jpeg';
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ---------- 저장 (LocalStorage: 설정·읽던 페이지 / IndexedDB: 책 파일) ---------- */
const ls = {
  get(k, d) { try { const v = localStorage.getItem(LS + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(LS + k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(LS + k); } catch {} }
};
const settings = Object.assign({ spread: 'auto', fit: 'height', bright: 100, rtl: false, anim: 'slide', trim: false, cover: true, sort: 'recent' }, ls.get('settings', {}));
if (settings.spread === true) settings.spread = 'two'; else if (settings.spread === false) settings.spread = 'one';   // v1 설정 옮기기
const saveSettings = () => ls.set('settings', settings);
const meta = ls.get('meta', {});            // { [책id]: { pos, opened, done } }
const saveMeta = () => ls.set('meta', meta);

const DB = {
  db: null,
  open() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      const r = indexedDB.open('neomgim', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('books', { keyPath: 'id' });
      r.onsuccess = () => { this.db = r.result; res(r.result); };
      r.onerror = () => rej(r.error);
    });
  },
  async run(mode, fn) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const t = db.transaction('books', mode), q = fn(t.objectStore('books'));
      let out; if (q) q.onsuccess = () => { out = q.result; };
      t.oncomplete = () => res(out); t.onerror = t.onabort = () => rej(t.error);
    });
  },
  all() { return this.run('readonly', s => s.getAll()); },
  get(id) { return this.run('readonly', s => s.get(id)); },
  put(rec) { return this.run('readwrite', s => s.put(rec)); },
  del(id) { return this.run('readwrite', s => s.delete(id)); }
};

/* ---------- 공통 ---------- */
const setTheme = c => { const m = document.querySelector('meta[name=theme-color]'); if (m) m.content = c; };
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1700); }
function loading(on, msg) { $('#loading').classList.toggle('hidden', !on); if (msg) $('#loadMsg').textContent = msg; }
function hash(str) { let h = 5381; for (let i = 0; i < str.length; i++) h = (h * 33 ^ str.charCodeAt(i)) >>> 0; return h.toString(36); }
const stripExt = n => n.replace(/\.[^.]+$/, '');
async function loadImg(blob) { const url = URL.createObjectURL(blob); const im = new Image(); im.src = url; try { await im.decode(); } finally { URL.revokeObjectURL(url); } return im; }
const toBlob = (c, type, q) => new Promise(res => c.toBlob(res, type, q));

async function makeThumb(blob, w) {
  const im = await loadImg(blob);
  const r = Math.min(1, w / im.naturalWidth), c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(im.naturalWidth * r)); c.height = Math.max(1, Math.round(im.naturalHeight * r));
  c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
  return toBlob(c, 'image/jpeg', 0.78);
}

/* 여백 자동 자르기: 작게 줄인 그림에서 테두리 색과 다른 부분의 범위를 찾아 원본을 잘라냄 */
async function trimBlob(blob) {
  const im = await loadImg(blob);
  const W = im.naturalWidth, H = im.naturalHeight, sw = Math.min(240, W), sh = Math.max(1, Math.round(H * sw / W));
  const c = document.createElement('canvas'); c.width = sw; c.height = sh;
  const x = c.getContext('2d', { willReadFrequently: true }); x.drawImage(im, 0, 0, sw, sh);
  const d = x.getImageData(0, 0, sw, sh).data, lum = (px, py) => { const o = (py * sw + px) * 4; return d[o] * .3 + d[o + 1] * .59 + d[o + 2] * .11; };
  const corners = [lum(1, 1), lum(sw - 2, 1), lum(1, sh - 2), lum(sw - 2, sh - 2)];
  const bg = corners.reduce((a, b) => a + b) / 4;
  if (corners.some(v => Math.abs(v - bg) > 28)) return blob;                // 테두리가 한 가지 색이 아니면 그대로
  const diff = (px, py) => Math.abs(lum(px, py) - bg) > 40;
  const rowHas = py => { let n = 0; for (let px = 0; px < sw; px++) if (diff(px, py) && ++n > sw * 0.012) return true; return false; };
  const colHas = px => { let n = 0; for (let py = 0; py < sh; py++) if (diff(px, py) && ++n > sh * 0.012) return true; return false; };
  let t = 0, b = sh - 1, l = 0, r = sw - 1;
  while (t < b && !rowHas(t)) t++;
  while (b > t && !rowHas(b)) b--;
  while (l < r && !colHas(l)) l++;
  while (r > l && !colHas(r)) r--;
  const pad = 2, k = W / sw;
  t = Math.max(0, t - pad); l = Math.max(0, l - pad); b = Math.min(sh - 1, b + pad); r = Math.min(sw - 1, r + pad);
  const cx = Math.round(l * k), cy = Math.round(t * k), cw = Math.round((r - l + 1) * k), ch = Math.round((b - t + 1) * k);
  if (cw * ch > W * H * 0.95 || cw < W * 0.3 || ch < H * 0.3) return blob;   // 거의 안 잘리거나 너무 많이 잘리면 원본
  const o = document.createElement('canvas'); o.width = Math.min(cw, W - cx); o.height = Math.min(ch, H - cy);
  o.getContext('2d').drawImage(im, cx, cy, o.width, o.height, 0, 0, o.width, o.height);
  return (await toBlob(o, 'image/jpeg', 0.92)) || blob;
}

/* ---------- 책 만들기 ---------- */
async function pagesFromRecord(rec) {
  if (rec.kind === 'zip') {
    if (!window.JSZip) throw new Error('압축 해제 도구를 아직 못 불러왔어요. 인터넷 연결 후 다시 시도해 주세요');
    const zip = await JSZip.loadAsync(rec.data);
    const names = [];
    zip.forEach((p, f) => { if (!f.dir && IMG_RE.test(p) && !/(^|\/)(__MACOSX\/|\.)/.test(p)) names.push(p); });
    names.sort(collator.compare);
    return names.map(n => ({ name: n.split('/').pop(), blob: async () => new Blob([await zip.file(n).async('arraybuffer')], { type: mimeOf(n) }) }));
  }
  return rec.data.map(d => ({ name: d.name, blob: async () => d.blob }));
}
const zipRec = f => ({ id: 'z' + hash(f.name + '|' + f.size + '|' + f.lastModified), name: stripExt(f.name), kind: 'zip', data: f });

async function addToLibrary(rec, pages) {
  rec.count = pages.length; rec.added = Date.now();
  try { rec.cover = await makeThumb(await pages[0].blob(), 360); } catch {}
  await DB.put(rec);
  await trimLibrary();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
}

async function openFiles(list) {
  const files = [...(list || [])];
  if (!files.length) return;
  const arcs = files.filter(f => ARC_RE.test(f.name) || /zip/.test(f.type));
  const imgs = files.filter(f => IMG_RE.test(f.name) || /^image\//.test(f.type));
  if (arcs.length > 1) {                       // 여러 권 → 서재에 한꺼번에 넣기
    arcs.sort((a, b) => collator.compare(a.name, b.name));
    let ok = 0;
    for (let k = 0; k < arcs.length; k++) {
      loading(true, `서재에 넣는 중… ${k + 1} / ${arcs.length}`);
      try {
        const rec = zipRec(arcs[k]);
        if (await DB.get(rec.id).catch(() => null)) { ok++; continue; }
        const pages = await pagesFromRecord(rec);
        if (pages.length) { await addToLibrary(rec, pages); ok++; }
      } catch (e) { console.error(e); }
    }
    loading(false);
    toast(`${ok}권을 서재에 넣었어요`);
    return renderLib();
  }
  let rec;
  if (arcs.length) rec = zipRec(arcs[0]);
  else if (imgs.length) {
    const unique = new Set(imgs.map(f => f.name)).size === imgs.length;
    if (unique) imgs.sort((a, b) => collator.compare(a.name, b.name));   // 이름이 다 다르면 번호순, 같으면(아이폰 사진) 고른 순서
    const d = new Date();
    const name = imgs.length === 1 ? stripExt(imgs[0].name) : `사진 ${imgs.length}장 · ${d.getMonth() + 1}월 ${d.getDate()}일`;
    rec = { id: 'i' + hash(imgs.map(f => f.name + f.size).join('|')), name, kind: 'images', data: imgs.map(f => ({ name: f.name, blob: f })) };
  } else if (files.some(f => /\.(cbr|rar|7z|cb7|pdf)$/i.test(f.name))) {
    return toast('RAR·7z·PDF는 아직 못 열어요. ZIP·CBZ로 바꿔 주세요');
  } else return toast('열 수 있는 파일이 없어요');
  openRecord(rec, true);
}

async function openRecord(rec, isNew) {
  loading(true, '여는 중…');
  try {
    const pages = await pagesFromRecord(rec);
    if (!pages.length) { loading(false); return toast('이미지가 들어 있지 않아요'); }
    if (isNew && !(await DB.get(rec.id).catch(() => null))) addToLibrary(rec, pages).catch(() => toast('저장 공간이 부족해 이번에만 열어요'));
    meta[rec.id] = Object.assign({ pos: 0 }, meta[rec.id], { opened: Date.now() });
    saveMeta();
    startReader(rec, pages);
  } catch (e) {
    console.error(e);
    toast(e && e.message && /[가-힣]/.test(e.message) ? e.message : '파일을 열지 못했어요 (손상되었거나 지원하지 않는 형식)');
  } finally { loading(false); }
}

async function trimLibrary() {
  const all = await DB.all();
  if (all.length <= MAX_BOOKS) return;
  all.sort((a, b) => ((meta[b.id] || {}).opened || b.added) - ((meta[a.id] || {}).opened || a.added));
  for (const r of all.slice(MAX_BOOKS)) { await DB.del(r.id); delete meta[r.id]; }
  saveMeta();
}

/* ---------- 서재 ---------- */
let libUrls = [];
const recent = b => (meta[b.id] || {}).opened || b.added || 0;
function sortBooks(books) { return books.sort(settings.sort === 'name' ? (a, b) => collator.compare(a.name, b.name) : (a, b) => recent(b) - recent(a)); }
async function renderLib() {
  libUrls.forEach(u => URL.revokeObjectURL(u)); libUrls = [];
  let books = [];
  try { books = await DB.all(); } catch {}
  const coverUrl = b => { if (!b.cover) return ''; const u = URL.createObjectURL(b.cover); libUrls.push(u); return u; };

    $('#heroBarWrap').classList.add('hidden');
    const first = books.length ? sortBooks([...books])[0] : null, u = first ? coverUrl(first) : '';
    $('#heroCover').classList.toggle('hidden', !u); if (u) $('#heroImg').src = u;

  }

}
$('#btnSort').onclick = () => { settings.sort = settings.sort === 'name' ? 'recent' : 'name'; saveSettings(); renderLib(); };
$('#btnAdd').onclick = e => { e.stopPropagation(); $('#addMenu').classList.toggle('hidden'); };
$('#addMenu').onclick = e => { const b = e.target.closest('button'); if (!b) return; $('#addMenu').classList.add('hidden'); $(b.dataset.a === 'zip' ? '#fZip' : '#fImg').click(); };
document.addEventListener('click', e => { if (!e.target.closest('#addMenu')) $('#addMenu').classList.add('hidden'); });
addEventListener('scroll', () => $('#toTop').classList.toggle('show', !document.body.classList.contains('reading') && scrollY > 500), { passive: true });
$('#toTop').onclick = () => scrollTo({ top: 0, behavior: 'smooth' });

/* ======================= 뷰어 ======================= */
const stage = $('#stage'), strip = $('#strip'), slider = $('#slider');
const slotEls = [...strip.children];
let S = { prev: slotEls[0], cur: slotEls[1], next: slotEls[2] };
const R = { rec: null, pages: [], count: 0, groups: [], gOf: null, g: 0, token: 0, urls: new Map(), order: [], thumbs: new Map(), wide: new Set(), io: null, gridFor: null };

const spreadOn = () => settings.spread === 'two' || (settings.spread === 'auto' && innerWidth > innerHeight * 1.05);
function buildGroups() {                    // 쪽 묶음: 두 쪽 보기면 [0] [1,2] [3,4]… 가로로 넓은 펼침면은 혼자
  const g = [], n = R.count;
  if (!spreadOn()) for (let i = 0; i < n; i++) g.push([i]);
  else {
    let i = 0;
    if (settings.cover && n) { g.push([0]); i = 1; }
    while (i < n) {
      if (R.wide.has(i) || i + 1 >= n || R.wide.has(i + 1)) { g.push([i]); i++; }
      else { g.push([i, i + 1]); i += 2; }
    }
  }
  R.groups = g; R.gOf = new Int32Array(n);
  g.forEach((a, k) => a.forEach(p => { R.gOf[p] = k; }));
}
const firstPage = () => (R.groups[R.g] || [0])[0];

function startReader(rec, pages) {
  closeReader(true);
  Object.assign(R, { rec, pages, count: pages.length, wide: new Set() });
  buildGroups();
  R.g = R.gOf[Math.min((meta[rec.id] || {}).pos || 0, R.count - 1)];
  ls.set('reading', rec.id);
  $('#title').textContent = rec.name;
  document.title = rec.name + ' · 넘김';
  document.body.classList.add('reading');
  setTheme('#111214'); $('#toTop').classList.remove('show');
  document.body.classList.remove('hide-bars');
  if (!history.state || !history.state.reader) history.pushState({ reader: 1 }, '');
  applySettings();
  renderAll();
}

function closeReader(silent) {
  R.token++; finishAnim();
  R.urls.forEach(u => URL.revokeObjectURL(u)); R.urls.clear(); R.order = [];
  R.thumbs.forEach(u => URL.revokeObjectURL(u)); R.thumbs.clear(); thumbJobs.clear();
  if (R.io) { R.io.disconnect(); R.io = null; }
  R.gridFor = null; $('#grid').innerHTML = '';
  slotEls.forEach(s => { s._g = null; s._ready = null; s.firstElementChild.replaceChildren(); });
  resetZoom();
  closeDrawer(); closePops(); $('#end').classList.add('hidden');
  if (silent) return;
  R.rec = null; ls.del('reading');
  document.body.classList.remove('reading', 'hide-bars');
  setTheme('#0B3B40');
  document.title = '넘김 · 미니멀 만화 뷰어';
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  renderLib();
}

/* 페이지 이미지 주소 (최근 14장만 메모리에 유지) */
async function getUrl(i) {
  if (R.urls.has(i)) { R.order = R.order.filter(x => x !== i); R.order.push(i); return R.urls.get(i); }
  const tok = R.token;
  let blob = await R.pages[i].blob();
  if (settings.trim) { try { blob = await trimBlob(blob); } catch {} }
  if (tok !== R.token) return '';
  if (R.urls.has(i)) return R.urls.get(i);
  const u = URL.createObjectURL(blob);
  R.urls.set(i, u); R.order.push(i);
  const keep = new Set(slotEls.flatMap(s => s._g != null && R.groups[s._g] ? R.groups[s._g] : []));
  while (R.order.length > 14) {
    const k = R.order.find(x => !keep.has(x));
    if (k == null) break;
    R.order = R.order.filter(x => x !== k); URL.revokeObjectURL(R.urls.get(k)); R.urls.delete(k);
  }
  return u;
}

async function fillSlot(el, g) {
  el._g = g; el._ready = null;
  const w = el.firstElementChild;
  w.style.transform = '';
  if (g == null || g < 0 || g >= R.groups.length) { w.replaceChildren(); return; }
  const idx = R.groups[g], tok = R.token;
  try {
    const urls = await Promise.all(idx.map(getUrl));
    if (el._g !== g || tok !== R.token) return;
    const imgs = await Promise.all(urls.map(async (u, k) => {
      const im = new Image(); im.src = u; im.alt = ''; im.className = 'pg'; im.draggable = false;
      try { await im.decode(); } catch {}
      if (im.naturalWidth > im.naturalHeight * 1.12 && !R.wide.has(idx[k])) { R.wide.add(idx[k]); R.regroup = true; }
      return im;
    }));
    if (el._g !== g || tok !== R.token) return;
    if (imgs.length === 2) {                         // 두 쪽이 가운데에서 딱 붙도록
      imgs[0].style.objectPosition = settings.rtl ? 'left center' : 'right center';
      imgs[1].style.objectPosition = settings.rtl ? 'right center' : 'left center';
    }
    w.classList.toggle('rtl', settings.rtl);
    w.style.setProperty('--n', imgs.length);
    w.replaceChildren(...imgs);
    el.scrollTop = 0; el._ready = g;
    if (R.regroup) regroup();
  } catch (e) { console.error(e); if (el === S.cur) toast('이 페이지를 읽지 못했어요'); }
}

function regroup() {                         // 펼침면(가로 그림)을 발견하면 쪽 묶음을 다시 계산
  R.regroup = false;
  if (!spreadOn()) return;
  const fp = firstPage(), before = JSON.stringify(R.groups);
  buildGroups();
  if (JSON.stringify(R.groups) === before) return;
  R.g = R.gOf[fp]; renderAll();
}

function place() {
  const ns = settings.rtl ? -1 : 1;           // 다음 쪽이 놓이는 쪽 (만화 방향이면 왼쪽)
  S.cur.style.transform = 'translateX(0)';
  S.next.style.transform = `translateX(${ns * 100}%)`;
  S.prev.style.transform = `translateX(${-ns * 100}%)`;
  slotEls.forEach(s => { s.style.visibility = 'visible'; });
}

function renderAll() {
  R.token++; finishAnim(); resetZoom();
  strip.style.transition = 'none'; strip.style.transform = 'none';
  place();
  fillSlot(S.cur, R.g); fillSlot(S.next, R.g + 1); fillSlot(S.prev, R.g - 1);
  afterChange();
}

function afterChange() {
  if (!R.rec) return;
  updateUI();
  const m = meta[R.rec.id] = Object.assign(meta[R.rec.id] || {}, { pos: firstPage(), opened: Date.now() });
  if (R.g > 0) m.moved = true;
  if (R.g === R.groups.length - 1) m.done = true;
  saveMeta();
}

/* 넘기기 (슬라이드 애니메이션) */
let anim = null;
function finishAnim() { if (!anim) return; const a = anim; anim = null; clearTimeout(a.t); a.done(); }
function snapBack() { strip.style.transition = 'transform .2s ease'; strip.style.transform = 'none'; }
function navigate(dir) {
  finishAnim();
  const tg = R.g + dir;
  if (tg < 0) { snapBack(); return toast('첫 페이지예요'); }
  if (tg >= R.groups.length) { snapBack(); return showEnd(); }
  resetZoom();
  hideBars();
  const ns = settings.rtl ? -1 : 1, k = dir > 0 ? ns : -ns, W = stage.clientWidth;
  const done = () => {
    strip.style.transition = 'none'; strip.style.transform = 'none';
    if (dir > 0) S = { prev: S.cur, cur: S.next, next: S.prev };
    else S = { next: S.cur, cur: S.prev, prev: S.next };
    place();
    R.g = tg;
    if (S.cur._g !== tg) fillSlot(S.cur, tg);
    else if (settings.fit === 'width') S.cur.scrollTop = 0;
    fillSlot(dir > 0 ? S.next : S.prev, dir > 0 ? tg + 1 : tg - 1);
    afterChange();
  };
  if (settings.anim === 'none') return done();
  const me = { done, t: setTimeout(finishAnim, 340) };
  anim = me;
  strip.style.transition = 'transform .26s cubic-bezier(.22,.7,.25,1)';
  requestAnimationFrame(() => { if (anim === me) strip.style.transform = `translateX(${-k * W}px)`; });
}
const goSide = side => navigate(side === (settings.rtl ? -1 : 1) ? 1 : -1);   // side: 화면 오른쪽(+1)/왼쪽(-1)
function go(page) { R.g = R.gOf[clamp(page, 0, R.count - 1)]; renderAll(); }

function dragTo(dx) {
  const side = dx < 0 ? 1 : -1, dir = side === (settings.rtl ? -1 : 1) ? 1 : -1;
  const edge = R.g + dir < 0 || R.g + dir >= R.groups.length;
  strip.style.transition = 'none';
  strip.style.transform = `translateX(${edge ? dx * 0.3 : dx}px)`;
}
function releaseDrag(dx, v) {
  const W = stage.clientWidth;
  if (Math.abs(dx) > W * 0.16 || (Math.abs(v) > 0.35 && Math.abs(dx) > 30)) goSide(dx < 0 ? 1 : -1);
  else snapBack();
}

function updateUI() {
  const idx = R.groups[R.g] || [0];
  $('#pageNum').textContent = (idx.length === 2 ? `${idx[0] + 1}-${idx[1] + 1}` : `${idx[0] + 1}`) + ` / ${R.count}`;
  slider.max = Math.max(0, R.count - 1); slider.value = idx[0];
  slider.style.setProperty('--p', (R.count > 1 ? idx[0] / (R.count - 1) * 100 : 100) + '%');
  $('#pLast').textContent = R.count;
  if (R.gridFor === R.rec) markThumb();
}

/* ---------- 끝까지 읽었을 때: 다음 권 ---------- */
async function showEnd() {
  closePops();
  const rec = R.rec;
  $('#endTitle').textContent = rec.name;
  $('#endNext').classList.add('hidden');
  $('#end').classList.remove('hidden');
  let books = [];
  try { books = (await DB.all()).sort((a, b) => collator.compare(a.name, b.name)); } catch {}
  const i = books.findIndex(b => b.id === rec.id), nx = i >= 0 ? books[i + 1] : null;
  if (!nx || R.rec !== rec) return;
  if (nx.cover) { const u = URL.createObjectURL(nx.cover); $('#endNextImg').src = u; libUrls.push(u); } else $('#endNextImg').removeAttribute('src');
  $('#endNextName').textContent = nx.name;
  $('#endNext').onclick = () => { $('#end').classList.add('hidden'); openRecord(nx, false); };
  $('#endNext').classList.remove('hidden');
}
$('#endRestart').onclick = () => { $('#end').classList.add('hidden'); go(0); };
$('#endLib').onclick = () => { $('#end').classList.add('hidden'); $('#btnBack').click(); };
$('#endClose').onclick = () => $('#end').classList.add('hidden');

/* ---------- 확대 (더블탭 · 두 손가락 · 드래그로 이동) ---------- */
const Z = { s: 1, x: 0, y: 0, ox: 0, oy: 0, c: null };
function zoomBase() {
  const w = S.cur.firstElementChild, prev = w.style.transform;
  w.style.transform = 'none';
  const r = w.getBoundingClientRect(); Z.ox = r.left; Z.oy = r.top;
  const imgs = [...w.children];
  if (imgs.length) {
    const rs = imgs.map(i => i.getBoundingClientRect());
    Z.c = { l: Math.min(...rs.map(q => q.left)), t: Math.min(...rs.map(q => q.top)), r: Math.max(...rs.map(q => q.right)), b: Math.max(...rs.map(q => q.bottom)) };
  } else Z.c = { l: r.left, t: r.top, r: r.right, b: r.bottom };
  w.style.transform = prev;
}
function clampZoom() {
  const vw = innerWidth, vh = innerHeight;
  const ax = Z.ox + Z.s * (Z.c.l - Z.ox), bx = Z.ox + Z.s * (Z.c.r - Z.ox);
  const ay = Z.oy + Z.s * (Z.c.t - Z.oy), by = Z.oy + Z.s * (Z.c.b - Z.oy);
  Z.x = bx - ax > vw ? clamp(Z.x, vw - bx, -ax) : vw / 2 - (ax + bx) / 2;
  Z.y = by - ay > vh ? clamp(Z.y, vh - by, -ay) : vh / 2 - (ay + by) / 2;
}
function applyZoom(ease) {
  const w = S.cur.firstElementChild;
  w.classList.toggle('ease', !!ease);
  w.style.transform = Z.s > 1 ? `translate(${Z.x}px,${Z.y}px) scale(${Z.s})` : '';
  stage.classList.toggle('zoomed', Z.s > 1);
}
function resetZoom(ease) { if (Z.s === 1 && !stage.classList.contains('zoomed')) return; Z.s = 1; Z.x = Z.y = 0; applyZoom(ease); }
function zoomAt(px, py) {
  if (Z.s > 1) return resetZoom(true);
  zoomBase();
  Z.s = 2.5; Z.x = (px - Z.ox) * (1 - Z.s); Z.y = (py - Z.oy) * (1 - Z.s);
  clampZoom(); applyZoom(true);
}

/* ---------- 탭 (좌우 30% 넘김, 가운데 메뉴 · 가운데 두 번 탭 확대) ---------- */
let lastTap = null, tapTimer = null;
function handleTap(x, y) {
  if (closePops()) return;
  const z = x / innerWidth, center = z >= 0.3 && z <= 0.7;
  if (Z.s === 1 && !center) { lastTap = null; return goSide(z < 0.3 ? -1 : 1); }
  const now = Date.now();
  if (lastTap && now - lastTap.t < 300 && Math.hypot(x - lastTap.x, y - lastTap.y) < 40) {
    clearTimeout(tapTimer); lastTap = null; return zoomAt(x, y);
  }
  lastTap = { x, y, t: now };
  clearTimeout(tapTimer); tapTimer = setTimeout(() => { lastTap = null; toggleBars(); }, 280);
}

/* ---------- 터치: 스와이프(손가락 따라옴) · 핀치 확대 · 이동 ---------- */
let T = null;
const dist = (a, b) => Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
stage.addEventListener('touchstart', e => {
  if (e.touches.length === 2) {
    if (T && T.mode === 'drag') snapBack();
    if (Z.s === 1) zoomBase();
    const [a, b] = e.touches;
    T = { mode: 'pinch', d0: dist(a, b), s0: Z.s, x0: Z.x, y0: Z.y, cx: (a.clientX + b.clientX) / 2, cy: (a.clientY + b.clientY) / 2 };
    return;
  }
  if (e.touches.length > 2) return;
  finishAnim();
  const t = e.touches[0];
  T = { x0: t.clientX, y0: t.clientY, t0: Date.now(), mode: null, zx: Z.x, zy: Z.y, lx: t.clientX, lt: Date.now(), v: 0 };
}, { passive: true });
stage.addEventListener('touchmove', e => {
  if (!T) return;
  if (T.mode === 'pinch') {
    if (e.touches.length < 2) return;
    e.preventDefault();
    const [a, b] = e.touches, cx = (a.clientX + b.clientX) / 2, cy = (a.clientY + b.clientY) / 2;
    const s = clamp(T.s0 * dist(a, b) / T.d0, 1, 5);
    const px = Z.ox + (T.cx - Z.ox - T.x0) / T.s0, py = Z.oy + (T.cy - Z.oy - T.y0) / T.s0;   // 처음 두 손가락 사이에 있던 그림 지점
    Z.s = s; Z.x = cx - Z.ox - s * (px - Z.ox); Z.y = cy - Z.oy - s * (py - Z.oy);
    clampZoom(); applyZoom(); return;
  }
  const t = e.touches[0], dx = t.clientX - T.x0, dy = t.clientY - T.y0;
  if (!T.mode) {
    if (Math.hypot(dx, dy) < 8) return;
    T.mode = Z.s > 1 ? 'pan' : Math.abs(dx) > Math.abs(dy) ? 'drag' : 'scroll';
  }
  if (T.mode === 'pan') { e.preventDefault(); Z.x = T.zx + dx; Z.y = T.zy + dy; clampZoom(); applyZoom(); }
  else if (T.mode === 'drag') {
    e.preventDefault();
    const now = Date.now(); if (now > T.lt) { T.v = (t.clientX - T.lx) / (now - T.lt); T.lx = t.clientX; T.lt = now; }
    if (settings.anim !== 'none') dragTo(dx);
  }
}, { passive: false });
stage.addEventListener('touchend', e => {
  if (!T) return;
  if (e.touches.length) {
    if (T.mode === 'pinch' && e.touches.length === 1) { const t = e.touches[0]; T = { x0: t.clientX, y0: t.clientY, t0: Date.now(), mode: 'pan', zx: Z.x, zy: Z.y }; }
    return;
  }
  const t = e.changedTouches[0], dx = t.clientX - T.x0, dy = t.clientY - T.y0, mode = T.mode, dt = Date.now() - T.t0, v = T.v;
  T = null;
  if (mode === 'pinch' || mode === 'pan') { if (Z.s < 1.05) resetZoom(true); return; }
  if (mode === 'drag') {
    if (settings.anim === 'none') { if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.3) goSide(dx < 0 ? 1 : -1); }
    else releaseDrag(dx, v);
    return;
  }
  if (!mode && dt < 450) { e.preventDefault(); handleTap(t.clientX, t.clientY); }
});
stage.addEventListener('touchcancel', () => { if (T && T.mode === 'drag') snapBack(); T = null; });

/* ---------- 마우스 · 휠 · 키보드 (PC) ---------- */
let M = null;
stage.addEventListener('pointerdown', e => { if (e.pointerType === 'mouse' && e.button === 0) M = { x: e.clientX, y: e.clientY, zx: Z.x, zy: Z.y, moved: false }; });
stage.addEventListener('pointermove', e => {
  if (!M || e.pointerType !== 'mouse') return;
  if (Math.hypot(e.clientX - M.x, e.clientY - M.y) > 5) M.moved = true;
  if (Z.s > 1 && M.moved) { Z.x = M.zx + e.clientX - M.x; Z.y = M.zy + e.clientY - M.y; clampZoom(); applyZoom(); }
});
stage.addEventListener('pointerup', e => {
  if (e.pointerType !== 'mouse' || !M) return;
  const moved = M.moved; M = null;
  if (!moved) handleTap(e.clientX, e.clientY);
});
let wheelLock = 0;
stage.addEventListener('wheel', e => {
  if (e.ctrlKey || Z.s > 1) return;
  const sc = S.cur;
  if (sc.scrollHeight > sc.clientHeight + 4) {   // 너비 맞춤: 끝까지 내린 뒤에만 넘김
    const atBottom = sc.scrollTop + sc.clientHeight >= sc.scrollHeight - 2, atTop = sc.scrollTop <= 0;
    if (!((e.deltaY > 0 && atBottom) || (e.deltaY < 0 && atTop))) return;
  }
  e.preventDefault();
  const now = Date.now();
  if (now < wheelLock || Math.abs(e.deltaY) < 8) return;
  wheelLock = now + 450;
  navigate(e.deltaY > 0 ? 1 : -1);
}, { passive: false });

function spaceStep(dir) {
  const sc = S.cur;
  if (sc.scrollHeight > sc.clientHeight + 4) {
    const atBottom = sc.scrollTop + sc.clientHeight >= sc.scrollHeight - 4, atTop = sc.scrollTop <= 4;
    if (dir > 0 && !atBottom) return sc.scrollBy({ top: sc.clientHeight * 0.85, behavior: 'smooth' });
    if (dir < 0 && !atTop) return sc.scrollBy({ top: -sc.clientHeight * 0.85, behavior: 'smooth' });
  }
  navigate(dir);
}
function fullscreen() {
  if (!document.fullscreenEnabled) return;
  document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {});
}
$('#btnFull').onclick = fullscreen;
if (document.fullscreenEnabled) $('#btnFull').classList.remove('hidden');

document.addEventListener('keydown', e => {
  if (!document.body.classList.contains('reading') || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target === $('#bright')) return;
  const k = e.key, endOpen = !$('#end').classList.contains('hidden');
  if (k === 'Escape') {
    if (endOpen) $('#end').classList.add('hidden');
    else if ($('#drawer').classList.contains('open')) closeDrawer();
    else if (!closePops()) { if (Z.s > 1) resetZoom(true); else toggleBars(); }
    return;
  }
  if (endOpen) return;
  if (k === 'ArrowRight') { e.preventDefault(); goSide(1); }
  else if (k === 'ArrowLeft') { e.preventDefault(); goSide(-1); }
  else if (k === ' ' || k === 'Spacebar') { e.preventDefault(); spaceStep(e.shiftKey ? -1 : 1); }
  else if (k === 'PageDown') { e.preventDefault(); navigate(1); }
  else if (k === 'PageUp') { e.preventDefault(); navigate(-1); }
  else if (k === 'Home') go(0);
  else if (k === 'End') go(R.count - 1);
  else if (k === 'Enter') toggleBars();
  else if (k === 'f' || k === 'F') fullscreen();
  else if (k === 't' || k === 'T') ($('#drawer').classList.contains('open') ? closeDrawer : openDrawer)();
  else if (k === 'd' || k === 'D') cycleSpread();
  else if (k === 'w' || k === 'W') toggleFit();
  else if (k === 'ArrowDown' && settings.fit !== 'width') { e.preventDefault(); navigate(1); }
  else if (k === 'ArrowUp' && settings.fit !== 'width') { e.preventDefault(); navigate(-1); }
});

/* ---------- 메뉴 버튼 · 설정 ---------- */
const ICON = {
  one: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6.5" y="3.5" width="11" height="17" rx="1.5"/></svg>',
  two: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2.5" y="4.5" width="9" height="15" rx="1.3"/><rect x="12.5" y="4.5" width="9" height="15" rx="1.3"/></svg>',
  auto: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="5.5" width="9" height="14" rx="1.3"/><rect x="9.5" y="8.5" width="11" height="7" rx="1.3"/><path d="M15 3.5a4 4 0 0 1 4 3"/></svg>',
  h: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M8 7l4-4 4 4M8 17l4 4 4-4"/></svg>',
  w: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18M7 8l-4 4 4 4M17 8l4 4-4 4"/></svg>'
};
const SPREAD_LABEL = { one: '한 쪽', two: '두 쪽', auto: '자동' };
function applySettings() {
  $('#tSpread').innerHTML = ICON[settings.spread] + SPREAD_LABEL[settings.spread];
  $('#tFit').innerHTML = (settings.fit === 'width' ? ICON.w : ICON.h) + (settings.fit === 'width' ? '너비 맞춤' : '높이 맞춤');
  $('#tSpread').classList.toggle('on', settings.spread !== 'one');
  $('#tFit').classList.toggle('on', settings.fit === 'width');
  $('#tBright').classList.toggle('on', settings.bright < 100);
  stage.classList.toggle('fit-width', settings.fit === 'width');
  stage.classList.toggle('fit-height', settings.fit !== 'width');
  slider.classList.toggle('rtl', settings.rtl);
  $('#dim').style.opacity = (100 - settings.bright) / 100;
  $('#bright').value = settings.bright; $('#brightVal').textContent = settings.bright + '%';
  $('#bright').style.setProperty('--p', ((settings.bright - 20) / 80 * 100) + '%');
  $('#segDir').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === (settings.rtl ? 'rtl' : 'ltr')));
  $('#segAnim').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === settings.anim));
  $('#swTrim .sw').classList.toggle('on', settings.trim);
  $('#swCover .sw').classList.toggle('on', settings.cover);
}
function regroupKeep() { const fp = firstPage(); buildGroups(); R.g = R.gOf[fp]; renderAll(); }
function cycleSpread() {
  settings.spread = { one: 'two', two: 'auto', auto: 'one' }[settings.spread];
  saveSettings(); applySettings(); regroupKeep();
  toast({ one: '한 쪽 보기', two: '두 쪽 보기', auto: '자동 — 가로 화면이면 두 쪽' }[settings.spread]);
}
function toggleFit() { settings.fit = settings.fit === 'width' ? 'height' : 'width'; saveSettings(); applySettings(); renderAll(); toast(settings.fit === 'width' ? '너비 맞춤 (위아래로 스크롤)' : '높이 맞춤'); }
function clearPageCache() { R.urls.forEach(u => URL.revokeObjectURL(u)); R.urls.clear(); R.order = []; }

$('#tSpread').onclick = cycleSpread;
$('#tFit').onclick = toggleFit;
$('#tBright').onclick = () => togglePop('#pop');
$('#tSet').onclick = () => togglePop('#sheet');
$('#segDir').onclick = e => { const b = e.target.closest('button'); if (!b) return; settings.rtl = b.dataset.v === 'rtl'; saveSettings(); applySettings(); renderAll(); };
$('#segAnim').onclick = e => { const b = e.target.closest('button'); if (!b) return; settings.anim = b.dataset.v; saveSettings(); applySettings(); };
$('#swTrim').onclick = () => { settings.trim = !settings.trim; saveSettings(); applySettings(); clearPageCache(); renderAll(); };
$('#swCover').onclick = () => { settings.cover = !settings.cover; saveSettings(); applySettings(); regroupKeep(); };
$('#bright').oninput = e => { settings.bright = +e.target.value; applySettings(); };
$('#bright').onchange = () => saveSettings();

function togglePop(sel) { const open = $(sel).classList.contains('hidden'); closePops(); if (open) $(sel).classList.remove('hidden'); }
function closePops() { let was = false; ['#pop', '#sheet'].forEach(s => { if (!$(s).classList.contains('hidden')) { $(s).classList.add('hidden'); was = true; } }); return was; }
function hideBars() { document.body.classList.add('hide-bars'); closePops(); }
function toggleBars() { document.body.classList.toggle('hide-bars'); closePops(); }

/* ---------- 쪽 이동 막대 + 미리보기 그림 ---------- */
let seekT;
slider.oninput = () => {
  const v = +slider.value, idx = R.groups[R.gOf[v]];
  const label = idx.length === 2 ? `${idx[0] + 1}-${idx[1] + 1}` : `${idx[0] + 1}`;
  $('#pageNum').textContent = `${label} / ${R.count}`;
  const p = R.count > 1 ? v / (R.count - 1) : 1;
  slider.style.setProperty('--p', p * 100 + '%');
  const seek = $('#seek'), img = seek.querySelector('img');
  seek.classList.remove('hidden');
  seek.style.left = `calc(10px + ${(settings.rtl ? 1 - p : p)} * (100% - 20px))`;
  $('#seekNum').textContent = label;
  seek.dataset.i = idx[0];
  if (R.thumbs.has(idx[0])) img.src = R.thumbs.get(idx[0]);
  clearTimeout(seekT);
  seekT = setTimeout(() => getThumb(idx[0]).then(u => { if (u && seek.dataset.i == idx[0]) img.src = u; }), 60);
};
slider.onchange = () => { $('#seek').classList.add('hidden'); go(+slider.value); slider.blur(); };
slider.addEventListener('pointerup', () => setTimeout(() => $('#seek').classList.add('hidden'), 50));

/* ---------- 썸네일 (서랍 · 이동 막대 공용) ---------- */
const thumbJobs = new Map();
let thumbRun = 0; const thumbWait = [];
function limit(fn) { return new Promise((res, rej) => { const go = () => { thumbRun++; fn().then(res, rej).finally(() => { thumbRun--; const n = thumbWait.shift(); if (n) n(); }); }; thumbRun < 3 ? go() : thumbWait.push(go); }); }
function getThumb(i) {
  if (R.thumbs.has(i)) return Promise.resolve(R.thumbs.get(i));
  if (thumbJobs.has(i)) return thumbJobs.get(i);
  const rec = R.rec;
  const p = limit(() => R.rec === rec ? R.pages[i].blob().then(b => makeThumb(b, 220)) : Promise.resolve(null))
    .then(t => { if (R.rec !== rec || !t) return null; const u = URL.createObjectURL(t); R.thumbs.set(i, u); return u; })
    .catch(() => null).finally(() => thumbJobs.delete(i));
  thumbJobs.set(i, p);
  return p;
}
function buildGrid() {
  if (R.gridFor === R.rec) return;
  const grid = $('#grid'); grid.innerHTML = '';
  if (R.io) R.io.disconnect();
  R.io = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    R.io.unobserve(e.target);
    const img = e.target.querySelector('img');
    getThumb(+e.target.dataset.i).then(u => { if (u) { img.onload = () => img.classList.add('ok'); img.src = u; } });
  }), { root: grid, rootMargin: '200px' });
  const frag = document.createDocumentFragment();
  for (let i = 0; i < R.count; i++) {
    const b = document.createElement('button');
    b.className = 'th'; b.dataset.i = i;
    b.innerHTML = `<img alt=""><span>${i + 1}</span>`;
    frag.appendChild(b); R.io.observe(b);
  }
  grid.appendChild(frag);
  R.gridFor = R.rec;
}
function markThumb() {
  const grid = $('#grid');
  grid.querySelectorAll('.th.cur').forEach(e => e.classList.remove('cur'));
  (R.groups[R.g] || []).forEach(i => { const e = grid.children[i]; if (e) e.classList.add('cur'); });
}
function openDrawer() {
  buildGrid(); markThumb(); closePops();
  $('#drawer').classList.add('open'); $('#scrim').classList.add('open');
  const cur = $('#grid').children[firstPage()];
  if (cur) requestAnimationFrame(() => cur.scrollIntoView({ block: 'center' }));
}
function closeDrawer() { $('#drawer').classList.remove('open'); $('#scrim').classList.remove('open'); }
$('#tThumb').onclick = openDrawer;
$('#dClose').onclick = closeDrawer;
$('#scrim').onclick = closeDrawer;
$('#grid').onclick = e => { const b = e.target.closest('.th'); if (!b) return; go(+b.dataset.i); closeDrawer(); };

/* ---------- 파일 열기 · 끌어다 놓기 · 뒤로가기 · 화면 회전 ---------- */
$('#btnZip').onclick = () => $('#fZip').click();
$('#btnImg').onclick = () => $('#fImg').click();
$('#fZip').onchange = e => { openFiles(e.target.files); e.target.value = ''; };
$('#fImg').onchange = e => { openFiles(e.target.files); e.target.value = ''; };
$('#btnBack').onclick = () => { if (history.state && history.state.reader) history.back(); else closeReader(); };
addEventListener('popstate', () => { if (document.body.classList.contains('reading')) closeReader(); });

let dragN = 0;
addEventListener('dragenter', e => { if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) { dragN++; document.body.classList.add('dragging'); } });
addEventListener('dragleave', () => { if (--dragN <= 0) { dragN = 0; document.body.classList.remove('dragging'); } });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => { e.preventDefault(); dragN = 0; document.body.classList.remove('dragging'); if (e.dataTransfer) openFiles(e.dataTransfer.files); });

let rzT, lastSpread = spreadOn();
addEventListener('resize', () => {
  clearTimeout(rzT);
  rzT = setTimeout(() => {
    if (!R.rec) return;
    const now = spreadOn();
    if (now !== lastSpread) { lastSpread = now; regroupKeep(); }
    else if (Z.s > 1) resetZoom();
  }, 150);
});

/* ---------- 시작 ---------- */
const appleIcon = document.querySelector('link[rel="apple-touch-icon"]');
if (appleIcon) $('#logo').src = appleIcon.href;
const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
if (isIOS && !standalone) $('#iosTip').classList.remove('hidden');

if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

applySettings();
(async () => {
  const last = ls.get('reading', null);     // 앱을 껐다 켜도 읽던 책·페이지에서 바로 이어 보기
  if (last) {
    const rec = await DB.get(last).catch(() => null);
    if (rec) {
      const resume = () => openRecord(rec, false);
      if (rec.kind === 'zip' && !window.JSZip && document.readyState !== 'complete') addEventListener('load', resume, { once: true }); else resume();
      renderLib(); return;
    }
    ls.del('reading');
  }
  renderLib();
})();
})();
</script>
</body>
