<style>
:root{
  --teal:#0B5E5E; --teal-d:#073F40; --teal-l:#E3F0EE; --orange:#E07A2E; --orange-l:#FCEBDD;
  --green:#5E9E2F; --red:#C0392B; --red-l:#FBE4E1; --ink:#1D2626; --sub:#5A6565; --line:#DCE3E1;

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.55 'IBM Plex Sans KR',system-ui,sans-serif}
body{min-height:100dvh}
#app{max-width:520px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom))}

  font:700 18px 'IBM Plex Sans KR',sans-serif;cursor:pointer;text-decoration:none;margin:8px 0;padding:10px 16px;text-align:center}
.btn.big{min-height:76px;font-size:22px}
.b-teal{background:var(--teal);color:#fff}

  body{background:#fff} #app{max-width:none;padding:0} .noprint,.toast,nav{display:none!important}

}

<script>
'use strict';
/* ============ 기본 도구 ============ */
const CFG = window.SB_CONFIG || { url: '', key: '' };
const $ = s => document.querySelector(s);
const app = $('#app');
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  get(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} }
};
const BASE = location.origin + location.pathname.replace(/index\.html$/, '');
const rand = () => { const a = new Uint8Array(16); crypto.getRandomValues(a); return btoa(String.fromCharCode(...a)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
const FIELDS = ['appearance', 'checkin_by', 'blood_type', 'conditions', 'medications', 'allergies', 'pub_blood', 'pub_conditions', 'pub_meds', 'pub_allergies', 'guardian_name', 'safe_number', 'nickname', 'calming_tips', 'medical_note', 'show_medical', 'zone_name', 'zone_lat', 'zone_lng', 'zone_radius'];
const KIND = { checkin: '☀️ 오늘 안부 확인', reply: '💬 보호자 답장', open: '누군가 표식을 찍음', sos: '🚑 응급 상황 신고 (쓰러짐·아픔)', scan: '발견자가 위치를 보냄', ping: '동행 모드 위치', exit: '안심존을 벗어남', enter: '안심존으로 돌아옴' };

function toast(msg, ms = 2600) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => { t.style.opacity = 0; setTimeout(() => t.remove(), 400); }, ms);
}
function fmtTime(iso) {
  const d = new Date(iso), diff = (Date.now() - d) / 60000;
  if (diff < 1) return '방금 전';
  if (diff < 60) return `${Math.floor(diff)}분 전`;
  if (diff < 1440) return `${Math.floor(diff / 60)}시간 전`;
  return d.toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: 'numeric', minute: '2-digit' });
}
function meters(a, b) {
  const R = 6371000, r = x => x * Math.PI / 180;
  const dLat = r(b.lat - a.lat), dLng = r(b.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
async function copy(text, label = '복사했어요') {
  try { await navigator.clipboard.writeText(text); toast(label); }
  catch { prompt('아래 주소를 길게 눌러 복사하세요', text); }
}
async function share(title, text, url) {
  if (navigator.share) { try { await navigator.share({ title, text, url }); return; } catch (e) { if (e.name === 'AbortError') return; } }
  copy(url, '주소를 복사했어요. 카톡에 붙여넣어 보내세요');
}
const waitFor = (test, ms = 6000) => new Promise(res => {
  const t0 = Date.now(); (function loop() { if (test()) return res(true); if (Date.now() - t0 > ms) return res(false); setTimeout(loop, 80); })();
});

/* ============ 서버 연결: 체험(이 폰) / 클라우드(Supabase) ============ */
const LDB = 'sb_localdb';
const ldb = () => store.get(LDB, { families: [], events: [], seq: 0 });
const pick = p => Object.fromEntries(Object.entries(p || {}).filter(([k]) => FIELDS.includes(k)));
const localApi = {
  async createFamily(p) {
    const d = ldb();
    let code; do { code = 'SB-' + String(Math.floor(100000 + Math.random() * 900000)); } while (d.families.some(x => x.short_code === code));
    const f = { id: rand(), family_key: rand() + rand(), companion_key: rand(), tag_token: rand(), short_code: code, status: 'normal',
      missing_since: null, nickname: '어르신', show_medical: false, ...pick(p), created_at: new Date().toISOString() };
    if (!f.nickname) f.nickname = '어르신';
    d.families.push(f); store.set(LDB, d);
    return { family_key: f.family_key, companion_key: f.companion_key, tag_token: f.tag_token };
  },
  async updateFamily(fkey, p) {
    const d = ldb(), f = d.families.find(x => x.family_key === fkey);
    if (!f) throw new Error('family not found');
    Object.assign(f, pick(p)); store.set(LDB, d); return { ok: true };
  },
  async dashboard(fkey) {
    const d = ldb(), f = d.families.find(x => x.family_key === fkey);
    if (!f) throw new Error('family not found');
    const events = d.events.filter(e => e.family_id === f.id).sort((a, b) => b.id - a.id).slice(0, 200);
    const { id, family_key, ...family } = f; return { family, events };
  },
  async scanInfo(token) {
    const f = ldb().families.find(x => x.tag_token === token);
    if (!f) return { ok: false };
    const pub = (k, v) => (f[k] !== false && v ? v : undefined);
    return { ok: true, nickname: f.nickname, calming_tips: f.calming_tips, medical: f.show_medical ? f.medical_note : null,
      emergency: { blood_type: pub('pub_blood', f.blood_type), conditions: pub('pub_conditions', f.conditions), medications: pub('pub_meds', f.medications), allergies: pub('pub_allergies', f.allergies) },
      safe_number: f.safe_number, missing: f.status === 'missing', appearance: f.appearance, short_code: f.short_code,
      reply: (() => { const r = ldb().events.filter(e => e.family_id === f.id && e.kind === 'reply' && Date.now() - new Date(e.created_at) < 7200000).sort((a, b) => b.id - a.id)[0]; return r ? { text: r.note, at: r.created_at } : null; })() };
  },
  async checkin(ckey) {
    const d = ldb(), f = d.families.find(x => x.companion_key === ckey);
    if (!f) return { ok: false };
    const recent = d.events.some(e => e.family_id === f.id && e.kind === 'checkin' && Date.now() - new Date(e.created_at) < 1800000);
    if (!recent) { d.events.push({ id: ++d.seq, family_id: f.id, kind: 'checkin', lat: null, lng: null, accuracy: null, note: null, created_at: new Date().toISOString() }); store.set(LDB, d); }
    return { ok: true, nickname: f.nickname };
  },
  async reply(fkey, text) {
    const d = ldb(), f = d.families.find(x => x.family_key === fkey);
    if (!f) throw new Error('family not found');
    d.events.push({ id: ++d.seq, family_id: f.id, kind: 'reply', lat: null, lng: null, accuracy: null, note: String(text).slice(0, 200), created_at: new Date().toISOString() });
    store.set(LDB, d); return { ok: true };
  },
  async scanOpen(token) {
    const d = ldb(), f = d.families.find(x => x.tag_token === token);
    if (!f) return { ok: false };
    const recent = d.events.some(e => e.family_id === f.id && e.kind === 'open' && Date.now() - new Date(e.created_at) < 60000);
    if (!recent) { d.events.push({ id: ++d.seq, family_id: f.id, kind: 'open', lat: null, lng: null, accuracy: null, note: null, created_at: new Date().toISOString() }); store.set(LDB, d); }
    return { ok: true };
  },
  async reportScan(token, lat, lng, acc, note, sos) {
    const d = ldb(), f = d.families.find(x => x.tag_token === token);
    if (!f) return { ok: false };
    d.events.push({ id: ++d.seq, family_id: f.id, kind: sos ? 'sos' : 'scan', lat, lng, accuracy: acc, note: note || null, created_at: new Date().toISOString() });
    store.set(LDB, d); return { ok: true };
  },
  async companion(ckey, kind, lat, lng, acc) {
    const d = ldb(), f = d.families.find(x => x.companion_key === ckey);
    if (!f) return { ok: false };
    if (['ping', 'exit', 'enter'].includes(kind) && lat != null) {
      d.events.push({ id: ++d.seq, family_id: f.id, kind, lat, lng, accuracy: acc, note: null, created_at: new Date().toISOString() });
      store.set(LDB, d);
    }
    return { ok: true, nickname: f.nickname, missing: f.status === 'missing',
      zone: f.zone_lat != null ? { name: f.zone_name, lat: f.zone_lat, lng: f.zone_lng, radius: f.zone_radius } : null };
  },
  async setMissing(fkey, on) {
    const d = ldb(), f = d.families.find(x => x.family_key === fkey);
    if (!f) throw new Error('family not found');
    f.status = on ? 'missing' : 'normal'; f.missing_since = on ? new Date().toISOString() : null;
    store.set(LDB, d); return { ok: true };
  },
  async rotateTag(fkey) {
    const d = ldb(), f = d.families.find(x => x.family_key === fkey);
    if (!f) throw new Error('family not found');
    f.tag_token = rand(); store.set(LDB, d); return { tag_token: f.tag_token };
  }
};
function cloudApi({ url, key }) {
  const base = url.replace(/\/+$/, '');
  const rpc = async (fn, args) => {
    const h = { 'Content-Type': 'application/json', apikey: key };
    if (key.startsWith('eyJ')) h.Authorization = 'Bearer ' + key;
    const r = await fetch(`${base}/rest/v1/rpc/${fn}`, { method: 'POST', headers: h, body: JSON.stringify(args) });
    const t = await r.text();
    if (!r.ok) { let m = t; try { m = JSON.parse(t).message || t; } catch {} throw new Error(m); }
    return t ? JSON.parse(t) : null;
  };
  const n = v => (v === undefined ? null : v);
  return {
    createFamily: p => rpc('sb_create_family', { p }),
    updateFamily: (f, p) => rpc('sb_update_family', { p_fkey: f, p }),
    dashboard: f => rpc('sb_dashboard', { p_fkey: f }),
    scanInfo: t => rpc('sb_scan_info', { p_token: t }),
    scanOpen: t => rpc('sb_scan_open', { p_token: t }),
    checkin: c => rpc('sb_checkin', { p_ckey: c }),
    reply: (f, t) => rpc('sb_reply', { p_fkey: f, p_text: t }),
    reportScan: (t, lat, lng, acc, note, sos) => rpc('sb_report_scan', { p_token: t, p_lat: n(lat), p_lng: n(lng), p_acc: n(acc), p_note: n(note), p_sos: !!sos }),
    companion: (c, k, lat, lng, acc) => rpc('sb_companion', { p_ckey: c, p_kind: k, p_lat: n(lat), p_lng: n(lng), p_acc: n(acc) }),
    setMissing: (f, on) => rpc('sb_set_missing', { p_fkey: f, p_on: on }),
    rotateTag: f => rpc('sb_rotate_tag', { p_fkey: f })
  };
}
const api = conf => (conf && conf.mode === 'cloud' ? cloudApi(conf) : localApi);
const defaultConf = () => (CFG.url && CFG.key ? { mode: 'cloud', url: CFG.url, key: CFG.key } : { mode: 'local' });
function confFromQuery(q) {
  const u = q.get('u'), k = q.get('k');
  if (u && k) return { mode: 'cloud', url: u.includes('.') ? 'https://' + u.replace(/^https?:\/\//, '') : `https://${u}.supabase.co`, key: k };
  return defaultConf();
}
function shareQuery(conf) {
  if (!conf || conf.mode !== 'cloud') return '';
  if (CFG.url && CFG.key && CFG.url === conf.url && CFG.key === conf.key) return '';
  const ref = conf.url.replace(/^https?:\/\//, '').replace(/\/+$/, '').replace(/\.supabase\.co$/, '');
  return `?u=${encodeURIComponent(ref)}&k=${encodeURIComponent(conf.key)}`;
}

/* ============ 라우터 ============ */
function parseRoute() {
  const h = location.hash.replace(/^#/, '') || '/';
  const [path, query = ''] = h.split('?');
  return { parts: path.split('/').filter(Boolean), q: new URLSearchParams(query) };
}
let pollTimer = null, compWatch = null, wakeLock = null;
function stopAll() {
  clearInterval(pollTimer); pollTimer = null;
  if (compWatch != null) { navigator.geolocation.clearWatch(compWatch); compWatch = null; }
  if (wakeLock) { try { wakeLock.release(); } catch {} wakeLock = null; }
}
function router() {
  stopAll();
  const { parts, q } = parseRoute();
  $('#nav').hidden = true;
  if (parts[0] === 't' && parts[1]) return renderFinder(parts[1], confFromQuery(q));
  if (parts[0] === 'c' && parts[1]) return renderCompanion(parts[1], confFromQuery(q));
  if (parts[0] === 'ok' && parts[1]) return renderCheckin(parts[1], confFromQuery(q));
  if (parts[0] === 'join' && parts[1]) return joinFamily(parts[1], confFromQuery(q));
  const me = store.get('sb_me', null);
  if (!me) return renderWelcome();
  if (parts[0] === 'print') return renderPrint(me);
  return renderMain(me);
}
window.addEventListener('hashchange', router);

/* ============ 발견자 화면 (앱 설치 없이) ============ */
async function renderFinder(token, conf) {
  document.title = '어르신을 도와주세요 · 세이프브릿지';
  const mine = store.get('sb_me', null);
  app.innerHTML = `<div class="finder">
    ${mine ? '<a class="btn b-soft" href="#/" onclick="localStorage.setItem(\'sb_tab\',\'&quot;home&quot;\')" style="min-height:48px;font-size:16px;margin:0 0 10px">← 보호자 화면으로 돌아가기 <span class="tiny">(이 폰에서만 보여요)</span></a>' : ''}
    <div class="brand"><img src="icon-192.png" alt=""><b>세이프브릿지</b></div>
    <div class="hello">어르신을 도와주셔서<br>감사합니다</div>
    <div class="who" id="who">정보를 불러오는 중…</div>
    <div id="stage"></div>
    <p class="tiny" style="margin-top:18px">위치는 버튼을 누를 때 한 번만, 이 어르신의 보호자에게만 전달되며 어르신을 돕는 데만 쓰입니다. 앱 설치나 로그인은 필요 없습니다.</p>
    ${conf.mode === 'local' ? '<p class="tiny">※ 시험판 체험 모드입니다. 보호자 앱과 같은 폰에서만 전달됩니다.</p>' : ''}
  </div>`;
  const A = api(conf), stage = $('#stage');
  let info;
  try { info = await A.scanInfo(token); } catch (e) { info = { ok: false, err: e.message }; }
  if (!info || !info.ok) {
    $('#who').innerHTML = (info && info.err ? '서버에 연결하지 못했어요.' : '등록되지 않았거나 사용이 끝난 표식입니다.') +
      '<br>쓰러지셨거나 아프시면 119, 길을 잃으셨으면 112에 신고해 주세요.';
    stage.innerHTML = '<a class="btn big b-red" href="tel:119">🚑 119에 전화하기</a><a class="btn b-ghost" href="tel:112">112에 신고하기</a>';
    return;
  }
  A.scanOpen && A.scanOpen(token).catch(() => {});
  if (info.short_code) $('#who').insertAdjacentHTML('afterend', `<p class="tiny" style="margin:-8px 0 10px">등록번호 <b>${esc(info.short_code)}</b> · 경찰·보호자와 통화할 때 이 번호를 알려 주세요</p>`);
  if (info.appearance) $('#stage').insertAdjacentHTML('beforebegin', `<div class="tips" style="margin-top:0"><b>이런 분이에요</b><br>${esc(info.appearance)}</div>`);
  $('#stage').insertAdjacentHTML('beforebegin', '<div id="replyBox"></div>');
  const showReply = r => { if (r && r.text) $('#replyBox').innerHTML = `<div class="msg ok" style="display:block;background:#FFF6DA;color:#6B4A00">💬 보호자: “${esc(r.text)}”<br><span class="tiny">${fmtTime(r.at)}</span></div>`; };
  showReply(info.reply);
  let lastReply = info.reply && info.reply.at;
  pollTimer = setInterval(async () => {
    if (document.visibilityState !== 'visible') return;
    try { const i = await A.scanInfo(token); if (i && i.reply && i.reply.at !== lastReply) { lastReply = i.reply.at; showReply(i.reply); if (navigator.vibrate) navigator.vibrate(300); } } catch {}
  }, 8000);
  $('#who').innerHTML = `<b>${esc(info.nickname)}</b>이세요.<br><span class="tiny">보호자에게 '누군가 표식을 찍었다'는 알림이 이미 갔어요.</span>${info.missing ? '<br><span class="chip missing" style="margin:6px 0 0">가족이 찾고 있어요</span>' : ''}`;
  const tel = info.safe_number ? 'tel:' + info.safe_number.replace(/[^0-9+]/g, '') : '';
  const callBtn = tel ? `<a class="btn big b-orange" href="${tel}">📞 보호자에게 전화하기</a>` : '';
  const em = info.emergency || {};
  const rows = [['혈액형', em.blood_type], ['지병', em.conditions], ['복용 중인 약', em.medications], ['알레르기', em.allergies], ['기타', info.medical]].filter(r => r[1]);

  // 보호자에게 알림 + 위치 (sos = 응급)
  const send = (sos, btn) => {
    const msg = $('#msg');
    const show = (t, ok) => { msg.className = 'msg ' + (ok ? 'ok' : 'err'); msg.textContent = t; };
    if (btn) { btn.disabled = true; btn.textContent = '위치를 확인하는 중…'; }
    const go = async pos => {
      const c = pos && pos.coords, noteEl = $('#note');
      try {
        const r = await A.reportScan(token, c ? c.latitude : null, c ? c.longitude : null, c ? Math.round(c.accuracy) : null, (noteEl && noteEl.value.trim()) || null, sos);
        if (!r || !r.ok) throw new Error('fail');
        show(sos ? (c ? '보호자에게 응급 알림과 위치를 보냈습니다.' : '보호자에게 응급 알림을 보냈습니다. (위치는 보내지 못했어요)')
                 : (c ? '보호자에게 위치를 보냈습니다. 가능하시면 어르신 곁에 잠시 머물러 주세요.' : '위치 없이 발견 알림을 보냈습니다. 전화 버튼으로 보호자와 통화해 주세요.'), true);
      } catch (e) {
        show(/too many/.test(e.message) ? '방금 보냈어요. 잠시 뒤 다시 눌러 주세요.' : '전송에 실패했어요. 전화 버튼을 이용해 주세요.', false);
      }
      if (btn) { btn.disabled = false; btn.textContent = sos ? '📍 보호자에게 위치 다시 보내기' : '✓ 한 번 더 보내기'; }
    };
    if (!navigator.geolocation) return go(null);
    navigator.geolocation.getCurrentPosition(go, () => go(null), { enableHighAccuracy: true, timeout: 9000, maximumAge: 0 });
  };

  const choose = () => {
    stage.innerHTML = `
      <p style="font-size:19px;font-weight:700;margin:14px 0 6px">어떤 상황인가요?</p>
      <button class="btn big b-red" id="goSos">🚑 쓰러지셨어요 · 아프세요</button>
      <button class="btn big b-teal" id="goLost">🧭 길을 잃으셨어요</button>
      ${callBtn}`;
    $('#goSos').onclick = sosView; $('#goLost').onclick = lostView;
  };
  const back = '<button class="btn b-ghost" id="back" style="min-height:48px;font-size:16px">← 다른 상황 고르기</button>';
  const sosView = () => {
    stage.innerHTML = `
      <a class="btn big b-red" href="tel:119">🚑 119에 전화하기</a>
      <div class="msg ok" id="msg" role="status">보호자에게 응급 알림을 보내는 중…</div>
      ${callBtn}
      <div class="tips" style="border-color:var(--red)"><b>구급대원에게 보여주세요</b>
        ${rows.length ? rows.map(r => `<div style="margin-top:8px"><span class="tiny">${r[0]}</span><br><b style="font-size:20px">${esc(r[1])}</b></div>`).join('')
          : '<div class="sub" style="margin-top:6px">보호자가 공개한 응급 정보가 없어요.</div>'}
      </div>
      <button class="btn b-soft" id="resend">📍 보호자에게 위치 다시 보내기</button>
      ${back}`;
    $('#back').onclick = choose; $('#resend').onclick = e => send(true, e.currentTarget);
    send(true, null);   // 고르는 순간 바로 보호자에게 응급 알림
  };
  const lostView = () => {
    stage.innerHTML = `
      <div class="msg" id="msg" role="status"></div>
      <p class="sub" style="margin:4px 0 0">위치는 <b>지금 이 한 번만</b>, 이 어르신의 보호자에게만 보내집니다.</p>
      <button class="btn big b-teal" id="send">📍 보호자에게 현재 위치 보내기</button>
      ${callBtn}
      ${info.calming_tips ? `<div class="tips"><b>이렇게 대해 주세요</b><br>${esc(info.calming_tips)}</div>` : ''}
      <label for="note" style="font-size:16px">보호자에게 남길 말 (선택)</label>
      <input id="note" maxlength="200" placeholder="예: ○○편의점 앞에 함께 있어요">
      <a class="btn b-ghost" href="tel:112">급하면 112에 신고하기</a>
      ${back}`;
    $('#back').onclick = choose; $('#send').onclick = e => send(false, e.currentTarget);
  };
  choose();
}

    <div class="brand"><img src="icon-192.png" alt=""><b>세이프브릿지</b><span>안부 확인</span></div>

}

/* ============ 어르신 폰: 동행 모드 ============ */
async function renderCompanion(ckey, conf) {
  document.title = '동행 모드 · 세이프브릿지';
  const A = api(conf);
  app.innerHTML = `${store.get('sb_me', null) ? '<a class="btn b-soft" href="#/" style="min-height:48px;font-size:16px;margin:0 0 10px">← 보호자 화면으로 돌아가기</a>' : ''}<div class="brand"><img src="icon-192.png" alt=""><b>세이프브릿지</b><span>동행 모드</span></div><div id="cbody"><p class="empty">불러오는 중…</p></div>`;
  let info;
  try { info = await A.companion(ckey, 'info'); } catch (e) { info = { ok: false }; }
  if (!info || !info.ok) { $('#cbody').innerHTML = '<div class="alert">연결 주소가 맞지 않아요. 보호자 앱의 [표식] 탭에서 동행 모드 링크를 다시 보내 주세요.</div>'; return; }
  store.set('sb_companion', { ckey, conf });
  $('#cbody').innerHTML = `
    <h1>${esc(info.nickname)}의 폰</h1>
    <p class="sub">이 화면을 켜 두면 위치를 가족에게 알리고, 안심존을 벗어나면 바로 알려 줍니다.</p>
    <div class="comp-state" id="cstate" style="background:#fff;border:1.5px solid var(--line)">꺼져 있음</div>
    <button class="btn big b-teal" id="cstart">동행 모드 켜기</button>
    <p class="tiny" id="cinfo">${info.zone ? `안심존: ${esc(info.zone.name || '안심존')} (반경 ${info.zone.radius}m)` : '아직 안심존이 없어요. 보호자 앱에서 만들 수 있어요.'}</p>
    <div class="alert"><b>시험판 안내</b><br>웹앱은 화면이 꺼지거나 다른 앱으로 넘어가면 위치를 보내지 못합니다. 정식 앱에서는 꺼진 상태에서도 동작하도록 만들 예정이에요.</div>`;
  let zone = info.zone, inside = null, lastSent = 0, lastPos = null;
  const state = (t, bg) => { const s = $('#cstate'); s.textContent = t; s.style.background = bg; s.style.borderColor = 'transparent'; };
  const send = async (kind, c) => {
    try {
      const r = await A.companion(ckey, kind, c.latitude, c.longitude, Math.round(c.accuracy));
      if (r && r.ok) { zone = r.zone; lastSent = Date.now(); lastPos = { lat: c.latitude, lng: c.longitude }; }
      $('#cinfo').textContent = `마지막 전송 ${new Date().toLocaleTimeString('ko-KR', { hour: 'numeric', minute: '2-digit' })}` +
        (zone ? ` · 안심존 ${zone.name || ''} 반경 ${zone.radius}m` : '');
    } catch { $('#cinfo').textContent = '전송 실패 — 인터넷 연결을 확인해 주세요'; }
  };
  $('#cstart').onclick = async () => {
    if (!navigator.geolocation) return toast('이 폰은 위치를 쓸 수 없어요');
    try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch {}
    $('#cstart').style.display = 'none'; state('위치 확인 중…', 'var(--teal-l)');
    compWatch = navigator.geolocation.watchPosition(p => {
      const c = p.coords, here = { lat: c.latitude, lng: c.longitude };
      if (zone) {
        const now = meters(here, { lat: zone.lat, lng: zone.lng }) <= zone.radius + Math.min(c.accuracy, 80) / 2;
        if (inside === null) { inside = now; if (!now) send('exit', c); }
        else if (now !== inside) { inside = now; return send(now ? 'enter' : 'exit', c).then(() => state(now ? '안심존 안 · 동행 중' : '안심존 밖 · 가족에게 알림', now ? 'var(--teal-l)' : 'var(--red-l)')); }
        state(inside ? '안심존 안 · 동행 중' : '안심존 밖 · 가족에게 알림', inside ? 'var(--teal-l)' : 'var(--red-l)');
      } else state('동행 중', 'var(--teal-l)');
      const gap = Date.now() - lastSent, moved = lastPos ? meters(here, lastPos) : Infinity;
      const every = zone && inside === false ? 60000 : 300000;
      if (gap > every || (moved > 100 && gap > 30000)) send('ping', c);
    }, e => state(e.code === 1 ? '위치 권한을 허용해 주세요' : '위치를 찾는 중…', 'var(--orange-l)'),
    { enableHighAccuracy: true, maximumAge: 15000, timeout: 30000 });
  };
}

/* ============ 가족 초대 링크로 합류 ============ */
async function joinFamily(fkey, conf) {
  app.innerHTML = '<p class="empty">가족 정보를 확인하는 중…</p>';
  try {
    const d = await api(conf).dashboard(fkey);
    store.set('sb_me', { conf, fkey });
    toast(`${d.family.nickname} 보호자로 함께하게 됐어요`);
  } catch { toast('초대 링크가 맞지 않아요'); }
  location.hash = '#/';
}

/* ============ 처음 화면 ============ */
function renderWelcome() {
  const hasCfg = !!(CFG.url && CFG.key);
  app.innerHTML = `
    <div class="brand"><img src="icon-192.png" alt=""><b>세이프브릿지</b><span>시험판</span></div>
    <h1>쓰러지셔도, 길을 잃으셔도<br>팔찌 한 번이면 가족에게.</h1>
    <p class="sub">밭일하시다 쓰러지시거나 길을 잃으셨을 때, 지나가던 분이 어르신 팔찌·목걸이(NFC·QR)를 휴대폰으로 찍으면 119 안내와 응급 정보가 뜨고 보호자에게 위치가 바로 전달됩니다.</p>
    <div class="card">
      <b>어떻게 쓸까요?</b>
      <div class="seg" style="margin-top:10px" id="modeSeg">
        <button data-m="cloud" class="${hasCfg ? 'on' : ''}">여러 폰 실제 테스트</button>
        <button data-m="local" class="${hasCfg ? '' : 'on'}">이 폰에서만 체험</button>
      </div>
      <div id="modeBox"></div>
    </div>
    <h2>어르신 정보</h2>
    <form id="f">
      ${infoFields({})}
      <button class="btn big b-teal" type="submit" style="margin-top:18px">시작하기</button>
    </form>`;
  let mode = hasCfg ? 'cloud' : 'local';
  const box = () => {
    $('#modeBox').innerHTML = mode === 'local'
      ? '<p class="tiny" style="margin-top:10px">서버 없이 이 폰 안에서만 동작해요. 발견자 화면도 같은 폰에서 열어 보며 흐름을 확인할 수 있어요.</p>'
      : hasCfg ? '<p class="tiny" style="margin-top:10px">공용 서버에 연결됩니다. 다른 폰으로 팔찌·목걸이 QR을 찍으면 이 폰에 알림이 와요.</p>'
      : `<p class="tiny" style="margin-top:10px">Supabase 프로젝트 주소와 공개 키(anon/publishable)를 넣어 주세요. 처음 한 번만 <a href="supabase-setup.sql" target="_blank">설치 SQL</a>을 실행하면 됩니다.</p>
         <label>프로젝트 주소</label><input id="cu" placeholder="https://xxxx.supabase.co" autocapitalize="off">
         <label>공개 키</label><input id="ck" placeholder="sb_publishable_… 또는 eyJ…" autocapitalize="off">`;
    document.querySelectorAll('#modeSeg button').forEach(b => b.classList.toggle('on', b.dataset.m === mode));
  };
  document.querySelectorAll('#modeSeg button').forEach(b => b.onclick = () => { mode = b.dataset.m; box(); });
  box();
  $('#f').onsubmit = async e => {
    e.preventDefault();
    let conf = { mode: 'local' };
    if (mode === 'cloud') {
      if (hasCfg) conf = defaultConf();
      else {
        const url = ($('#cu').value || '').trim().replace(/\/+$/, ''), key = ($('#ck').value || '').trim();
        if (!/^https:\/\/.+/.test(url) || key.length < 20) return toast('서버 주소와 키를 확인해 주세요');
        conf = { mode: 'cloud', url, key };
      }
    }
    const p = readInfo();
    if (!checkInfo(p)) return;
    const btn = e.submitter || $('#f button[type=submit]'); btn.disabled = true; btn.textContent = '만드는 중…';
    try {
      const r = await api(conf).createFamily(p);
      store.set('sb_me', { conf, fkey: r.family_key });
      location.hash = '#/'; router();
      toast('등록됐어요. [표식] 탭에서 QR을 확인하세요');
    } catch (err) {
      btn.disabled = false; btn.textContent = '시작하기';
      toast(/function|schema|404|PGRST/.test(err.message) ? '서버에 설치 SQL이 아직 없어요' : '서버에 연결하지 못했어요');
    }
  };
}
function infoFields(f, open) {
  return `
    <label>어르신 호칭 <span class="tiny">(발견자 화면에 보여요)</span></label>
    <input name="nickname" maxlength="40" required value="${esc(f.nickname || '')}" placeholder="예: 김순자 어르신">

function emgField(k, pk, label, ph, f, tag) {

async function refresh(first) {
  try {
    const d = await M.A.dashboard(M.me.fkey);
    const prevTop = store.get('sb_seen', 0);
    const top = d.events.length ? d.events[0].id : 0;
    if (!first && M.dash && top > prevTop) {
      const fresh = d.events.filter(e => e.id > prevTop && e.kind !== 'ping' && e.kind !== 'reply');
      for (const e of fresh.reverse()) alertEvent(d.family, e);
    }
    store.set('sb_seen', top);
    const changed = !M.dash || JSON.stringify(M.dash) !== JSON.stringify(d);
    M.dash = d;
    if (changed && (M.tab === 'home')) drawHome();
    return d;
  } catch (e) {
    if (/family not found/.test(e.message)) { store.del('sb_me'); toast('등록 정보가 없어 처음 화면으로 갑니다'); location.hash = '#/'; router(); }
    else if (first) toast('서버에 연결하지 못했어요');
    return null;
  }
}
function alertEvent(f, e) {
  if (e.kind === 'checkin') { toast(`☀️ ${f.nickname} 오늘 안부가 왔어요`); return; }
  const title = e.kind === 'missed' ? `⚠️ ${f.nickname} 오늘 안부가 아직 없어요` : e.kind === 'sos' ? `🚑 ${f.nickname} 응급 상황 신고` : e.kind === 'open' ? `📳 ${f.nickname} 표식이 찍혔어요` : e.kind === 'scan' ? `🚨 ${f.nickname} 발견 신고` : e.kind === 'exit' ? `⚠️ ${f.nickname} 안심존 이탈` : `✅ ${f.nickname} 안심존 복귀`;
  const body = e.kind === 'missed' ? `${f.checkin_by}까지 안부 확인이 없었어요. 전화해 보세요.` : e.kind === 'sos' ? '누군가 어르신이 쓰러지셨거나 아프시다고 알렸어요. 지금 바로 확인하세요' : e.kind === 'open' ? '누군가 어르신을 발견하고 표식(팔찌·목걸이)을 찍었어요. 곧 위치나 전화가 올 수 있어요' : e.kind === 'scan' ? (e.lat != null ? '누군가 어르신을 발견하고 위치를 보냈어요. 눌러서 지도 보기' : '위치 없이 발견 알림이 왔어요') : KIND[e.kind];
  toast(title, 5000);
  if (navigator.vibrate) navigator.vibrate(e.kind === 'sos' ? [800, 200, 800, 200, 800] : [400, 200, 400]);
  try {
    if ('Notification' in window && Notification.permission === 'granted' && navigator.serviceWorker) {
      navigator.serviceWorker.ready.then(r => r.showNotification(title, { body, icon: 'icon-192.png', badge: 'icon-192.png', tag: 'sb-' + e.id, renotify: true, data: { url: BASE } }));
    }
  } catch {}
}

function go(tab) {
  M.tab = tab; store.set('sb_tab', tab);
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  if (M.map) { M.map.remove(); M.map = null; }
  if (M.zmap) { M.zmap.remove(); M.zmap = null; }
  window.scrollTo(0, 0);
  if (!M.dash) { app.innerHTML = '<p class="empty">불러오는 중…</p>'; refresh(true).then(d => d && go(tab)); return; }
  ({ home: drawHome, tag: drawTag, zone: drawZone, set: drawSet })[tab]();
  if (tab === 'home') refresh();
}

function todayCheckin(events) {
  const t0 = new Date(); t0.setHours(0, 0, 0, 0);
  return events.find(e => e.kind === 'checkin' && new Date(e.created_at) >= t0);
}
function deadlinePassed(by) {
  if (!by) return false;
  const [h, m] = by.split(':').map(Number), d = new Date(); d.setHours(h, m || 0, 0, 0);
  return Date.now() > d;
}
function checkinLine(f, events) {
  if (!f.checkin_by) return '';
  const c = todayCheckin(events);
  if (c) return `<p class="sub">☀️ 오늘 안부 ✓ ${new Date(c.created_at).toLocaleTimeString('ko-KR', { hour: 'numeric', minute: '2-digit' })}</p>`;
  return deadlinePassed(f.checkin_by)
    ? `<p class="sub" style="color:var(--red);font-weight:700">⚠️ ${f.checkin_by}이 지났는데 오늘 안부가 없어요. 전화해 보세요.</p>`
    : `<p class="sub">☀️ 오늘 안부 기다리는 중 (${f.checkin_by}까지)</p>`;
}
function checkMissedCheckin(f, events) {
  if (!f.checkin_by || todayCheckin(events) || !deadlinePassed(f.checkin_by)) return;
  const key = new Date().toDateString();
  if (store.get('sb_missed', '') === key) return;
  store.set('sb_missed', key);
  alertEvent(f, { id: 'missed-' + key, kind: 'missed' });
}
function replySheet() {
  const quick = ['지금 바로 갑니다', '10분 안에 도착해요', '30분 정도 걸려요. 곁에 있어 주시면 감사해요', '119를 불러 주세요', '근처 파출소로 모셔다 주실 수 있을까요?'];

  document.body.appendChild(box);
  const send = async t => { if (!t) return; try { await M.A.reply(M.me.fkey, t); box.remove(); toast('발견자 화면에 보냈어요'); refresh(); } catch { toast('보내지 못했어요'); } };
  box.querySelectorAll('.qk').forEach(b => b.onclick = () => send(quick[+b.dataset.i]));

async function drawMap(id, f, located) {
  if (!(await waitFor(() => window.L))) { $('#' + id).innerHTML = '<p class="empty">지도를 불러오지 못했어요</p>'; return; }
  const center = located[0] ? [located[0].lat, located[0].lng] : f.zone_lat != null ? [f.zone_lat, f.zone_lng] : [37.5665, 126.978];
  const map = L.map(id, { zoomControl: false, attributionControl: true }).setView(center, located[0] ? 16 : 13);
  M.map = map;
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);
  if (f.zone_lat != null) L.circle([f.zone_lat, f.zone_lng], { radius: f.zone_radius || 300, color: '#0B5E5E', weight: 2, fillOpacity: .1 }).addTo(map);
  const trail = located.filter(e => Date.now() - new Date(e.created_at) < 86400000).slice().reverse();
  if (trail.length > 1) L.polyline(trail.map(e => [e.lat, e.lng]), { color: '#E07A2E', weight: 4, opacity: .7 }).addTo(map);
  const col = { sos: '#8E1B12', scan: '#E07A2E', ping: '#0B5E5E', exit: '#C0392B', enter: '#5E9E2F' };
  trail.forEach(e => L.circleMarker([e.lat, e.lng], { radius: e.kind === 'ping' ? 4 : e.kind === 'sos' ? 10 : 7, color: '#fff', weight: 2, fillColor: col[e.kind], fillOpacity: 1 })
    .bindPopup(`${KIND[e.kind]}<br>${fmtTime(e.created_at)}`).addTo(map));
  if (located[0]) L.circleMarker([located[0].lat, located[0].lng], { radius: 12, color: '#E07A2E', weight: 4, fillColor: '#fff', fillOpacity: 1 }).bindPopup('마지막 위치').addTo(map);
}

    <h2>가족 함께 보기</h2>
    <p class="sub">이 링크를 연 가족도 같은 알림과 위치를 볼 수 있어요. 가족에게만 보내세요.</p>
    <button class="btn b-ghost" id="shareJoin">가족 초대 링크 보내기</button>
    <hr>
    <button class="btn b-ghost" id="rotate" style="color:var(--red)">팔찌·목걸이를 잃어버렸어요 (표식 새로 만들기)</button>
    <p class="tiny">예전 QR·NFC는 바로 쓸 수 없게 되고, 새 QR이 만들어집니다.</p>`;
  (async () => {
    if (!(await waitFor(() => window.qrcode))) { $('#qr').textContent = 'QR 도구를 불러오지 못했어요'; return; }
    const qr = qrcode(0, 'M'); qr.addData(url); qr.make();
    $('#qr').innerHTML = qr.createSvgTag({ cellSize: 6, margin: 2, scalable: true });
  })();

  $('#ckBy').onchange = async e => { try { await M.A.updateFamily(M.me.fkey, { checkin_by: e.target.value || null }); await refresh(); toast(e.target.value ? `${e.target.value}까지 안부가 없으면 알려 드릴게요` : '안부 알림을 껐어요'); } catch { toast('저장하지 못했어요'); } };
  const ckN = $('#ckNfc'); if (ckN) ckN.onclick = async () => {
    try { const w = new NDEFReader(); toast('안부용 스티커를 폰 뒷면에 대 주세요', 4000); await w.write({ records: [{ recordType: 'url', data: ckUrl }] }); toast('안부용 NFC 스티커에 썼어요 ✓'); }
    catch (e) { toast('쓰지 못했어요: ' + (e.message || e.name)); }
  };
  $('#png').onclick = () => qrPng(url, f.nickname);
  $('#shareComp').onclick = () => share('세이프브릿지 동행 모드', '이 링크를 열고 "동행 모드 켜기"를 눌러 주세요.', compUrl);
  $('#shareJoin').onclick = () => share('세이프브릿지 가족 초대', `${f.nickname} 안심 귀가 알림을 함께 받아요.`, joinUrl);
  $('#rotate').onclick = async () => {

    try { await M.A.rotateTag(M.me.fkey); await refresh(); drawTag(); toast('새 표식을 만들었어요. 새로 인쇄해 주세요'); } catch { toast('실패했어요'); }
  };

    catch (e) { toast('쓰지 못했어요: ' + (e.message || e.name)); }
  };
}
async function qrPng(url, name) {
  if (!window.qrcode) return;
  const qr = qrcode(0, 'M'); qr.addData(url); qr.make();
  const n = qr.getModuleCount(), cell = 14, pad = 40, size = n * cell + pad * 2;
  const c = document.createElement('canvas'); c.width = size; c.height = size + 90;
  const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
  g.fillStyle = '#111';
  for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) if (qr.isDark(r, k)) g.fillRect(pad + k * cell, pad + r * cell, cell, cell);
  g.fillStyle = '#0B5E5E'; g.font = '700 30px "IBM Plex Sans KR", sans-serif'; g.textAlign = 'center';
  g.fillText('휴대폰으로 찍어 주세요', size / 2, size + 20);
  g.fillStyle = '#555'; g.font = '22px "IBM Plex Sans KR", sans-serif'; g.fillText(`세이프브릿지 · ${name}`, size / 2, size + 60);
  const a = document.createElement('a'); a.href = c.toDataURL('image/png'); a.download = 'safebridge-qr.png'; a.click();
}

/* ---- 안심존 ---- */
function drawZone() {
  const f = M.dash.family;
  let center = f.zone_lat != null ? { lat: f.zone_lat, lng: f.zone_lng } : null;
  let radius = f.zone_radius || 300;
  app.innerHTML = `
    <h1>안심존</h1>
    <p class="sub">집이나 자주 가시는 곳을 중심으로 정해 두세요. 어르신 폰의 동행 모드가 켜져 있으면 벗어날 때 알려 드려요.</p>
    <div id="zmap"></div>
    <p class="tiny">지도를 눌러 중심을 옮길 수 있어요.</p>
    <button class="btn b-soft" id="here">지금 내 위치를 중심으로</button>
    <label>이름</label><input id="zname" maxlength="20" value="${esc(f.zone_name || '집')}">
    <label>반경</label>
    <select id="zr">${[100, 200, 300, 500, 1000, 2000].map(r => `<option value="${r}" ${r === radius ? 'selected' : ''}>${r >= 1000 ? r / 1000 + 'km' : r + 'm'}</option>`).join('')}</select>
    <button class="btn big b-teal" id="zsave">안심존 저장</button>
    ${f.zone_lat != null ? '<button class="btn b-ghost" id="zdel">안심존 지우기</button>' : ''}`;
  let marker = null, circle = null;
  const paint = () => {
    if (!M.zmap || !center) return;
    if (!marker) { marker = L.marker([center.lat, center.lng]).addTo(M.zmap); circle = L.circle([center.lat, center.lng], { radius, color: '#0B5E5E', weight: 2, fillOpacity: .12 }).addTo(M.zmap); }
    marker.setLatLng([center.lat, center.lng]); circle.setLatLng([center.lat, center.lng]); circle.setRadius(radius);
  };
  (async () => {
    if (!(await waitFor(() => window.L))) { $('#zmap').innerHTML = '<p class="empty">지도를 불러오지 못했어요</p>'; return; }
    M.zmap = L.map('zmap', { zoomControl: false }).setView(center ? [center.lat, center.lng] : [37.5665, 126.978], center ? 15 : 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(M.zmap);
    M.zmap.on('click', e => { center = { lat: e.latlng.lat, lng: e.latlng.lng }; paint(); });
    paint();
  })();
  $('#zr').onchange = e => { radius = +e.target.value; paint(); if (M.zmap && circle) M.zmap.fitBounds(circle.getBounds(), { padding: [20, 20] }); };
  $('#here').onclick = () => {
    if (!navigator.geolocation) return toast('위치를 쓸 수 없어요');
    toast('현재 위치를 찾는 중…');
    navigator.geolocation.getCurrentPosition(p => {
      center = { lat: p.coords.latitude, lng: p.coords.longitude }; paint();
      if (M.zmap) M.zmap.setView([center.lat, center.lng], 16);
    }, () => toast('위치 권한을 허용해 주세요'), { enableHighAccuracy: true, timeout: 10000 });
  };
  $('#zsave').onclick = async () => {
    if (!center) return toast('지도를 눌러 중심을 먼저 정해 주세요');
    try {
      await M.A.updateFamily(M.me.fkey, { zone_name: $('#zname').value.trim() || '안심존', zone_lat: center.lat, zone_lng: center.lng, zone_radius: radius });
      await refresh(); toast('안심존을 저장했어요');
    } catch { toast('저장하지 못했어요'); }
  };
  const del = $('#zdel');
  if (del) del.onclick = async () => {
    try { await M.A.updateFamily(M.me.fkey, { zone_name: null, zone_lat: null, zone_lng: null, zone_radius: null }); await refresh(); drawZone(); toast('안심존을 지웠어요'); } catch { toast('실패했어요'); }
  };
}

  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  app.innerHTML = `

    <form id="f">${infoFields(f, true)}<button class="btn big b-teal" type="submit" style="margin-top:18px">저장</button></form>
    <h2>알림</h2>
    <div class="card">
      ${perm === 'granted' ? '<p>✓ 알림이 켜져 있어요.</p>' : perm === 'unsupported' ? '<p class="sub">이 브라우저는 알림을 지원하지 않아요.</p>' : '<button class="btn b-teal" id="nperm">알림 켜기</button>'}

    </div>
    <h2>119안심콜도 함께 등록하세요</h2>
    <div class="card"><p class="sub">소방청 무료 서비스예요. 어르신 전화번호와 병력·복용약을 미리 등록해 두면, 그 번호로 119에 신고할 때 구급대가 정보를 알고 출동해요. 세이프브릿지는 <b>지나가던 사람이 표식을 찍을 때</b>, 119안심콜은 <b>어르신 폰으로 신고할 때</b> 도움이 됩니다.</p>
      <a class="btn b-soft" target="_blank" rel="noopener" href="https://www.119.go.kr">119안심콜 등록하러 가기</a></div>
    <h2>연결 상태</h2>
    <div class="card"><p>${c.mode === 'cloud' ? `서버 연결: <b>${esc(c.url.replace(/^https:\/\//, ''))}</b>` : '<b>체험 모드</b> — 이 폰 안에만 저장돼요'}</p>
      <p class="tiny">개인정보: 위치는 귀가 확인에만 쓰고, 동행 모드 위치는 30일 뒤 지워져요. 시험판이므로 실제 실종 상황에서는 반드시 112에 먼저 신고하세요.</p></div>
    <button class="btn b-ghost" id="leave" style="color:var(--red)">이 폰에서 나가기</button>
    <p class="tiny">${c.mode === 'local' ? '체험 모드 데이터가 모두 지워져요.' : '서버 기록은 남고, 가족 초대 링크로 다시 들어올 수 있어요.'}</p>
    <p class="tiny" style="text-align:center;margin-top:24px">세이프브릿지 시험판 v0.1 · 문의 050-6520-0440</p>`;
  $('#f').onsubmit = async e => {
    e.preventDefault();
    const p = readInfo(); if (!checkInfo(p)) return;
    try { await M.A.updateFamily(M.me.fkey, p); await refresh(); toast('저장했어요'); } catch { toast('저장하지 못했어요'); }
  };
  const np = $('#nperm'); if (np) np.onclick = () => askNotify(true);
  $('#leave').onclick = () => {
    if (!confirm('이 폰에서 세이프브릿지 등록을 지울까요?')) return;
    if (c.mode === 'local') store.del(LDB);
    ['sb_me', 'sb_seen', 'sb_tab'].forEach(store.del);
    location.hash = '#/'; router();
  };
}
async function askNotify(explicit) {
  if (!('Notification' in window)) { if (explicit) toast('홈 화면에 추가한 뒤 다시 눌러 주세요'); return; }
  if (Notification.permission === 'default') {
    const r = await Notification.requestPermission();
    if (r === 'granted') toast('알림을 켰어요');
    if (M && M.tab === 'set') drawSet();
  } else if (explicit) toast(Notification.permission === 'granted' ? '이미 켜져 있어요' : '설정에서 알림을 허용해 주세요');
}

/* ============ 스티커 시트 인쇄 ============ */
async function renderPrint(me) {
  app.innerHTML = '<p class="empty">불러오는 중…</p>';
  let d; try { d = await api(me.conf).dashboard(me.fkey); } catch { app.innerHTML = '<p class="empty">정보를 불러오지 못했어요. <a href="#/">돌아가기</a></p>'; return; }

  const phone = f.safe_number || '', code = f.short_code ? esc(f.short_code) : '';

    <div class="noprint">

      <button class="btn big b-teal" id="doPrint">🖨️ 인쇄하기</button>
      <p class="tiny">시험용은 일반 A4 라벨지에 인쇄해 잘라 쓰세요. 옷에 붙일 것은 다리미 부착용 방수 라벨지, 지팡이용은 야광 라벨지를 쓰면 오래갑니다. 아이폰은 인쇄 화면에서 공유 → 파일에 저장(PDF)도 돼요.</p>

        <div style="font-size:3.8mm;margin-top:1.5mm">지병·복용약 확인 · 가족 자동 연락${phone ? ` · 보호자 ${esc(phone)}` : ''}</div>

    const ck = `<div class="lbl fridge ckcard" style="border-color:#E0A800;width:80mm">

}
